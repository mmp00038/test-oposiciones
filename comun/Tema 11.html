<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Interactivo - Examen 23.04.2026</title>
  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="selector-box">
      <select id="block-select" onchange="changeBlock()">
        <option value="all">Examen Completo (100 preguntas)</option>
        <option value="b1">Bloque 1: Preguntas 1 - 25</option>
        <option value="b2">Bloque 2: Preguntas 26 - 50</option>
        <option value="b3">Bloque 3: Preguntas 51 - 75</option>
        <option value="b4">Bloque 4: Preguntas 76 - 100</option>
      </select>
    </div>
    <div class="stat-box">
      <span class="stat-label">Tiempo</span>
      <span class="stat-value" id="timer">⏱️ 00:00</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Contestadas</span>
      <span class="stat-value" id="progress">📝 0/0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Aciertos</span>
      <span class="stat-value" id="accuracy">🎯 0%</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Nota</span>
      <span class="stat-value" id="score">⭐ 0.00/10</span>
    </div>
  </header>

  <div class="container">
    <h1 class="test-title" id="test-title">EXAMEN TIPO TEST (23.04.2026)</h1>
    <div id="quiz-container"></div>
    <div class="reset-container">
      <button class="reset-btn" onclick="resetQuiz()">Reiniciar Test</button>
    </div>
  </div>

  <script>
    const allQuestions = [
      {
        question: "1. Una Administración autonómica invoca el Preámbulo constitucional para justificar una restricción singular del acceso a información pública ambiental, afirmando que la defensa del interés general permite modular cualquier expectativa individual. ¿Cuál es el razonamiento más sólido frente a esa tesis?",
        options: [
          "A) El Preámbulo orienta, pero no sustituye las garantías normativas del bloque de constitucionalidad ni habilita por sí mismo restricciones singulares.",
          "B) El Preámbulo tiene siempre valor normativo superior al articulado.",
          "C) Toda restricción basada en el interés general queda excluida del control judicial.",
          "D) El Preámbulo puede desplazar cualquier ley ordinaria cuando la Administración motive la medida."
        ],
        correct: 0,
        justification: "El Preámbulo tiene valor interpretativo y político, pero no habilita por sí mismo restricciones administrativas al margen del articulado constitucional y legal[cite: 340]."
      },
      {
        question: "2. En un debate parlamentario andaluz se sostiene que, al residir la soberanía en el pueblo español, el Parlamento de Andalucía no puede ejercer control político efectivo sobre el Consejo de Gobierno. ¿Qué respuesta es la más correcta?",
        options: [
          "A) Es cierta, porque todo control político corresponde exclusivamente a las Cortes Generales.",
          "B) Es incorrecta: la soberanía nacional no impide que los órganos de autogobierno ejerzan las funciones de control previstas en la Constitución y en el Estatuto.",
          "C) Solo sería correcta si el control se refiere a materias estatales.",
          "D) La afirmación depende de que el Parlamento actúe por mayoría absoluta."
        ],
        correct: 1,
        justification: "La soberanía nacional no excluye la autonomía política de las comunidades autónomas ni sus instituciones de control[cite: 340]."
      },
      {
        question: "3. Una ley ordinaria estatal regula de forma completa el régimen electoral general y añade una cláusula que permite al Gobierno alterar por reglamento elementos esenciales del sistema de sufragio. ¿Dónde se sitúa el problema principal?",
        options: [
          "A) En la prohibición de la costumbre constitucional.",
          "B) En la libre configuración reglamentaria del Ejecutivo.",
          "C) En la reserva de ley orgánica para el régimen electoral general y en los límites del reglamento sobre sus elementos esenciales.",
          "D) En la imposibilidad de que el Estado legisle en materia electoral."
        ],
        correct: 2,
        justification: "El régimen electoral general está reservado a ley orgánica y sus elementos esenciales no pueden quedar remitidos sin límites al reglamento[cite: 340]."
      },
      {
        question: "4. Durante una visita institucional, el Rey expresa una opinión política no refrendada y un órgano administrativo pretende otorgarle efectos ejecutivos inmediatos. ¿Cuál es la calificación más precisa?",
        options: [
          "A) La opinión regia produce efectos directos por la inviolabilidad de la Corona.",
          "B) Solo produciría efectos si se publica en el BOE como real comunicación.",
          "C) La ausencia de refrendo carece de toda relevancia si existe interés general.",
          "D) La actuación es jurídicamente inviable: los actos del Rey requieren refrendo en los casos constitucionalmente previstos y la inviolabilidad no convierte una opinión en decisión ejecutiva."
        ],
        correct: 3,
        justification: "La inviolabilidad del Rey no sustituye las exigencias constitucionales de refrendo ni convierte manifestaciones políticas en actos con eficacia jurídica directa[cite: 340]."
      },
      {
        question: "5. En una comisión parlamentaria se afirma que la libertad ideológica protege únicamente convicciones íntimas y nunca la negativa del ciudadano a declarar sobre ellas en un procedimiento administrativo. ¿Qué valoración es más ajustada?",
        options: [
          "A) Es incorrecta: la libertad ideológica incluye la prohibición de obligar a declarar sobre la propia ideología, religión o creencias, salvo los límites constitucionales del orden público.",
          "B) Es correcta, porque la dimensión externa de la libertad ideológica no existe en la Constitución.",
          "C) Solo sería falsa respecto de los extranjeros.",
          "D) Depende de que el procedimiento sea sancionador."
        ],
        correct: 0,
        justification: "La Constitución reconoce la libertad ideológica y prohíbe imponer la declaración sobre ideología, religión o creencias[cite: 341]."
      },
      {
        question: "6. Un reglamento prevé que los detenidos por infracciones administrativas graves puedan permanecer privados de libertad cuatro días para practicar comprobaciones documentales. ¿Qué objeción es más sólida?",
        options: [
          "A) Es válida si la medida se motiva por la complejidad del expediente.",
          "B) Vulnera la garantía constitucional de la libertad personal y el límite máximo de la detención preventiva, que solo cabe en el marco y por las causas legalmente previstas.",
          "C) Solo sería inválida si faltara control parlamentario posterior.",
          "D) Es correcta respecto de extranjeros."
        ],
        correct: 1,
        justification: "Un reglamento no puede crear supuestos de privación de libertad ni superar los límites constitucionalmente previstos[cite: 341]."
      },
      {
        question: "7. Un órgano administrativo autoriza la entrada en un domicilio particular para inspección ambiental por mera conveniencia probatoria, sin consentimiento del titular ni resolución judicial. ¿Cuál es la valoración correcta?",
        options: [
          "A) Es admisible cuando exista interés público intenso.",
          "B) Solo sería legítimo si lo acuerda la policía autonómica.",
          "C) Vulnera la inviolabilidad domiciliaria, salvo consentimiento o resolución judicial, además de los supuestos constitucionales excepcionales.",
          "D) Queda cubierto por la autotutela administrativa."
        ],
        correct: 2,
        justification: "La entrada en domicilio exige consentimiento o resolución judicial, salvo los casos constitucionales excepcionales como flagrante delito[cite: 341]."
      },
      {
        question: "8. Una Administración intenta interceptar comunicaciones electrónicas de una empresa para verificar el cumplimiento de obligaciones ambientales, con una simple autorización administrativa interna fundada en razones de urgencia. ¿Cuál es la respuesta más precisa?",
        options: [
          "A) Es válida si el fin perseguido es ambiental.",
          "B) Es válida respecto de personas jurídicas, porque el secreto de las comunicaciones solo protege a las personas físicas.",
          "C) No existe problema si la medida es temporal.",
          "D) La medida desconoce la garantía constitucional del secreto de las comunicaciones, que solo puede limitarse con las garantías legalmente exigibles y control jurisdiccional cuando proceda."
        ],
        correct: 3,
        justification: "El secreto de las comunicaciones exige autorización judicial previa para su intervención y no puede basarse en una simple medida administrativa[cite: 341]."
      },
      {
        question: "9. En un procedimiento disciplinario se rechaza toda prueba propuesta por el expedientado con la fórmula estereotipada de que 'la Administración ya dispone de convicción suficiente'. ¿Qué perspectiva constitucional resulta más exigente?",
        options: [
          "A) La denegación inmotivada puede comprometer el derecho de defensa y las garantías procedimentales cuando impide la contradicción sobre hechos relevantes.",
          "B) Solo se afecta la eficacia administrativa.",
          "C) No existe problema fuera del proceso judicial.",
          "D) La Administración puede prescindir de la prueba de descargo si actúa en vía interna."
        ],
        correct: 0,
        justification: "La denegación inmotivada de prueba pertinente puede vulnerar el derecho de defensa e impedir la contradicción adecuada[cite: 341, 342]."
      },
      {
        question: "10. Un órgano administrativo andaluz niega el acceso a un cargo público a una aspirante porque durante una entrevista manifestó opiniones críticas con la política ambiental del Gobierno. La decisión no se apoya en méritos ni capacidad. ¿Qué enfoque es el más correcto?",
        options: [
          "A) Se vulneran la igualdad en el acceso a funciones públicas según mérito y capacidad y la prohibición de discriminación por opinión.",
          "B) Solo se vulnera la libertad de expresión.",
          "C) La decisión es inmune al control por ser un puesto de confianza técnica.",
          "D) La objeción solo existe si el puesto depende del Estado."
        ],
        correct: 0,
        justification: "El acceso a funciones públicas debe ajustarse a mérito y capacidad, sin que quepan discriminaciones por razón de opinión[cite: 342]."
      },
      {
        question: "11. Se convoca una manifestación ante una sede administrativa y la autoridad gubernativa la prohíbe de plano alegando que el contenido de los lemas resulta hostil hacia el Ejecutivo autonómico. No consta riesgo concreto para personas o bienes. ¿Cuál es la respuesta más sólida?",
        options: [
          "A) La prohibición es válida por razón de neutralidad institucional.",
          "B) Solo sería dudosa si la convocatoria fuera sindical.",
          "C) La prohibición es dudosa porque el derecho de reunión no puede limitarse por el contenido crítico del mensaje, sino por riesgos ciertos para el orden público con peligro para personas o bienes.",
          "D) Es correcta si la sede pertenece a la Junta de Andalucía."
        ],
        correct: 2,
        justification: "Las limitaciones al derecho de reunión exigen razones probadas de alteración del orden público con peligro para personas o bienes, no discrepancias políticas[cite: 342]."
      },
      {
        question: "12. Un alumno sostiene que el derecho de asociación no protege a entidades que persiguen fines de defensa ambiental porque la Constitución solo ampara asociaciones de interés económico o profesional. ¿Qué contestación es correcta?",
        options: [
          "A) Es correcto salvo que exista subvención pública.",
          "B) Depende de que la asociación tenga ánimo de lucro.",
          "C) Solo las asociaciones inscritas antes de 1978 quedan protegidas.",
          "D) Es incorrecto: la libertad de asociación ampara asociaciones con fines lícitos de muy diversa naturaleza, también cívica o ambiental."
        ],
        correct: 3,
        justification: "La libertad de asociación ampara la creación de entidades lícitas para fines cívicos, sociales o ambientales[cite: 342]."
      },
      {
        question: "13. Una Administración autonómica publica datos personales especialmente sensibles de un denunciante ambiental para ilustrar la trazabilidad del expediente. ¿Qué parámetro constitucional es más directamente afectado?",
        options: [
          "A) La protección constitucional del honor, la intimidad y el mandato de limitar el uso de la informática para garantizar derechos.",
          "B) El derecho de propiedad del afectado.",
          "C) La libertad sindical.",
          "D) Solo la publicidad activa administrativa."
        ],
        correct: 0,
        justification: "La difusión de datos personales sensibles afecta directamente a la intimidad y al mandato de limitar el uso de la informática[cite: 342]."
      },
      {
        question: "14. Un reglamento crea una sanción pecuniaria de cuantía desproporcionada y una privación de derechos no prevista en ninguna ley previa, invocando razones de emergencia ambiental. ¿Qué análisis constitucional es más acertado?",
        options: [
          "A) Es válido si lo firma el Consejo de Gobierno.",
          "B) Se comprometen la legalidad sancionadora y las garantías procedimentales, además del derecho de propiedad en su dimensión constitucional.",
          "C) Solo plantea un problema de técnica reglamentaria.",
          "D) Las sanciones ambientales no exigen norma con rango de ley."
        ],
        correct: 1,
        justification: "Las sanciones administrativas exigen cobertura legal previa y no pueden ser tipificadas ex novo por un reglamento[cite: 343]."
      },
      {
        question: "15. En un seminario se afirma que todas las leyes que regulan materias incluidas en el Título I de la Constitución son automáticamente leyes orgánicas. ¿Qué respuesta es más precisa?",
        options: [
          "A) Es correcta porque todo el Título I exige ley orgánica.",
          "B) Solo son orgánicas si regulan deberes ciudadanos.",
          "C) Es inexacta: la reserva de ley orgánica se refiere, entre otros supuestos, al desarrollo de los derechos fundamentales y libertades públicas en el ámbito constitucionalmente previsto, no a todo el Título I indistintamente.",
          "D) La cuestión carece de relevancia porque todas las leyes tienen el mismo rango."
        ],
        correct: 2,
        justification: "La reserva de ley orgánica concierne a la Sección 1ª del Capítulo II del Título I, no a la totalidad del Título I de la CE[cite: 343]."
      },
      {
        question: "16. En el Parlamento andaluz se plantea que la inviolabilidad de la Cámara permite sustraer del control jurisdiccional cualquier acuerdo administrativo interno sobre personal, contratación o presupuesto. ¿Cuál es la mejor respuesta?",
        options: [
          "A) Es correcta por la separación de poderes.",
          "B) Solo el Tribunal Constitucional podría revisar esos actos.",
          "C) La afirmación es válida respecto de cualquier contrato parlamentario.",
          "D) La inviolabilidad institucional no convierte en inmunes al control todos los actos internos de naturaleza administrativa."
        ],
        correct: 3,
        justification: "Los actos administrativos y de gestión interna del Parlamento están plenamente sometidos al control de los tribunales ordinarios[cite: 343]."
      },
      {
        question: "17. En una sesión de investidura andaluza se defiende que, al no obtenerse mayoría absoluta en primera votación, el candidato queda automáticamente descartado y debe abrirse un procedimiento nuevo de propuesta. ¿Qué juicio es más ajustado?",
        options: [
          "A) No es correcto: el sistema prevé una segunda votación con umbral distinto, precisamente para facilitar la formación de gobierno sin vaciar la legitimación parlamentaria.",
          "B) Es correcto, porque la segunda votación solo existe para el Congreso de los Diputados.",
          "C) Solo sería correcto si hubiera varios candidatos.",
          "D) Depende del reglamento interno del grupo mayoritario."
        ],
        correct: 0,
        justification: "De no obtenerse mayoría absoluta en la primera votación, se celebra una nueva votación 48 horas después requiriéndose solo mayoría simple[cite: 343]."
      },
      {
        question: "18. La Presidencia de la Junta nombra dos Vicepresidencias y, meses después, cesa a una de sus titulares. Se sostiene que la Vicepresidencia subsiste vacante hasta nueva designación. Según el esquema legal aplicable, ¿qué interpretación es más correcta?",
        options: [
          "A) La Vicepresidencia subsiste siempre como órgano estable.",
          "B) El cese lleva aparejada la supresión del órgano cuando así lo prevé la normativa específica de la Vicepresidencia.",
          "C) El cese del titular no tiene efecto orgánico alguno.",
          "D) Solo desaparece si lo acuerda el Parlamento."
        ],
        correct: 1,
        justification: "La Ley del Gobierno de Andalucía prevé que el cese del titular de una Vicepresidencia supone la supresión del órgano salvo reestructuración[cite: 343, 344]."
      },
      {
        question: "19. Una norma autonómica atribuye al Presidente de la Junta un poder unilateral para impedir comparecencias de miembros del Consejo de Gobierno ante el Parlamento cuando considere que las preguntas son 'inoportunas'. ¿Qué objeción institucional es más sólida?",
        options: [
          "A) Es válida por la posición prevalente del Presidente.",
          "B) Solo sería objetable si afectara al presupuesto.",
          "C) Desnaturaliza la función de control parlamentario sobre el Ejecutivo y altera el equilibrio institucional previsto en el Estatuto.",
          "D) Queda amparada en la autonomía organizativa de la Junta."
        ],
        correct: 2,
        justification: "Un veto unilateral del Presidente a las comparecencias parlamentarias atenta contra la función estatutaria de control del Parlamento sobre el Gobierno[cite: 344]."
      },
      {
        question: "20. Una menor de 16 años presenta una solicitud en un procedimiento administrativo de juventud sin representante y el instructor la inadmite directamente por carecer de plena capacidad civil. ¿Qué valoración es más correcta?",
        options: [
          "A) Es correcta porque la capacidad administrativa coincide siempre con la civil plena.",
          "B) Solo podría actuar si estuviera emancipada.",
          "C) Es válida si el acto es desfavorable.",
          "D) La exigencia es excesiva: en vía administrativa puede reconocerse capacidad de obrar a menores cuando el ordenamiento les habilita para la defensa de sus intereses."
        ],
        correct: 3,
        justification: "Los menores tienen capacidad de obrar para actuar en vía administrativa sin asistencia cuando el ordenamiento les habilite (art. 3 LPAC)[cite: 344]."
      },
      {
        question: "21. En un procedimiento concurren varios copropietarios afectados por una misma resolución. Todos presentan escritos separados, pero el órgano decide notificar solo al primero porque no designaron representante común. ¿Cuál es la solución legal más ajustada?",
        options: [
          "A) Debe notificar a todos siempre, sin excepción.",
          "B) La Administración puede considerar representante al que figure en primer término, salvo manifestación en contrario o designación expresa de otro.",
          "C) Debe suspender el procedimiento hasta que nombren representante formal ante notario.",
          "D) Solo puede actuar frente a quien inició el expediente."
        ],
        correct: 1,
        justification: "Si varios interesados formulan una solicitud o comparecen sin designar representante, la actuación se entenderá con el que figure en primer término (art. 5 LPAC)[cite: 344]."
      },
      {
        question: "22. Una empresa aporta un apoderamiento inscrito en un registro electrónico de apoderamientos distinto del de la Administración actuante. El instructor lo rechaza porque no fue otorgado ante su propia sede electrónica. ¿Qué respuesta es más precisa?",
        options: [
          "A) El rechazo es correcto, porque cada Administración solo reconoce sus propios registros.",
          "B) El sistema legal admite registros electrónicos de apoderamientos interoperables en los términos previstos, por lo que el rechazo automático es incorrecto.",
          "C) La representación solo se acredita mediante poder notarial en papel.",
          "D) Solo cabe representación apud acta presencial."
        ],
        correct: 1,
        justification: "Los registros electrónicos de apoderamientos son interoperables entre sí conforme al art. 6 LPAC, por lo que su rechazo directo es ilegal[cite: 344]."
      },
      {

        options: [

          "D) Depende de que la denuncia sea anónima."

      {
        question: "55. Antes de iniciar formalmente un procedimiento sancionador, la Administración practica actuaciones previas muy intensas y adopta de hecho medidas limitativas estables sin acuerdo formal. ¿Qué juicio es más sólido?",

        question: "57. Un procedimiento de responsabilidad patrimonial se inicia a solicitud del lesionado, pero el órgano pretende reconducirlo sin más a un expediente genérico y prescinde de la identificación del daño, la evaluación económica y la fecha del hecho lesivo. ¿Qué objeción es más precisa?",

      {
        question: "58. La Administración recibe una solicitud incompleta y, sin requerir subsanación, la inadmite de plano porque 'el ciudadano debió presentarla perfectamente desde el principio'. ¿Cuál es la respuesta correcta?",

      {
        question: "59. Una empresa presenta una declaración responsable para iniciar una actividad y la Administración sostiene que, desde su presentación, no puede comprobar nada hasta que concluya la actividad. ¿Qué respuesta es más ajustada?",

      {
        question: "60. El órgano instructor rechaza todas las alegaciones presentadas durante la tramitación alegando que solo se pueden formular al inicio y al final del procedimiento. ¿Qué respuesta es la más correcta?",

      {
        question: "62. En un expediente técnico complejo se solicita un informe preceptivo y el órgano resolutor decide prescindir de él porque ya dispone de criterio político suficiente. ¿Qué objeción es más sólida?",

      {
        question: "63. En un procedimiento que afecta directamente a un administrado, la Administración resuelve sin darle traslado previo del expediente ni ocasión de formular observaciones finales sobre documentos decisivos incorporados en la fase de instrucción. ¿Qué valoración procede?",

      {
        question: "64. En un procedimiento con relevante incidencia general, el órgano instructor abre información pública, pero rechaza incorporar al expediente las observaciones recibidas por personas no personadas formalmente. ¿Qué criterio es el más correcto?",

      {

        question: "66. Durante un procedimiento sancionador, el presunto infractor reconoce su responsabilidad y abona la multa con reducciones legalmente previstas. El instructor sostiene que ello carece de efectos sobre la terminación porque debe dictarse resolución ordinaria completa. ¿Qué valoración procede?",

      {
        question: "67. En un procedimiento bilateral, la Administración y el interesado alcanzan un acuerdo sobre medidas reparadoras compatibles con el interés público y con el marco legal sectorial. El instructor rechaza siquiera examinarlo porque 'la Administración nunca puede terminar convencionalmente'. ¿Qué respuesta es más precisa?",

      {
        question: "68. Antes de resolver, el órgano aprecia lagunas relevantes en la instrucción y decide recabar actuaciones complementarias, pero no da traslado de su resultado a quienes puedan verse afectados. ¿Qué problema aparece?",

      {

      {

        question: "85. Una delegación territorial dicta un acto que no agota la vía administrativa y el interesado interpone directamente recurso potestativo de reposición ante la propia delegación. ¿Qué respuesta es más ajustada conforme al esquema organizativo estudiado?",
        options: [
          "A) Cuando el acto no agota la vía administrativa, el cauce ordinario es el recurso de alzada ante el órgano competente superior en la materia.",
          "B) Es correcto porque toda resolución admite reposición previa.",
          "C) Solo cabría reclamación económico-administrativa.",
          "D) No existe recurso alguno en la organización territorial andaluza."
        ],
        correct: 0,
        justification: "Los actos que no agotan la vía administrativa solo son susceptibles de recurso de alzada ante el órgano jerárquicamente superior[cite: 358]."
      },
      {
        question: "86. La Administración de la Junta aprueba una planificación interdepartamental vinculante para varios centros directivos, pero una consejería sostiene que el principio de coordinación equivale a jerarquía sobre todos ellos por parte del órgano que aprobó el plan. ¿Qué respuesta es más correcta?",
        options: [
          "A) La coordinación no se identifica sin más con jerarquía; articula criterios y acción conjunta dentro del sistema integrado de órganos y entidades en los términos legales.",
          "B) Jerarquía y coordinación son conceptos equivalentes en la LAJA.",
          "C) La coordinación siempre crea subordinación jerárquica plena.",
          "D) Solo existe coordinación con otras administraciones, nunca dentro de la Junta."
        ],
        correct: 0,
        justification: "La coordinación administrativa permite armonizar actuaciones sin implicar subordinación jerárquica directa entre órganos independientes[cite: 358]."
      },
      {
        question: "87. Una persona invoca el principio de buena administración frente a la Junta porque su expediente fue resuelto fuera de plazo, sin motivación individualizada y con trato desigual respecto de casos similares. ¿Qué núcleo de pretensiones encaja mejor con ese principio en la LAJA?",
        options: [
          "A) Se limita a exigir cortesía administrativa.",
          "B) Comprende, entre otros, trato equitativo, imparcial y objetivo, resolución en plazo razonable, proporcionalidad y acceso a la información y documentación en los términos legales.",
          "C) Sustituye al régimen de recursos administrativos.",
          "D) Impone siempre la estimación de la solicitud."
        ],
        correct: 1,
        justification: "El derecho a una buena administración engloba el trato imparcial, la motivación de los actos, el respeto a los plazos y el acceso a los archivos (art. 31 Estatuto)[cite: 358]."
      },
      {
        question: "88. Un reglamento autonómico prohíbe con carácter general toda actividad sindical del personal al servicio de la Administración de la Junta durante periodos electorales, sin distinguir funciones ni justificar riesgo alguno. ¿Qué parámetro constitucional resulta más directamente comprometido?",
        options: [
          "A) Solo la libertad ideológica.",
          "B) La exclusividad presupuestaria del Parlamento.",
          "C) El principio de eficacia administrativa.",
          "D) La libertad sindical, cuya restricción no puede establecerse indiscriminadamente por reglamento al margen de la ley y de la proporcionalidad."
        ],
        correct: 3,
        justification: "Cualquier restricción del derecho fundamental de libertad sindical está sujeta a reserva de ley y al juicio de proporcionalidad[cite: 359]."
      },
      {
        question: "89. En un procedimiento administrativo, el órgano insiste en que un informe técnico interno basta para destruir la presunción de inocencia del expedientado, aunque no exista prueba de cargo suficientemente contrastada. ¿Qué respuesta es la más correcta?",
        options: [
          "A) No lo es: en el ámbito sancionador la presunción de inocencia exige prueba de cargo suficiente y obtenida con respeto a las garantías.",
          "B) Es correcta si el informe lo firma un funcionario.",
          "C) Solo importa que el informe sea posterior a la denuncia.",
          "D) La presunción de inocencia solo rige en el proceso penal judicial."
        ],
        correct: 0,
        justification: "El principio de presunción de inocencia exige la existencia de prueba de cargo válida y suficiente aportada al expediente sancionador[cite: 359]."
      },
      {
        question: "90. Se sostiene en clase que, por representar al pueblo andaluz, el Parlamento puede ejercer funciones jurisdiccionales propias sobre conflictos entre particulares si así lo prevé su Reglamento. ¿Qué objeción constitucional es más sólida?",
        options: [
          "A) Sería válido si las partes lo consienten.",
          "B) La potestad jurisdiccional corresponde a jueces y tribunales; la representación política parlamentaria no autoriza a asumir funciones jurisdiccionales propias.",
          "C) Solo sería inválido fuera del territorio andaluz.",
          "D) Depende de autorización del CGPJ."
        ],
        correct: 1,
        justification: "El ejercicio de la potestad jurisdiccional juzgando y haciendo ejecutar lo juzgado corresponde en exclusiva a los juzgados y tribunales (art. 117 CE)[cite: 359]."
      },
      {
        question: "91. En un procedimiento administrativo, la Administración decide no practicar notificación personal porque considera que el interesado pudo conocer la resolución al haberse comentado en una rueda de prensa institucional. ¿Qué respuesta es más ajustada?",
        options: [
          "A) La publicidad mediática puede sustituir siempre a la notificación.",
          "B) Solo importa si el interesado reconoce haber visto la noticia.",
          "C) La notificación debe seguir los cauces legales; el conocimiento extraprocedimental o mediático no reemplaza por sí mismo la práctica formal exigida.",
          "D) La rueda de prensa equivale a publicación oficial."
        ],
        correct: 2,
        justification: "El conocimiento informal o a través de medios de comunicación no surte los efectos legales de una notificación individualizada[cite: 359]."
      },
      {
        question: "92. Un órgano pretende declarar nulo un acto porque discrepa de su oportunidad, aunque reconoce que fue dictado por órgano competente, con procedimiento y contenido ajustados a ley. ¿Cuál es la respuesta correcta?",
        options: [
          "A) La oportunidad es causa autónoma de nulidad de pleno derecho.",
          "B) Todo acto administrativo puede anularse por cambio de criterio político.",
          "C) Basta con una motivación reinforced del nuevo órgano.",
          "D) La nulidad no puede fundarse en una mera reconsideración de oportunidad cuando no concurre causa legal de invalidez."
        ],
        correct: 3,
        justification: "Los motivos de invalidez están tasados legalmente por lo que un simple desacuerdo sobre la oportunidad no justifica la nulidad del acto[cite: 359]."
      },
      {
        question: "93. Una universidad pública andaluza niega toda colaboración a la Oficina Andaluza contra el Fraude alegando autonomía universitaria absoluta frente a cualquier requerimiento. ¿Qué solución es más ajustada según el material subido?",
        options: [
          "A) La Oficina puede ejercer determinadas funciones también respecto de universidades públicas andaluzas, precisamente respetando la autonomía universitaria en los términos legales.",
          "B) La autonomía universitaria elimina toda posibilidad de actuación de la Oficina.",
          "C) La universidad solo debe colaborar con el Tribunal de Cuentas.",
          "D) La Oficina solo puede actuar en ayuntamientos y diputaciones."
        ],
        correct: 0,
        justification: "La Oficina Antifraude extiende su ámbito competencial sobre el sector público autonómico respetando las prerrogativas constitucionales de cada institución[cite: 360]."
      },
      {
        question: "94. Una persona jurídica obligada a relacionarse electrónicamente presenta recurso en papel el último día de plazo en una oficina de asistencia. La Administración lo digitaliza y, sin requerir subsanación, lo tramita como si se hubiera presentado correctamente desde el inicio. ¿Qué análisis es más fino?",
        options: [
          "A) Es correcto porque toda oficina puede convertir en válida cualquier presentación en papel de sujetos obligados.",
          "B) Solo sería incorrecto en recursos sancionadores.",
          "C) La ley prevé para los obligados la exigencia de subsanación mediante presentación electrónica, con efectos que deben manejarse conforme al régimen legal, no por simple convalidación automática.",
          "D) La digitalización siempre sana el defecto retroactivamente sin más."
        ],
        correct: 2,
        justification: "Frente a solicitudes o recursos presentados en papel por sujetos obligados debe requerirse subsanación electrónica (art. 68.4 LPAC)[cite: 360]."
      },
      {
        question: "95. El Consejo de Gobierno defiende que puede negarse a facilitar al Parlamento andaluz la información necesaria para una comisión de estudio sobre una política pública porque 'la colaboración entre poderes es solo una cortesía política'. ¿Qué respuesta es la más ajustada?",
        options: [
          "A) Es correcta por la separación de poderes.",
          "B) Solo debe colaborar si el Parlamento lo solicita por unanimidad.",
          "C) La relación con el Parlamento no se agota en la cortesía: el Ejecutivo tiene deberes de comparecencia, información y auxilio en los términos estatutarios y reglamentarios.",
          "D) La información solo puede entregarse a los grupos del Gobierno."
        ],
        correct: 2,
        justification: "El Gobierno está legalmente obligado a remitir al Parlamento las informaciones y documentos que la Cámara le requiera en ejercicio de sus competencias[cite: 360]."
      },
      {
        question: "96. Una Administración decide resolver un procedimiento sin incorporar al expediente un informe técnico que sí tuvo en cuenta materialmente para decidir, a fin de evitar que el interesado lo discuta. ¿Qué objeción es la más sólida?",
        options: [
          "A) Puede hacerlo si el informe es interno.",
          "B) Solo sería grave en procedimientos judiciales.",
          "C) No existe problema si el acto final está firmado.",
          "D) La ocultación de un antecedente materialmente utilizado desnaturaliza el expediente y compromete contradicción, motivación y defensa."
        ],
        correct: 3,
        justification: "Ocultar o sustraer informes o antecedentes tenidos en cuenta para resolver vulnera el principio de contradicción y menoscaba el derecho de defensa[cite: 360]."
      },
      {
        question: "97. Se aprueba un acto administrativo cuya parte dispositiva es compatible con la ley, pero su órgano emisor persigue realmente un fin ajeno al previsto por la norma habilitante. ¿Qué categoría clásica describe mejor el vicio?",
        options: [
          "A) Desviación de poder.",
          "B) Error material.",
          "C) Caducidad.",
          "D) Suspensión del procedimiento."
        ],
        correct: 0,
        justification: "La desviación de poder se define como el ejercicio de potestades administrativas para fines distintos de los fijados en el ordenamiento (art. 48.1 LPAC)[cite: 360, 361]."
      },
      {
        question: "98. Un alumno afirma que la Constitución solo vincula a jueces y parlamentos, pero no a la Administración ordinaria, que puede moverse con mayor flexibilidad mientras no haya ley que la contradiga. ¿Qué respuesta es correcta?",
        options: [
          "A) Es correcto porque la Administración se rige por la oportunidad.",
          "B) Es falso: la Administración sirve con objetividad al interés general y actúa con sometimiento pleno a la Constitución, a la ley y al Derecho.",
          "C) Solo se aplica esa vinculación a la Administración General del Estado.",
          "D) La sujeción plena solo aparece en la Ley 39/2015, no en la Constitución."
        ],
        correct: 1,
        justification: "La Administración actúa con sometimiento pleno a la CE, a la ley y al Derecho (art. 103 CE)[cite: 361]."
      },
      {
        question: "99. En un procedimiento donde concurren múltiples interesados, la Administración decide resolver sin identificar adecuadamente a varios de ellos porque entiende que, al no haber comparecido todos desde el inicio, ya no deben ser tenidos en cuenta. ¿Qué análisis es más preciso?",
        options: [
          "A) Es correcto, porque la condición de interesado solo se adquiere al inicio del procedimiento.",
          "B) No lo es: la Ley 39/2015 contempla la aparición de nuevos interesados durante la tramitación cuando acreditan la posición jurídica correspondiente.",
          "C) Solo sería incorrecto en procedimientos urbanísticos.",
          "D) La identificación de nuevos interesados solo procede por orden judicial."
        ],
        correct: 1,
        justification: "Quienes acrediten titularidad de derechos e intereses legítimos pueden personarse e intervenir en cualquier fase previa del procedimiento (art. 4 LPAC)[cite: 361]."
      },
      {
        question: "100. Una resolución denegatoria firme pretende ser revisada de oficio años después, pero la Administración fundamenta la revisión exclusivamente en que hoy resolvería de manera distinta por un cambio de criterio técnico no ligado a causa de nulidad. ¿Qué respuesta es la más ajustada?",
        options: [
          "A) La revisión de oficio no es cauce para rectificar libremente actos firmes válidos por simple cambio de criterio; exige causa legal de nulidad.",
          "B) Todo cambio técnico autoriza revisión de oficio.",
          "C) Basta con invocar interés general.",
          "D) El transcurso del tiempo fortalece la libertad de revisión administrativa."
        ],
        correct: 0,
        justification: "La revisión de oficio no procede por meras reconsideraciones o cambios de criterio salvo que concurran causas de nulidad tasadas (art. 106 LPAC)[cite: 361]."
      }
    ];

    const quizBlocks = {
      "all": allQuestions,
      "b1": allQuestions.slice(0, 25),
      "b2": allQuestions.slice(25, 50),
      "b3": allQuestions.slice(50, 75),
      "b4": allQuestions.slice(75, 100)
    };

    let activeData = [];
    let answeredCount = 0;
    let correctCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function changeBlock() {
      const selected = document.getElementById('block-select').value;
      activeData = quizBlocks[selected] || quizBlocks["all"];

      const titles = {
        "all": "EXAMEN TIPO TEST - 23.04.2026 (100 PREGUNTAS)",
        "b1": "BLOQUE 1: PREGUNTAS 1 A 25",
        "b2": "BLOQUE 2: PREGUNTAS 26 A 50",
        "b3": "BLOQUE 3: PREGUNTAS 51 A 75",
        "b4": "BLOQUE 4: PREGUNTAS 76 A 100"
      };

      document.getElementById('test-title').textContent = titles[selected] || titles["all"];
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = `¡Correcto! ${q.justification}`;
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(65 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}). Justificación: ${q.justification}`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const finalScore = activeData.length > 0 ? ((correctCount / activeData.length) * 10).toFixed(2) : "0.00";
      document.getElementById('score').textContent = `⭐ ${finalScore}/10`;
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar
    changeBlock();
  </script>
</body>
</html>
