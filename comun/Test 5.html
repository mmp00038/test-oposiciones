<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Interactivo - Examen 04.03.2026</title>
  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="selector-box">
      <select id="block-select" onchange="changeBlock()">

    <div class="stat-box">

  <div class="container">

    <div id="quiz-container"></div>
    <div class="reset-container">
      <button class="reset-btn" onclick="resetQuiz()">Reiniciar Test</button>
    </div>
  </div>

  <script>
    const allQuestions = [
      {
        question: "1. Un Ayuntamiento dicta una ordenanza que crea un \"procedimiento\" propio para tramitar autorizaciones ambientales, suprimiendo audiencia y alterando plazos básicos, alegando autonomía local. ¿Cuál es el reproche más sólido?",
        options: [

        correct: 1
      },
      {
        question: "2. En un procedimiento iniciado a instancia de una empresa, la Administración guarda silencio. La empresa sostiene que \"siempre\" hay estimación. ¿Qué matiz es decisivo?",

        correct: 2

      {
        question: "3. Una Consejería pretende delegar la firma de resoluciones sancionadoras para \"agilizar\". ¿Conclusión correcta?",

        ],
        correct: 0
      },
      {
        question: "4. En el Parlamento de Andalucía se pretende reformar el Reglamento con un \"acuerdo político\" sin alcanzar el umbral reforzado, alegando que \"no es una ley\". ¿Qué objeción es más precisa?",

      {
        question: "6. Una norma autonómica crea un órgano consultivo económico-social, pero le atribuye potestad para \"anular\" reglamentos por razones de oportunidad. ¿Qué crítica encaja mejor?",

          "A) Ninguna: un órgano consultivo puede sustituir a los tribunales.",

          "D) Solo sería inválido si afectara al presupuesto."
        ],
        correct: 1
      },
      {
        question: "7. Se exige a toda persona física relacionarse electrónicamente en cualquier trámite, sin excepciones. ¿Qué enunciado es más ajustado?",
        options: [
          "A) Es coherente: la ley impone obligación general a todos.",
          "B) Es inválido: la obligación recae en sujetos determinados y, para personas físicas, rige como regla el derecho (no obligación) salvo supuestos tasados.",
          "C) Es válido si hay oficina de asistencia.",

        ],
        correct: 1
      },
      {
        question: "8. El Presidente de la Junta en funciones pretende disolver el Parlamento \"para desbloquear\" la situación política. ¿Qué respuesta es correcta?",

        correct: 3

      {
        question: "9. Un reglamento estatal impone criterios cerrados que impiden a Andalucía concretar procedimientos ambientales propios aun respetando trámites básicos. ¿Cuál es el conflicto de fondo?",
        options: [
          "A) Ninguno: el Estado puede agotar toda la regulación.",

          "C) Andalucía no puede regular nada procedimental nunca.",
          "D) Solo el Senado puede decidir."
        ],
        correct: 1
      },
      {
        question: "10. Una Administración pide al interesado un documento que ya está en poder de la propia Administración actuante y además lo tiene en formato electrónico. ¿Qué respuesta es la más correcta?",

      {

        question: "12. Una asociación ambiental pide personarse en un procedimiento por posible afección a un ecosistema. La Administración lo rechaza por no ser \"titular de un derecho\". ¿Qué criterio es más fino?",

      {

      {
        question: "14. Una notificación electrónica se pone a disposición del interesado, pero este nunca accede. ¿Qué afirmación es la más correcta (regla general)?",

      {
        question: "15. Una Comunidad Autónoma pretende atribuir a su Tribunal Superior la última palabra sobre interpretación constitucional. ¿Qué límite aparece?",

        ],
        correct: 1

      {
        question: "16. Una Consejería encomienda a una universidad pública tareas técnicas del procedimiento, pero también le deja \"decidir\" el sentido de la resolución. ¿Qué es lo más correcto?",

        correct: 2

      {
        question: "17. Se aprueba una norma que restringe una libertad pública con rango reglamentario cuando era exigible ley. ¿Qué tensión constitucional describe mejor el problema?",

          "C) No hay problema si el reglamento es \"muy detallado\".",

        ],
        correct: 1
      },
      {
        question: "18. Un interesado presenta escritos en castellano ante una Administración autonómica; el órgano le obliga a traducirlos a la lengua cooficial. ¿Qué lectura es más defensable?",
        options: [
          "A) Puede exigirse siempre traducción.",

          "D) En procedimientos, rigen las reglas de cooficialidad; no puede imponerse traducción al interesado si el uso del castellano es legítimo y no se produce indefensión."

      },
      {
        question: "19. Un órgano superior asume un asunto que normalmente resolvería un órgano inferior por razones técnicas complejas, mediante acuerdo motivado notificado antes de resolver. ¿Qué técnica es?",

      {

      {

      {
        question: "25. Se dicta un acto administrativo que pretende \"derogar para este caso\" la aplicación de un reglamento general por considerarlo injusto. ¿Qué principio lo impide?",

      {

      {

        question: "90. La Administración pretende que el ciudadano use exclusivamente el correo electrónico personal del instructor para presentar escritos. ¿Qué objeción es más sólida?",
        options: [
          "A) Ninguna: es más rápido.",
          "B) Puede vulnerar el régimen de registros y garantías de constancia/fecha/recepción.",
          "C) Solo afecta a procedimientos judiciales.",
          "D) Es válido si el correo es corporativo."
        ],
        correct: 1
      },
      {
        question: "91. Se dicta un acto administrativo que limita derechos, pero no se motiva pese a ser exigible. ¿Qué núcleo de defensa se activa?",
        options: [
          "A) Solo estética.",
          "B) Motivación como garantía de control y defensa; su ausencia debilita la legalidad del acto.",
          "C) Solo importa la firma.",
          "D) Solo importa el sello."
        ],
        correct: 1
      },
      {
        question: "92. Un partido pretende expulsar automáticamente a un diputado andaluz del escaño por votar distinto. ¿Qué principio lo frena con más precisión?",
        options: [
          "A) Mandato imperativo permitido.",
          "B) Representación y prohibición de mandato imperativo; el escaño no es \"propiedad\" del partido.",
          "C) Solo lo decide el Consejo de Gobierno.",
          "D) Solo lo decide el Rey."
        ],
        correct: 1
      },
      {
        question: "93. Una Administración decide resolver fuera de plazo y, además, dicta resolución contraria a lo que habría sido un silencio estimatorio ya producido. ¿Qué matiz es clave?",
        options: [
          "A) Siempre puede hacerlo.",
          "B) Si hubo silencio estimatorio, la resolución expresa posterior solo puede ser confirmatoria del mismo.",
          "C) El silencio nunca produce acto.",
          "D) El silencio estimatorio obliga a indemnizar."
        ],
        correct: 1
      },
      {
        question: "94. Un ciudadano pide que las AAPP no le exijan documentos redundantes y que consulten datos de otras AAPP. ¿Qué idea lo soporta?",
        options: [
          "A) Publicidad de normas.",
          "B) Principio de comodidad.",
          "C) Régimen de documentos aportados por o en poder de la Administración, salvo excepciones.",
          "D) Principio de unidad jurisdiccional."
        ],
        correct: 2
      },
      {
        question: "95. La Junta se organiza políticamente con un esquema que reproduce el del Estado según acceso a autonomía \"plena\". ¿Qué artículo constitucional suele conectarse a esa lógica?",
        options: [
          "A) El que diseña instituciones autonómicas para ciertas vías, articulando parlamento, presidente y consejo de gobierno.",
          "B) El de la bandera.",
          "C) El de las Cortes.",
          "D) El de la reforma."
        ],
        correct: 0
      },
      {
        question: "96. Una Administración practica notificación en papel sin intentar la electrónica a un obligado a relacionarse electrónicamente. ¿Qué ocurre?",
        options: [
          "A) Es indiferente siempre.",
          "B) Puede ser irregular, porque a obligados se les debe notificar por medios electrónicos conforme al régimen aplicable.",
          "C) Es obligatorio el papel siempre.",
          "D) Es nulo por falta de sello."
        ],
        correct: 1
      },
      {
        question: "97. Se afirma que \"la Constitución permite arbitrariedad administrativa si hay interés general\". ¿Qué corrección procede?",
        options: [
          "A) Correcto.",
          "B) La Constitución garantiza la interdicción de la arbitrariedad de los poderes públicos.",
          "C) Solo prohíbe arbitrariedad judicial.",
          "D) Solo prohíbe arbitrariedad municipal."
        ],
        correct: 1
      },
      {
        question: "98. Un órgano pretende justificar que un Estatuto autonómico tiene rango \"inferior a ley orgánica\" porque es autonómico. ¿Qué respuesta es la adecuada?",
        options: [
          "A) El Estatuto se aprueba como ley orgánica y forma parte del bloque de constitucionalidad.",
          "B) Es reglamento reinforced.",
          "C) Es decreto-ley.",
          "D) Es costumbre."
        ],
        correct: 0
      },
      {
        question: "99. Una Administración notifica electrónicamente, pero el interesado accede desde un dispositivo sin poder visualizar parte del contenido por error de formato. ¿Qué crítica es más fina?",
        options: [
          "A) Da igual: con \"intento\" basta.",
          "B) No hay defecto nunca.",
          "C) La notificación debe permitir acceso real e íntegro al contenido; si se frustra, puede no producir efectos y exigir subsanación.",
          "D) Se convierte en publicación en BOE automáticamente."
        ],
        correct: 2
      },
      {
        question: "100. Un ciudadano pretende que el Consejo Audiovisual \"anule\" una licencia administrativa. ¿Qué respuesta es correcta?",
        options: [
          "A) Puede anular porque protege a la infancia.",
          "B) Solo el Gobierno puede anular.",
          "C) Puede anular si lo pide el Parlamento.",
          "D) Es un órgano regulador/consultivo en su ámbito: la anulación de actos administrativos sigue cauces de revisión/recursos y jurisdicción, no decisión \"directa\" del Consejo."
        ],
        correct: 3
      }
    ];

    const quizBlocks = {
      "all": allQuestions,
      "b1": allQuestions.slice(0, 25),
      "b2": allQuestions.slice(25, 50),
      "b3": allQuestions.slice(50, 75),
      "b4": allQuestions.slice(75, 100)
    };

    let activeData = [];
    let answeredCount = 0;
    let correctCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function changeBlock() {
      const selected = document.getElementById('block-select').value;
      activeData = quizBlocks[selected] || quizBlocks["all"];

      const titles = {
        "all": "EXAMEN TIPO TEST - 04.03.2026 (100 PREGUNTAS)",
        "b1": "BLOQUE 1: PREGUNTAS 1 A 25",
        "b2": "BLOQUE 2: PREGUNTAS 26 A 50",
        "b3": "BLOQUE 3: PREGUNTAS 51 A 75",
        "b4": "BLOQUE 4: PREGUNTAS 76 A 100"
      };

      document.getElementById('test-title').textContent = titles[selected] || titles["all"];
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = "¡Correcto!";
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(65 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}).`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const finalScore = activeData.length > 0 ? ((correctCount / activeData.length) * 10).toFixed(2) : "0.00";
      document.getElementById('score').textContent = `⭐ ${finalScore}/10`;
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar
    changeBlock();
  </script>
</body>
</html>
