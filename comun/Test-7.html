<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Interactivo - Examen 19.03.2026</title>
  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  /* Botón orgánico inspirado en la naturaleza */
    .box, .btn-volver {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #2e7d32;
      color: #ffffff !important;
      padding: 0.6rem 1.25rem;
      border-radius: 0.75rem;
      border: 1px solid #1b5e20;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none !important;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    
    .box:hover, .box:active,
    .btn-volver:hover, .btn-volver:active {
      background-color: #1b5e20;
      color: #ffffff !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(46, 125, 50, 0.25);
    }

    /* Estilo del botón Reiniciar Progreso */
    .btn-reset {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
  
    .btn-reset:hover, .btn-reset:active {
      background-color: #dc2626;
    }
</style>
</head>

 <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ⚠️ REEMPLAZA ESTE BLOQUE CON TU CONFIGURACIÓN REAL DE FIREBASE
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyDxijpzkKAmP85H5MqYsS_UnnmS1ySAgC0",
      authDomain: "oposiciones-tests.firebaseapp.com",
      databaseURL: "https://oposiciones-tests-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "oposiciones-tests",
      storageBucket: "oposiciones-tests.firebasestorage.app",
      messagingSenderId: "334815991038",
      appId: "1:334815991038:web:287c3c46c72ee9837ec1af",
      measurementId: "G-55K6MR5WKS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const CURRENT_TOPIC_ID = 14;

    // Guardar nota e intentos en Firebase en tiempo real
    window.saveTestResults = async function(scoreNum) {
      if (window.testSavedForThisSession) return;
      window.testSavedForThisSession = true;

      try {
        const topicRef = ref(db, `progress/${CURRENT_TOPIC_ID}`);
        const snapshot = await get(topicRef);
        const data = snapshot.val() || {};

        const newAttempts = (data.attempts || 0) + 1;
        const currentBest = data.bestScore || 0;
        const newBest = Math.max(currentBest, parseFloat(scoreNum.toFixed(1)));

        await set(topicRef, {
          attempts: newAttempts,
          bestScore: newBest
        });
      } catch (e) {
        console.error("Error guardando en Firebase:", e);
      }
    };

    // Borrar historial de la nube
    window.resetTopicStats = async function() {
      if (confirm(`¿Quieres borrar los intentos y la nota máxima del Tema ${CURRENT_TOPIC_ID} en la nube?`)) {
        try {
          const topicRef = ref(db, `progress/${CURRENT_TOPIC_ID}`);
          await remove(topicRef);
          alert('Progreso borrado en la nube.');
          location.reload();
        } catch (e) {
          alert('Error al intentar borrar el progreso.');
        }
      }
    };
  </script>

  <script>
    const allQuestions = [
      {

        options: [

          "D) Defecto de competencia territorial"

        question: "95. Una Administración exige comparecencia reiterada sin necesidad. ¿Qué principio vulnera?",
        options: [
          "A) Eficacia",
          "B) Legalidad",
          "C) Proporcionalidad",
          "D) Publicidad"
        ],
        correct: 2,
        justification: "Proporcionalidad."
      },
      {
        question: "96. Un acto administrativo se dicta prescindiendo total y absolutamente del procedimiento. ¿Qué consecuencia tiene?",
        options: [
          "A) Anulabilidad",
          "B) Irregularidad",
          "C) Error material",
          "D) Nulidad de pleno derecho"
        ],
        correct: 3,
        justification: "Nulidad → art. 47 LPAC."
      },
      {
        question: "97. Una Administración impone cargas administrativas innecesarias. ¿Qué principio se ve afectado?",
        options: [
          "A) Eficiencia",
          "B) Jerarquía",
          "C) Seguridad jurídica",
          "D) Publicidad"
        ],
        correct: 0,
        justification: "Eficiencia administrativa."
      },
      {
        question: "98. El Parlamento de Andalucía representa jurídicamente:",
        options: [
          "A) A las provincias",
          "B) A la Administración",
          "C) Al pueblo andaluz",
          "D) Al Gobierno"
        ],
        correct: 2,
        justification: "Representación del pueblo andaluz → Estatuto."
      },
      {
        question: "99. Una Administración aplica retroactivamente una norma sancionadora desfavorable. ¿Qué ocurre?",
        options: [
          "A) Es válida",
          "B) Es discrecional",
          "C) Es anulable",
          "D) Vulnera la Constitución"
        ],
        correct: 3,
        justification: "Irretroactividad sancionadora → art. 9.3 CE."
      },
      {
        question: "100. Una actuación administrativa se aparta de la finalidad pública para la que fue atribuida la potestad. ¿Qué vicio presenta?",
        options: [
          "A) Error material",
          "B) Incompetencia",
          "C) Irregularidad",
          "D) Desviación de poder"
        ],
        correct: 3,
        justification: "Desviación de poder."
      }
    ];

    const quizBlocks = {
      "all": allQuestions,
      "b1": allQuestions.slice(0, 25),
      "b2": allQuestions.slice(25, 50),
      "b3": allQuestions.slice(50, 75),
      "b4": allQuestions.slice(75, 100)
    };

    let activeData = [];
    let answeredCount = 0;
    let correctCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function changeBlock() {
      const selected = document.getElementById('block-select').value;
      activeData = quizBlocks[selected] || quizBlocks["all"];

      const titles = {
        "all": "EXAMEN TIPO TEST - 19.03.2026 (100 PREGUNTAS)",
        "b1": "BLOQUE 1: PREGUNTAS 1 A 25",
        "b2": "BLOQUE 2: PREGUNTAS 26 A 50",
        "b3": "BLOQUE 3: PREGUNTAS 51 A 75",
        "b4": "BLOQUE 4: PREGUNTAS 76 A 100"
      };

      document.getElementById('test-title').textContent = titles[selected] || titles["all"];
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = `${qIndex + 1}. ${q.question}`;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = `¡Correcto! ${q.justification}`;
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(65 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}). Justificación: ${q.justification}`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const finalScore = activeData.length > 0 ? ((correctCount / activeData.length) * 10).toFixed(2) : "0.00";
      document.getElementById('score').textContent = `⭐ ${finalScore}/10`;
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar
    changeBlock();
  </script>
</body>
</html>
