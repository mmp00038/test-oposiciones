<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Interactivo - Examen 09.04.2026</title>
  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  /* Botón orgánico inspirado en la naturaleza */
    .box, .btn-volver {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #2e7d32;
      color: #ffffff !important;
      padding: 0.6rem 1.25rem;
      border-radius: 0.75rem;
      border: 1px solid #1b5e20;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none !important;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    
    .box:hover, .box:active,
    .btn-volver:hover, .btn-volver:active {
      background-color: #1b5e20;
      color: #ffffff !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(46, 125, 50, 0.25);
    }

    /* Estilo del botón Reiniciar Progreso */
    .btn-reset {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
  
    .btn-reset:hover, .btn-reset:active {
      background-color: #dc2626;
    }
</style>
</head>

 <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ⚠️ REEMPLAZA ESTE BLOQUE CON TU CONFIGURACIÓN REAL DE FIREBASE
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyDxijpzkKAmP85H5MqYsS_UnnmS1ySAgC0",
      authDomain: "oposiciones-tests.firebaseapp.com",
      databaseURL: "https://oposiciones-tests-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "oposiciones-tests",
      storageBucket: "oposiciones-tests.firebasestorage.app",
      messagingSenderId: "334815991038",
      appId: "1:334815991038:web:287c3c46c72ee9837ec1af",
      measurementId: "G-55K6MR5WKS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const CURRENT_TOPIC_ID = 14;

    // Guardar nota e intentos en Firebase en tiempo real
    window.saveTestResults = async function(scoreNum) {
      if (window.testSavedForThisSession) return;
      window.testSavedForThisSession = true;

      try {
        const topicRef = ref(db, `progress/${CURRENT_TOPIC_ID}`);
        const snapshot = await get(topicRef);
        const data = snapshot.val() || {};

        const newAttempts = (data.attempts || 0) + 1;
        const currentBest = data.bestScore || 0;
        const newBest = Math.max(currentBest, parseFloat(scoreNum.toFixed(1)));

        await set(topicRef, {
          attempts: newAttempts,
          bestScore: newBest
        });
      } catch (e) {
        console.error("Error guardando en Firebase:", e);
      }
    };

    // Borrar historial de la nube
    window.resetTopicStats = async function() {
      if (confirm(`¿Quieres borrar los intentos y la nota máxima del Tema ${CURRENT_TOPIC_ID} en la nube?`)) {
        try {
          const topicRef = ref(db, `progress/${CURRENT_TOPIC_ID}`);
          await remove(topicRef);
          alert('Progreso borrado en la nube.');
          location.reload();
        } catch (e) {
          alert('Error al intentar borrar el progreso.');
        }
      }
    };
  </script>

  <script>
    const allQuestions = [
      {
        question: "1. Una asociación vecinal presenta alegaciones en un procedimiento administrativo ambiental porque el proyecto afecta a una zona próxima a varias viviendas y a un espacio usado habitualmente por sus miembros. El instructor rechaza su personación con el argumento de que \"solo puede ser interesado quien haya iniciado el procedimiento o sea titular de un derecho subjetivo perfecto\".\n¿Cuál es la respuesta más ajustada?",
        options: [
          "A) No existe problema alguno, porque la Administración puede denegar discrecionalmente la participación vecinal.",
          "B) Solo las personas jurídicas con fines lucrativos pueden personarse.",
          "C) La denegación es incorrecta porque la condición de interesado abarca también a quienes ostenten un interés legítimo personal y directo que pueda resultar afectado.",
          "D) La personación requiere en todo caso informe previo favorable del Ministerio Fiscal."
        ],
        correct: 2,
        justification: "El concepto de interesado no se reduce al promotor ni al titular de un derecho subjetivo cerrado; también abarca a quien tenga un interés legítimo que pueda resultar afectado por la resolución (art. 4 Ley 39/2015)."
      },
      {
        question: "2. Una persona física no obligada a relacionarse electrónicamente solicita ser notificada en papel. La Administración le notifica por medios electrónicos argumentando que \"el canal digital es el único eficiente para la oficina\".\n¿Qué valoración es la adecuada?",
        options: [
          "A) No existe problema alguno, porque la Administración puede imponer de manera general el medio electrónico por razones organizativas.",
          "B) Se vulnera el régimen legal de elección del medio de relación y de notificación respecto de quien no está obligado al canal electrónico.",

          "D) Solo habría irregularidad si el interesado acreditara daño económico inmediato."
        ],
        correct: 1,
        justification: "La Administración no puede imponer el canal electrónico a quien no está obligado y ha señalado medio en papel. El régimen legal distingue entre obligados y no obligados y protege la opción del interesado."
      },
      {
        question: "3. Un grupo parlamentario andaluz aprueba unas normas internas según las cuales todo diputado que vote en el Pleno contra la instrucción del partido perderá automáticamente su adscripción al escaño y será sustituido por el siguiente de la lista. El acuerdo se defiende diciendo que \"la disciplina de partido garantiza la coherencia democrática\".\n¿Cuál es la crítica jurídica más precisa?",
        options: [
          "A) Choca frontalmente con la prohibición del mandato imperativo y con la lógica representativa del cargo parlamentario.",
          "B) Solo plantea un problema ético, no jurídico, porque la organización de los grupos es inmune al control normativo.",
          "C) Podría ser válido si el diputado hubiese firmado previamente un compromiso político interno.",
          "D) Se trataría de una mera cuestión de funcionamiento parlamentario sin relevancia estatutaria."
        ],
        correct: 0,
        justification: "Choca directamente con la prohibición del mandato imperativo y con la representación institucional del diputado, que no es un mero delegado obediente del partido."
      },
      {
        question: "4. Una Consejería requiere a un ciudadano para que aporte de nuevo un certificado que ya fue expedido por esa misma Administración e incorporado meses antes a otro expediente conectado con el actual. El órgano sostiene que \"cada procedimiento debe nacer documentalmente desde cero\".\nLa respuesta correcta es:",
        options: [
          "A) El requerimiento es correcto, porque cada procedimiento exige necesariamente aportación documental íntegra.",
          "B) El ciudadano puede negarse únicamente si acredita que el documento sigue vigente mediante acta notarial.",
          "C) La Administración vulnera el derecho del interesado a no aportar documentos ya en poder de la Administración actuante o elaborados por otra Administración.",
          "D) La obligación de recabar documentos de oficio solo opera en procedimientos sancionadores."
        ],
        correct: 2,
        justification: "La Administración no puede exigir lo que ya obra en su poder o ha sido elaborado por otra Administración (art. 28 de la Ley 39/2015)."
      },
      {
        question: "5. Una Administración dicta un acto desfavorable denegando una autorización solicitada para una actividad con incidencia ambiental. La resolución se limita a afirmar que \"no concurre la conveniencia pública exigible\", pese a que en el expediente constan informes técnicos contradictorios y alegaciones extensas del interesado.\n¿Qué tacha presenta con más claridad la resolución?",
        options: [
          "A) Un mero defecto de forma no invalidante.",

          "D) Inexistencia de procedimiento por ausencia de firma manuscrita."
        ],
        correct: 1,
        justification: "Un acto desfavorable y con apreciación valorativa exige motivación real, no una fórmula vacía. Sin eso, el control y la defensa del interesado quedan mutilados (art. 35 LPAC)."
      },
      {
        question: "6. Durante la disolución del Parlamento de Andalucía surge una situación política urgente que exige preservar facultades de la Cámara frente al Ejecutivo. Un alumno sostiene que, al estar disuelto el Parlamento, no existe ya ningún órgano capaz de actuar institucionalmente.\n¿Cuál es la respuesta correcta?",
        options: [
          "A) Es cierto: la disolución extingue por completo la capacidad de reacción parlamentaria.",
          "B) Solo la Presidencia del Parlamento puede asumir todas las funciones del Pleno.",
          "C) La Junta de Portavoces pasa automáticamente a sustituir al Parlamento en sus competencias esenciales.",
          "D) La Diputación Permanente está precisamente diseñada para velar por los poderes de la Cámara cuando no está reunida o está disuelta."

        correct: 3,
        justification: "La disolución no deja a la Cámara inerme. Para eso existe la Diputación Permanente, que vela por los poderes del Parlamento cuando no está reunido o está disuelto."

        correct: 2,

      {
        question: "8. Una ley autonómica atribuye a un órgano consultivo la facultad de dejar sin efecto reglamentos autonómicos por considerarlos \"políticamente inoportunos\" o \"administrativamente inconvenientes\", sin acudir a procedimiento jurisdiccional alguno.\nLa objeción más afinada es:",
        options: [

        correct: 0,
        justification: "Anular reglamentos con eficacia general invade el terreno del control jurisdiccional (art. 106 CE) y del sistema de fuentes."

      {
        question: "9. Una persona presenta electrónicamente un escrito a las 23:56 horas del último día del plazo. El órgano instructor pretende rechazarlo argumentando que \"la oficina administrativa ya estaba cerrada y nadie pudo recepcionarlo\".\n¿Cuál es la respuesta correcta?",
        options: [
          "A) El escrito es extemporáneo porque fuera del horario de atención al público no pueden presentarse documentos.",

        correct: 1,

      {
        question: "10. Una ley ordinaria pretendiera regular de manera completa el desarrollo directo del derecho fundamental de reunión, introduciendo restricciones sustantivas nuevas no previstas por ley orgánica.\n¿Cuál es la objeción constitucional central?",
        options: [

        question: "11. Un procedimiento administrativo iniciado de oficio se limita en su acuerdo de inicio a indicar que \"podrían haberse producido irregularidades\", sin concretar hechos relevantes, posible infracción ni personas eventualmente afectadas.\nLa crítica jurídica más sólida es:",

        correct: 2,

    const quizBlocks = {
      "all": allQuestions,
      "b1": allQuestions.slice(0, 25),
      "b2": allQuestions.slice(25, 50),
      "b3": allQuestions.slice(50, 75),
      "b4": allQuestions.slice(75, 100)
    };

    let activeData = [];
    let answeredCount = 0;
    let correctCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function changeBlock() {
      const selected = document.getElementById('block-select').value;
      activeData = quizBlocks[selected] || quizBlocks["all"];

      const titles = {
        "all": "EXAMEN TIPO TEST - 09.04.2026 (100 PREGUNTAS)",
        "b1": "BLOQUE 1: PREGUNTAS 1 A 25",
        "b2": "BLOQUE 2: PREGUNTAS 26 A 50",
        "b3": "BLOQUE 3: PREGUNTAS 51 A 75",
        "b4": "BLOQUE 4: PREGUNTAS 76 A 100"
      };

      document.getElementById('test-title').textContent = titles[selected] || titles["all"];
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = `¡Correcto! ${q.justification}`;
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(65 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}). Justificación: ${q.justification}`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
    
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;
    
      const numericScore = activeData.length > 0 ? (correctCount / activeData.length) * 10 : 0;
      document.getElementById('score').textContent = `⭐ ${numericScore.toFixed(2)}/10`;
    
      // Guardar en Firebase cuando se responde la última pregunta
      if (answeredCount > 0 && answeredCount === activeData.length && typeof window.saveTestResults === 'function') {
        window.saveTestResults(numericScore);
      }
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar
    changeBlock();
  </script>
