<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Test Interactivo Unificado - Tema 16 (Espacios Naturales Protegidos)</title>
  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  </style>
</head>

  <div class="container">
    <h1 class="test-title" id="test-title">TEMA 16 - ESPACIOS NATURALES PROTEGIDOS (UNIFICADO)</h1>
    <div id="quiz-container"></div>
    <div class="reset-container">
      <button class="reset-btn" onclick="resetQuiz()">Reiniciar Test</button>
    </div>
  </div>

  <script>
    // --- DATOS DE LOS EXÁMENES ---
    const test1Questions = [
      {
        question: "1. De acuerdo con el art. 25.2 de la Ley 42/2007, del Patrimonio Natural y la Biodiversidad, la inclusión de hábitats en el Catálogo Español de Hábitats en Peligro de Desaparición se llevará a cabo por:",
        options: [
          "a) El Ministerio con competencias en materia de Medio Ambiente, a propuesta de la Comisión de Patrimonio Natural y Biodiversidad, o bien del propio Ministerio",
          "b) Acuerdo del Consejo de Ministros, a propuesta del Ministerio competente en Medio Ambiente",
          "c) Las CCAA, a propuesta del órgano ambiental correspondiente",
          "d) Acuerdo del Consejo del Consejo de Gobierno, a propuesta de la Consejería competente en materia de Medio Ambiente"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)[cite: 186]."
      },
      {
        question: "2. Según el art. 30 de la Ley 42/2007, de 13 de diciembre, en función de los bienes y valores a proteger, y de los objetivos de gestión a cumplir, los espacios naturales protegidos, ya sean terrestres o marinos, se clasificarán, al menos, en alguna de las siguientes categorías:",
        options: [
          "a) Reserva Natural Concertada",
          "b) Paraje Natural",
          "c) Paisaje Protegido",
          "d) Zonas de Importancia Comunitaria"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Paisaje Protegido)[cite: 186]."
      },
      {
        question: "3. Para la declaración de Parques y Reservas Naturales se exigirá, de acuerdo con el art. 36 de la Ley 42/2007, de 13 de diciembre, del Patrimonio Natural y la Biodiversidad:",
        options: [
          "a) La previa elaboración y aprobación del PORN y el PRUG de dicho espacio",
          "b) La previa elaboración del PORN, y posteriormente, la aprobación del mismo en el plazo máximo de 1 año",
          "c) La previa elaboración y aprobación del PORN de la zona",
          "d) Excepcionalmente, podrán declararse Parques y Reservas sin la previa aprobación del PORN, debiendo tramitarse en el plazo de dos años"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)[cite: 186]."
      },
      {
        question: "4. La Red de Áreas Marinas Protegidas de España (RAMPE), fue creada por:",
        options: [
          "a) La Ley 42/2007, de 13 de diciembre, del Patrimonio Natural y la Biodiversidad",
          "b) La Ley 30/2014, de 3 de diciembre, de Parques Nacionales",
          "c) El Real Decreto 435/2004, de 12 de marzo, por el que se regula el Inventario nacional de zonas húmedas",
          "d) Ley 41/2010, de 29 de diciembre, de protección del Medio Marino"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Ley 41/2010, de 29 de diciembre, de protección del Medio Marino)[cite: 186]."
      },
      {
        question: "5. En base al art. 50 de la Ley 42/2007, del Patrimonio Natural y la Biodiversidad, los Geoparques son declarados por:",
        options: [
          "a) Real Decreto",
          "b) El Consejo de Europa",
          "c) La UICN",
          "d) La UNESCO"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: La UNESCO)[cite: 186]."
      },
      {
        question: "6. De acuerdo con el art. 4 del Real Decreto 598/2016, de 5 de diciembre, por el que se regula la composición, funciones y funcionamiento del Consejo de la Red de Parques Nacionales, la presidencia del dicho Consejo le corresponderá a:",
        options: [
          "a) El titular del Ministerio con competencias en medio ambiente",
          "b) El Director del OAPN",
          "c) El titular de la Secretaría de Estado en materia de medio Ambiente",
          "d) Los Directores de cada Parque Nacional de la Red, por turnos de 6 meses"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: El titular del Ministerio con competencias en medio ambiente)[cite: 186]."
      },
      {
        question: "7. En relación con el Consejo de la Red de Parques Nacionales, según el art. 27.4 de la Ley 30/2014, de 3 de diciembre, cuál de las siguientes funciones NO corresponde a dicho Consejo:",
        options: [
          "a) Elaborar el informe previo a la determinación del estado de conservación desfavorable de cualquiera de los parques nacionales",
          "b) Informar el Plan Director de la Red de Parques Nacionales, y sus revisiones",
          "c) Informar La memoria anual de la Red de Parques Nacionales, antes de su elevación al Ministerio de Agricultura, Alimentación y Medio Ambiente para su aprobación",
          "d) Informar los PRUG de los diferentes parques nacionales, antes de su aprobación"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)[cite: 186]."
      },
      {
        question: "8. La normativa aplicable a los Espacios Naturales Protegidos (EENNPP), define \"aquellos espacios que se declaren como tales en atención a las excepcionales exigencias cualificadoras de sus singulares valores, y con la finalidad de atender a la conservación de su flora, fauna, constitución geomorfológica, especial belleza u otros componentes de muy destacado rango natural\", como:",
        options: [
          "a) Reserva Natural",
          "b) Parque",
          "c) Reserva de la Biosfera",
          "d) Paraje Natural"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Paraje Natural)[cite: 186]."
      },
      {
        question: "9. Las Reservas Naturales, conforme al art. 5 de la Ley 2/1989, de 18 de julio, serán declaradas mediante:",
        options: [
          "a) Decreto del Consejo de Gobierno",
          "b) Acuerdo del Consejo de Gobierno",
          "c) Ley del Parlamento Andaluz",
          "d) Orden del titular de la Consejería con competencias en materia de medio ambiente"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Ley del Parlamento Andaluz)[cite: 186]."
      },
      {
        question: "10. Conforme al art. 3 de la Ley 2/1989, de 18 de julio, se delimitará una zona de protección exterior, continua y periférica, con la finalidad de prevenir y, en su caso, corregir cuantos impactos repercutan negativamente en aquéllos, así como promover los usos del suelo compatibles con su conservación, en los siguientes EENNPP:",
        options: [
          "a) Parques y Reservas Naturales",
          "b) Reservas naturales y Monumentos naturales",
          "c) Parques y Parajes Naturales",
          "d) Monumentos Naturales y Parajes Naturales"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Reservas naturales y Monumentos naturales)[cite: 186]."
      },
      {
        question: "11. Según lo dispuesto en el art. 8 de la Ley 2/1989, de 18 de julio, la competencia para declarar nuevos parques naturales en un futuro, oído el Ayuntamiento correspondiente, con su consiguiente incorporación al Inventario, corresponderá a:",
        options: [
          "a) El Parlamento andaluz, mediante Ley",
          "b) El Consejo de Gobierno, a propuesta de la Consejería de Medio Ambiente",
          "c) La Consejería de Medio Ambiente, a propuesta de la Dirección General competente en EENNPP",
          "d) Ninguna de las anteriores es correcta"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: El Consejo de Gobierno, a propuesta de la Consejería de Medio Ambiente)[cite: 186]."
      },
      {
        question: "12. Respecto al ejercicio de la actividad cinegética y piscícola en los espacios declarados como Reserva Natural, el art. 11 de la Ley 2/1989, de 18 de julio, establece que:",
        options: [
          "a) Queda prohibido el ejercicio de ambas actividades, en todo caso",
          "b) Queda prohibido el ejercicio de ambas actividades, salvo que, de acuerdo con el art. 9.2, de forma excepcional, la CMA pueda autorizar actividades cuyo objetivo sea la conservación y regeneración de las reservas naturales",
          "c) Queda prohibido el ejercicio de la actividad cinegética, salvo que sea declarada como actividad cinegética tradicional en aquellos espacios que alcancen la superficie mínima para tener un plan técnico de caza",
          "d) Queda prohibida la actividad cinegética, pero no la piscícola"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B)[cite: 186]."
      },
      {
        question: "13. La declaración y gestión de los parques periurbanos, conforme a la normativa aplicable, será competencia de:",
        options: [
          "a) El Consejo de Gobierno",
          "b) La Consejería con competencias en medio ambiente, mediante Orden",
          "c) El municipio",
          "d) Antes era competencia municipal y desde la Ley 5/2010, de Autonomía Local de Andalucía la declaración le corresponde a la Comunidad Autónoma"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: El municipio)[cite: 186]."
      },
      {
        question: "14. La gestión de los Parques Nacionales, en base al art. 21 de la Ley 30/2014, de 3 de diciembre, corresponde a:",
        options: [
          "a) La Administración General del Estado (AGE)",
          "b) Las CCAA en cuyos territorios estén situados, salvo los marítimo-terrestres en los que exista continuidad ecológica del ecosistema terrestre con el marino",
          "c) Las CCAA, en todo caso",
          "d) Ninguna de las anteriores es correcta"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D)[cite: 186]."
      },
      {
        question: "15. La ordenación, regulación y gestión de los EEENNPP, de acuerdo con la Constitución Española y el Estatuto de Autonomía, es una competencia:",
        options: [
          "a) Exclusiva de la CCAA de Andalucía",
          "b) Compartida entre el Estado y la CCAA de Andalucía",
          "c) Exclusiva del Estado en cuanto a la legislación básica sobre protección del medio ambiente",
          "d) A y C son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: A y C son correctas)[cite: 186]."
      },
      {
        question: "16. Aquellos espacios o elementos de la naturaleza constituidos básicamente por formaciones de notoria singularidad, rareza o belleza, que merecen ser objeto de una protección especial, serán, conforme al art. 34 de la Ley 42/2007, declarados como:",
        options: [
          "a) Paisajes protegidos",
          "b) Monumentos Naturales",
          "c) Reservas de la Biosfera",
          "d) Reservas Naturales"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Monumentos Naturales)[cite: 186]."
      },
      {
        question: "17. El territorio constituido por los términos municipales que aportan terreno a un Parque Nacional, así como, excepcionalmente, siempre que haya causas objetivas que lo definan, por otros directamente relacionados, cuando así se considere en las leyes declarativas, en los que las administraciones públicas llevarán a cabo políticas activas para su desarrollo, es definido en el art. 3 de la Ley 30/2014, de 3 de diciembre, como:",
        options: [
          "a) Zona periférica de protección",
          "b) Área de desarrollo sostenible",
          "c) Área de influencia socioeconómica",
          "d) Zona de influencia periférica"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Área de influencia socioeconómica)[cite: 186]."
      },
      {
        question: "18. Uno de los requerimientos territoriales para la declaración de un Parque Nacional exige que estos espacios tengan una superficie, salvo en casos debidamente justificados, de al menos:",
        options: [
          "a) 50.000 ha en parques nacionales marítimos y marítimo terrestres insulares",
          "b) 20.000 ha en parques nacionales terrestres o marítimo-terrestres peninsulares y en parques nacionales en aguas marinas",
          "c) 5.000 ha en parques nacionales terrestres o marítimo-terrestres peninsulares",
          "d) 20.000 ha en parques nacionales insulares"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B)[cite: 186]."
      },
      {
        question: "19. El Anexo de la Ley 30/2014, de 3 de diciembre, de Parques Nacionales contiene:",
        options: [
          "a) Hábitats naturales o seminaturales, clasificados en peninsulares e insulares",
          "b) Sistemas naturales españoles, clasificados en terrestres y marinos",
          "c) Relación de los Parques Nacionales declarados en el territorio español",
          "d) Criterios ecológicos y ambientales para la declaración de Parques Nacionales"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Sistemas naturales españoles, clasificados en terrestres y marinos)[cite: 186]."
      },
      {
        question: "20. El art. 7 de la Ley 30/2014, de 3 de diciembre, de Parques Nacionales contiene los plazos para el ejercicio del derecho de tanteo y retracto de la administración, respecto de los actos o negocios jurídicos de carácter oneroso celebrados inter vivos, que recaigan sobre fincas rústicas situadas en el interior del Parque Nacional o bien enclavadas dentro del mismo. Estos plazos son:",
        options: [
          "a) 3 meses para el derecho de tanteo, y 1 año para el de retracto",

          "c) 1 año para el derecho de tanteo, y 10 años para el de retracto",
          "d) Los plazos serán los que establezca la legislación de las CCAA en cada caso"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: 3 meses para el derecho de tanteo, y 1 año para el de retracto)[cite: 186]."

          "a) La pesca deportiva y recreativa y la caza deportiva y comercial, salvo la tala con fines comerciales.",

          "d) Todas las actividades anteriores son consideradas incompatibles en Parques Nacionales"

        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)[cite: 186]."
      },

        justification: "Conforme a la plantilla de respuestas oficial (Opción B)[cite: 186]."

        question: "25. El Parque Natural de las Sierras Subbéticas fue declarado en:",
        options: [
          "a) 1987",
          "b) 1988",
          "c) 1989",
          "d) 1999"

        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: 1988)[cite: 186]."

    const allQuestions = [
      ...test1Questions,
      ...test2Questions
    ];

    const quizBlocks = {
      "all": allQuestions,
      "t1_all": test1Questions,
      "t1_b1": test1Questions.slice(0, 25),
      "t1_b2": test1Questions.slice(25, 50),
      "t2_all": test2Questions,
      "t2_b1": test2Questions.slice(0, 25),
      "t2_b2": test2Questions.slice(25, 50)
    };

    let activeData = [];
    let answeredCount = 0;
    let correctCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function changeBlock() {
      const selected = document.getElementById('block-select').value;
      activeData = quizBlocks[selected] || quizBlocks["all"];

      const titles = {
        "all": "TEMA 16 - ESPACIOS NATURALES PROTEGIDOS (COMPLETO 100 PREGUNTAS)",
        "t1_all": "TEST 16.1 - COMPLETO (50 PREGUNTAS)",
        "t1_b1": "TEST 16.1 - BLOQUE 1 (PREGUNTAS 1 A 25)",
        "t1_b2": "TEST 16.1 - BLOQUE 2 (PREGUNTAS 26 A 50)",
        "t2_all": "TEST 16.2 - COMPLETO (50 PREGUNTAS)",
        "t2_b1": "TEST 16.2 - BLOQUE 1 (PREGUNTAS 1 A 25)",
        "t2_b2": "TEST 16.2 - BLOQUE 2 (PREGUNTAS 26 A 50)"
      };

      document.getElementById('test-title').textContent = titles[selected] || titles["all"];
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = `¡Correcto! ${q.justification}`;
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(97 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}). Justificación: ${q.justification}`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const finalScore = activeData.length > 0 ? ((correctCount / activeData.length) * 10).toFixed(2) : "0.00";
      document.getElementById('score').textContent = `⭐ ${finalScore}/10`;
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar
    changeBlock();
  </script>
