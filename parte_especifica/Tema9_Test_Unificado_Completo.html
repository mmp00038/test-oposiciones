  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  /* Botón orgánico inspirado en la naturaleza */
    .box, .btn-volver {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #2e7d32;
      color: #ffffff !important;
      padding: 0.6rem 1.25rem;
      border-radius: 0.75rem;
      border: 1px solid #1b5e20;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none !important;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    
    .box:hover, .box:active,
    .btn-volver:hover, .btn-volver:active {
      background-color: #1b5e20;
      color: #ffffff !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(46, 125, 50, 0.25);
    }

    /* Estilo del botón Reiniciar Progreso */
    .btn-reset {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
  
    .btn-reset:hover, .btn-reset:active {
      background-color: #dc2626;
    }
  </style>
</head>

  <div class="container">
    <h1 class="test-title" id="test-title">TEMA 9 - REPOBLACIONES Y CONSERVACIÓN DE SUELOS (UNIFICADO)</h1>
    <div id="quiz-container"></div>
    <div class="reset-container">
      <button class="reset-btn" onclick="resetQuiz()">Reiniciar Test</button>
    </div>
  </div>

  <script>
    // --- DATOS DE LOS EXÁMENES ---
    const test1Questions = [
      {
        question: "1.- Señale la respuesta correcta",
        options: [
          "a) Hablaremos de reforestación cuando la repoblación de la masa forestal se dé en un terreno que ya ha poseído, en tiempos relativamente cercanos (en torno a 50 años) una masa forestal previa.",
          "b) Hablaremos de forestación cuando la repoblación de la masa forestal se dé en lugares donde no ha existido este tipo de vegetación nunca o en periodos relativamente cortos.",
          "c) Los objetivos tradicionales de la repoblación forestal podrán ser objetivos productores u objetivos protectores",
          "d) Todas las respuestas son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas las respuestas son correctas)."
      },
      {
        question: "2.- Señale la opción incorrecta con respecto al desbroce previo a una repoblación forestal:",
        options: [
          "a) Reduce la competencia por el agua y los nutrientes de la especie a implantar",
          "b) Aumenta el perfil útil del suelo.",
          "c) Facilita el proceso de plantación por parte de los operarios",
          "d) Reduce el riesgo ante posibles incendios ya que el fuego se propagará con mayor dificultad"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B)."
      },
      {
        question: "3.- Señale la opción correcta con respecto al desbroce:",
        options: [
          "a) Los tratamientos totales afectan por igual a todas las especies vegetales",
          "b) Los tratamientos a hecho se harán siguiendo las curvas de nivel para evitar la erosión del terreno.",
          "c) En un decapado eliminaremos únicamente la parte aérea de la vegetación",
          "d) El método más eficaz y el más utilizado es el desbroce químico mediante herbicidas."
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: Los tratamientos totales afectan por igual a todas las especies vegetales)."
      },
      {
        question: "4.- ¿Cuál de las siguientes NO es una técnica para llevar a cabo un desbroce?",
        options: [
          "a) Desbroce mecanizado por laboreo",
          "b) Decapado o Roza al aire",
          "c) Subsolado lineal",
          "d) Desbroce mecanizado con desbrozadoras"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Subsolado lineal)."
      },
      {
        question: "5.- ¿Cuál de los siguientes NO es un objetivo de la preparación del terreno que se realiza previamente a la repoblación forestal?",
        options: [
          "a) Disminuir la velocidad de infiltración.",
          "b) Aumentar la capacidad de retención de agua del terreno.",
          "c) Facilitar la penetración mecánica de las raíces.",
          "d) Facilitar las labores de plantación y siembra."
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: Disminuir la velocidad de infiltración)."
      },
      {
        question: "6.- Señale la opción incorrecta en lo referente a la preparación del terreno que se realiza previamente a la repoblación forestal:",
        options: [
          "a) Por el espacio afectado podemos diferenciar entre tratamientos puntuales, tratamientos lineales o tratamientos a hecho.",
          "b) Por la forma de ejecución podemos diferenciar entre tratamientos manuales o mecanizados.",
          "c) Por la profundidad podemos diferenciar entre tratamientos a baja profundidad, a profundidad media y a alta profundidad.",
          "d) Por la acción sobre el perfil podemos diferenciar entre tratamientos totales o tratamientos selectivos."
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D)."
      },
      {
        question: "7.- ¿Cuál de las siguientes sería una preparación lineal del terreno?",
        options: [
          "a) Raspa o Casilla",
          "b) Ahoyado con retroaraña",
          "c) Subsolado",
          "d) Laboreo pleno"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Subsolado)."
      },
      {
        question: "8.- ¿Cuáles son los marcos de plantación más habituales?",
        options: [
          "a) Marco real o cuadrado, marco rectangular y marco triangular.",
          "b) Marco real o cuadrado, marco a tresbolillo y marco rectangular",
          "c) Marco lineal, marco a tresbolillo y marco rectangular",
          "d) Marco real o cuadrado, marco diagonal y marco lineal"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B)."
      },
      {
        question: "9.- De la siguiente maquinaria usada en repoblaciones forestales, ¿cuál sería más apropiada para trabajar con grandes pendientes?",
        options: [
          "a) Tractor agrícola",
          "b) Tractor todoterreno de alta estabilidad (TTAE)",
          "c) Encopetador lineal",
          "d) Tractor de estabilidad cruzada"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Tractor todoterreno de alta estabilidad - TTAE)."
      },
      {
        question: "10.- ¿Cuál de las siguientes especies que podríamos utilizar en repoblaciones forestales no es una especie autóctona andaluza con un área de distribución extensa?",
        options: [
          "a) Pino carrasco (Pinus halepensis)",
          "b) Acebuche (Olea europaea var. sylvestris)",
          "c) Algarrobo (Ceratonia siliqua)",
          "d) Pino silvestre (Pinus sylvestris)"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Pino silvestre)."
      },
      {
        question: "11.- Señale la opción correcta en lo relativo a las características culturales y técnicas en especies usadas repoblaciones forestales:",
        options: [
          "a) El pinsapo (Abies pinsapo) se establece con éxito desde el nivel del mar hasta los 1000 m de altitud, realizándose su plantación con ejemplares a raíz desnuda.",
          "b) El tipo de planta más habitual en repoblaciones de álamo blanco (Populus alba), es el uso de ejemplares de 3 savias en envase.",
          "c) El Alcornoque (Quercus suber) se establece con éxito desde el nivel del mar y hasta los 1000 m de altitud, requiere suelos silíceos y se puede recurrir tanto a la siembra como a la plantación.",
          "d) El pino carrasco (Pinus halepensis) se establece con éxito en altitudes que oscilan entre los 800 y los 2000 metros, teniendo unos requerimientos hídricos superiores a los 800 mm al año."
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)."
      },
      {
        question: "12.- Señale la opción incorrecta en lo relativo al semillado directo (siembra):",
        options: [
          "a) El control fitosanitario de las semillas será más complicado con respecto a las plantas procedentes de vivero.",
          "b) Tiene la ventaja de que las plantas que obtenemos tienen sistemas radicales más naturales.",
          "c) Los cuidados culturales serán más intensos durante los primeros años con respecto a la plantación.",
          "d) Existe un mayor riesgo para las plántulas de sufrir heladas tardías y sequía en el nivel más superficial del suelo, con respecto a la plantación."
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)."
      },
      {
        question: "13.- ¿Qué tipos de plantas se pueden suministrar para una repoblación?",
        options: [
          "a) Plantas en envase",
          "b) Plantas a raíz desnuda",
          "c) Plantas no germinadas procedentes de estratificación",
          "d) Las respuestas a) y b) son correctas."
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Las respuestas a) y b) son correctas)."
      },
      {
        question: "14.- Señale la opción incorrecta en lo relativo a los cuidados posteriores de las repoblaciones forestales:",
        options: [
          "a) La reposición de marras consiste en la sustitución de plantas invasoras de especies distintas a las del repoblado por plantas incapaces de competir con éstas.",
          "b) Los tubos cinegéticos son tubos de malla plástica o metálica, de hasta 2m de altura, que se colocan en cada planta, enterrándolos parcialmente en el suelo y sujetos con un tutor. Su finalidad es evitar la predación de la planta.",
          "c) Los tubos invernadero son unos dispositivos de material transparente o translúcido que se colocan alrededor de la planta con el doble objetivo de crear un efecto microclimático a modo de invernadero, así como proteger a las plantas de los daños por animales.",
          "d) Las escardas son labores consistentes en el cavado con una azada de la zona situada alrededor de la planta para reducir la competencia de la vegetación."
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)."
      },
      {
        question: "15.- ¿Qué normativa se encarga de regular la Comercialización de los Materiales Forestales de Reproducción?",
        options: [
          "a) La Ley 2/1992, de 15 de junio, forestal de Andalucía",
          "b) El Real Decreto 289/2003, de 7 de marzo",
          "c) El Decreto 208/1997 de 9 de septiembre",
          "d) La Ley 7/2007, de 9 de julio"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Real Decreto 289/2003, de 7 de marzo)."
      },
      {
        question: "16.- ¿Cuál de los siguientes NO es un material de base, según lo recogido en el artículo 2 del Real Decreto 289/2003, de 7 de marzo, sobre comercialización de los materiales forestales de reproducción?",
        options: [
          "a) Rodal",
          "b) Progenitores de semillas",
          "c) Huerto semillero",
          "d) Mezcla de clones"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Progenitores de semillas)."
      },
      {
        question: "17.- El mismo artículo establece que los materiales forestales de reproducción se subdividen según las siguientes categorías:",
        options: [
          "a) Identificados, seleccionados y controlados",
          "b) Identificados, seleccionados, controlados y mezclas de clones",
          "c) Identificados, seleccionados, controlados, cualificados, autóctonos y alóctonos",
          "d) Identificados, seleccionados, cualificados y controlados"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Identificados, seleccionados, cualificados y controlados)."
      },
      {
        question: "18.- De los siguientes datos, ¿cuál de ellos NO vendrá reflejado en el documento del proveedor de los materiales forestales de reproducción, según se recoge en el artículo 10 del Real Decreto 289/2003 de 7 de marzo, sobre comercialización de los materiales forestales de reproducción?",
        options: [
          "a) Relación de las posibles especies que puedan contaminar el lote",
          "b) Pureza",
          "c) Porcentaje de germinación de las semillas puras",
          "d) Número de semillas germinables por kilo"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)."
      },
      {
        question: "19.- Con respecto al etiquetado de los materiales forestales de reproducción:",
        options: [
          "a) La etiqueta de un material forestal de reproducción identificado será amarilla",
          "b) La etiqueta de un material forestal de reproducción seleccionado será verde",
          "c) La etiqueta de un material forestal de reproducción cualificado será rosa",
          "d) Todas las opciones son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas las opciones son correctas)."
      },
      {
        question: "20.- ¿Cuál de los siguientes NO es un tipo de suelo que podamos encontrar en Andalucía?",

          "b) Termosoles",
          "c) Vertisoles",
          "d) Solonchaks"
        ],

        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Termosoles)."
      },

        question: "21.- ¿Cuál de los siguientes NO es una causa o factor que intervenga decisivamente en los procesos erosivos?",

        justification: "Conforme a la plantilla de respuestas oficial (Opción C: El factor aglomerativo del sustrato)."

        question: "22.- ¿Cuál es la principal causa de erosión en Andalucía?",
        options: [

          "c) La erosión marina",

        ],

        question: "26.- Según lo establecido en el artículo 2 del Real Decreto 159/2022, de 1 de marzo, sobre conservación de los recursos genéticos forestales y de la flora silvestre, la \"conservación de los recursos genéticos en los ecosistemas y hábitats naturales y seminaturales para el mantenimiento y recuperación de poblaciones viables de especies forestales en sus entornos naturales\" se corresponde con:",
        options: [
          "a) Conservación ex situ",

          "c) Conservación in situ de recursos genéticos forestales",

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = `¡Correcto! ${q.justification}`;
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(97 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}). Justificación: ${q.justification}`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const finalScore = activeData.length > 0 ? ((correctCount / activeData.length) * 10).toFixed(2) : "0.00";
      document.getElementById('score').textContent = `⭐ ${finalScore}/10`;
    }
