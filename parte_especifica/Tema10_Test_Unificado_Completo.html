  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  /* Botón orgánico inspirado en la naturaleza */
    .box, .btn-volver {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #2e7d32;
      color: #ffffff !important;
      padding: 0.6rem 1.25rem;
      border-radius: 0.75rem;
      border: 1px solid #1b5e20;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none !important;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    
    .box:hover, .box:active,
    .btn-volver:hover, .btn-volver:active {
      background-color: #1b5e20;
      color: #ffffff !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(46, 125, 50, 0.25);
    }

    /* Estilo del botón Reiniciar Progreso */
    .btn-reset {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
  
    .btn-reset:hover, .btn-reset:active {
      background-color: #dc2626;
    }
  </style>

  <div class="container">
    <h1 class="test-title" id="test-title">TEMA 10 - APROVECHAMIENTOS Y DASOMETRÍA (UNIFICADO)</h1>
    <div id="quiz-container"></div>
    <div class="reset-container">
      <button class="reset-btn" onclick="resetQuiz()">Reiniciar Test</button>
    </div>
  </div>

  <script>
    // --- DATOS DE LOS EXÁMENES ---
    const test1Questions = [
      {
        question: "1.- Según viene establecido en la Ley 42/2007, de 13 de diciembre, del Patrimonio Natural y de la Biodiversidad, \"Todo componente de la naturaleza, susceptible de ser aprovechado por el ser humano para la satisfacción de sus necesidades y que tenga un valor actual o potencial, tales como: el paisaje natural, las aguas, superficiales y subterráneas; el suelo, subsuelo y las tierras por su capacidad de uso mayor: agrícolas, pecuarias, forestales, cinegética y de protección; la biodiversidad; la geodiversidad; los recursos genéticos, y los ecosistemas que dan soporte a la vida; los hidrocarburos; los recursos hidroenergéticos, eólicos, solares, geotérmicos y similares; la atmósfera y el espectro radioeléctrico, los minerales, las rocas y otros recursos geológicos renovables y no renovables\", coincide con la definición de:",
        options: [
          "a) Aprovechamientos",
          "b) Recursos naturales",
          "c) Componentes naturales",
          "d) Recursos susceptibles de aprovechamiento público"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Recursos naturales)."
      },
      {
        question: "2.- Señale la opción más correcta a tenor de lo establecido en el artículo 31 de la Ley 8/2003, de 28 de octubre, de la flora y fauna silvestres:",
        options: [
          "a) Toda actividad de aprovechamiento de las especies silvestres a que se refiere el artículo 30 (especies objeto de aprovechamiento) requerirá autorización administrativa de la Consejería competente en materia de medio ambiente y, en su caso, la redacción de un plan técnico en los términos que reglamentariamente se establezcan",
          "b) También será susceptible de autorización administrativa la recogida esporádica en pequeñas cantidades de ejemplares de especies silvestres de invertebrados, plantas y hongos en los lugares y fechas tradicionales, siempre que la misma no entrañe riesgo de desaparición local de la especie.",
          "c) Las respuestas a) y b) son falsas",
          "d) Las respuestas a) y b) son correctas"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)."
      },
      {
        question: "3.- Señale la opción más correcta según lo establecido en el artículo 36 de la Ley 43/2003, de 21 de noviembre, de Montes:",
        options: [
          "a) El titular del monte será en todos los casos el propietario de los recursos forestales producidos en su monte, incluidos frutos espontáneos, y tendrá derecho a su aprovechamiento conforme a lo establecido en esta ley y en la normativa autonómica",
          "b) Los aprovechamientos de los recursos forestales se realizarán de acuerdo con las prescripciones para la gestión de montes establecidas en los correspondientes planes de ordenación de recursos forestales (PORF), cuando existan. Se ajustarán también, en su caso, a lo que concretamente se consigne en el proyecto de ordenación de montes, plan dasocrático o instrumento de gestión equivalente vigente.",
          "c) Los aprovechamientos en los montes afectados por las zonas de servidumbre, policía, o afección de los dominios públicos hidráulico, marítimo-terrestre, de carreteras o ferroviario no precisarán de la autorización de los órganos competentes de dichos dominios, siempre y cuando tales montes dispongan de instrumentos de gestión cuya aprobación por el órgano forestal de la comunidad autónoma haya sido informada favorablemente por los órganos de gestión de los dominios públicos mencionados",
          "d) Todas las respuestas anteriores son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas las respuestas anteriores son correctas)."
      },
      {
        question: "4.- Señale la opción incorrecta según las prescripciones establecidas en el artículo 62 de la Ley 2/1992, de 15 de junio, Forestal de Andalucía:",
        options: [
          "a) A los efectos previstos en el artículo 60, los titulares de predios forestales deberán presentar Proyectos de Ordenación de Montes o Planes Técnicos.",
          "b) Deberán ser elaborados por técnicos competentes en la materia siguiendo las instrucciones fijadas por la Administración Forestal y, en su caso, en los Planes de Ordenación de Recursos Naturales",
          "c) Los Proyectos o Planes a que se refiere el párrafo anterior se aprobarán por la Administración Forestal.",
          "d) Transcurridos tres meses desde su presentación sin contestación expresa, se entenderán aprobados por silencio administrativo positivo en todos aquellos aspectos regulados por esta Ley, y siempre que no contravengan las instrucciones de la Administración Forestal y, en su caso, de los Planes de Ordenación de Recursos Naturales"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)."
      },
      {
        question: "5.- El artículo 63 de la Ley 2/1992, de 15 de junio, Forestal de Andalucía establece que los aprovechamientos de maderas, leñas y corcho en los terrenos forestales privados que tengan aprobados Proyectos de Ordenación o Planes Técnicos y que hayan de realizarse conforme a las prescripciones de los mismos, no necesitarán autorización, siendo, no obstante, obligatoria:",
        options: [
          "a) La autorización expresa de la administración forestal.",
          "b) La actualización de datos del Registro Forestal de Andalucía",
          "c) La notificación previa a la administración forestal.",
          "d) Ninguna de las opciones anteriores es correcta"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: La notificación previa a la administración forestal)."
      },
      {
        question: "6.- El artículo 66 de la Ley 2/1992, de 15 de junio, Forestal de Andalucía prescribe que para todos los montes públicos se redactará, de conformidad con los Proyectos de Ordenación o Planes Técnicos:",
        options: [
          "a) Un plan de ordenación de los recursos naturales",
          "b) Un plan de ordenación de los recursos forestales",
          "c) Un programa anual de aprovechamiento, mejora e inversiones",
          "d) Un plan rector de uso y gestión"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Un programa anual de aprovechamiento, mejora e inversiones)."
      },
      {
        question: "7.- El artículo 96 del Decreto 208/1997 de 9 de septiembre, por el que se aprueba el Reglamento Forestal de Andalucía, establece que será necesaria la previa obtención de autorización administrativa para la realización de usos y aprovechamientos. Señale cual de las siguientes opciones no requerirá autorización administrativa:",
        options: [
          "a) Aprovechamientos de madera, leña, corcho y piña de pino piñonero, en terrenos forestales privados cuando no figuren expresamente previstos en Proyectos de Ordenación o Planes Técnicos aprobados.",
          "b) Roturación de terrenos forestales y realización de actuaciones que originen o puedan originar procesos de erosión en terrenos adehesados que tradicionalmente hayan sido cultivados y cuya pendiente sea inferior al 20%.",
          "c) Plantación o renovación de especies forestales de crecimiento rápido.",
          "d) Usos y aprovechamientos forestales de todas clases en áreas afectadas por incendios forestales"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B)."
      },
      {
        question: "8.- Señalar la opción correcta en cuanto a la tramitación de las autorizaciones para la realización de usos o aprovechamientos en terrenos forestales, a tenor de lo establecido en el artículo 97 del Decreto 208/1997, de 9 de septiembre, por el que se aprueba el Reglamento Forestal de Andalucía:",
        options: [
          "a) Las solicitudes de autorización se dirigirán al Delegado Provincial de la Consejería de Medio Ambiente, indicando el tipo de aprovechamiento, su cuantía, localización exacta, duración y características del mismo.",
          "b) En las solicitudes relativas a usos o aprovechamientos en áreas quemadas deberá acreditarse el cumplimiento de las condiciones impuestas para la restauración de la zona.",
          "c) Corresponde al Delegado Provincial de la Consejería de Medio Ambiente resolver las solicitudes en el plazo máximo de 2 meses, transcurrido el cual podrán entenderse estimadas siempre que afecten únicamente a terrenos privados que no incluyan áreas incendiadas, en cuyo caso podrán entenderse desestimadas",
          "d) Todas las respuestas anteriores son correctas."
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas las respuestas anteriores son correctas)."
      },
      {
        question: "9.- En los aprovechamientos madereros el sistema básico de aprovechamiento denominado \"sistema de madera corta\" consiste en:",
        options: [
          "a) En dicho sistema, los árboles se extraen del área de corta sin tronzar ni desramar, por lo tanto, las operaciones que se realizan a pie de tocón serían únicamente el apeo",
          "b) Sistema en el que la madera se extrae del monte en forma de trozas de unos 2 - 2,5m de longitud. Para ello es necesario realizar a pie de tocón las operaciones de apeo, desrame, despunte, tronzado y reunión o apilado",
          "c) Se trata de del sistema de aprovechamiento en el que la madera se extrae de los montes sin más preparación que su desramado y despunte, y por lo tanto las operaciones realizadas a pie de tocón serán el apeo, el desrame y el despunte",
          "d) Se trata de cualquier sistema llevado a cabo con procesadoras."
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B)."
      },
      {
        question: "10.- ¿Cuál de las siguientes fases no se dará dentro de la superfase de corta mediante medios manuales y motorizados?",
        options: [
          "a) Fase de limpieza",
          "b) Fase de apeo",
          "c) Fase de desramado",
          "d) Fase de reunión"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Fase de reunión)."
      },
      {
        question: "11.- Durante la fase de apeo, al practicar el corte de derribo, no se corta todo el diámetro del árbol, sino que se deja una pequeña porción rectangular que actúa como bisagra, y se denomina:",
        options: [
          "a) Arista de ruptura",
          "b) Charnela",
          "c) Las respuestas a) y b) son correctas",
          "d) Cuando se realiza el corte de derribo siempre de be abarcar todo el diámetro del árbol para poder controlar la dirección de caída."
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Las respuestas a y b son correctas)."
      },
      {
        question: "12.- ¿Cuál de las siguientes operaciones no realizan las procesadoras durante la superfase de corta mediante medios mecanizados?",
        options: [
          "a) Apeo",
          "b) Desramado",
          "c) Despuntado",
          "d) Saca"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Saca)."
      },
      {
        question: "13.- Para la saca mecanizada por arrastre existe una maquinaria específica llamada:",
        options: [
          "a) Procesadora",
          "b) Skidder",
          "c) Forwarder",
          "d) Mulilla de arrastre"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Skidder)."
      },
      {
        question: "14.- De la siguiente maquinaria, ¿cuál sería la más adecuada para el tronzado?",
        options: [
          "a) Motosierra de características similares a las empleadas en el derribo.",
          "b) Pluma hidráulica montada sobre vehículo de transporte.",
          "c) Pequeñas cabezas portadoras de cuchillas.",
          "d) Tractor autocargable."
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)."
      },
      {
        question: "15.- De la siguiente maquinaria, ¿cuál sería la más adecuada para el desembosque?",
        options: [
          "a) Procesadora",
          "b) Camión pesado de tracción simple o doble de 2-4 ejes y provisto de pluma hidráulica.",
          "c) Tractor forestal autocargador.",
          "d) Taladora sobre vehículo todoterreno con grapa."
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Tractor forestal autocargador)."
      },
      {
        question: "16.- El artículo 1 de la Orden de 29 de diciembre de 2011, por la que se regula el aprovechamiento de la biomasa forestal con destino energético, nos indica que la fracción biodegradable de los productos, subproductos y residuos procedentes de la selvicultura aplicada a la vegetación que cubre los montes o terrenos forestales definidos en el artículo 5 de la Ley 43/2003, de 21 de noviembre, de Montes, y en el artículo 1 de la Ley 2/1992, de 15 de junio, Forestal de Andalucía, se considerará:",
        options: [
          "a) Fracción aprovechable",
          "b) Fracción combustible",
          "c) Materia prima",
          "d) Biomasa Forestal"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Biomasa Forestal)."
      },
      {
        question: "17.- ¿Cuál de los siguientes factores puede influir en la calidad del corcho?",
        options: [
          "a) Porosidad",
          "b) Textura",
          "c) Finura del Grano",
          "d) Todas las opciones anteriores son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas las opciones anteriores son correctas)."
      },
      {
        question: "18.- Cuando un corcho está afectado de \"culebra\" se debe a:",
        options: [
          "a) Es el daño ocasionado por la hormiga Crematogaster scutellaris, conocida como \"morito\". Las colonias de este insecto se desarrollan principalmente en el corcho bornizo, es cuando se instalan en el corcho de reproducción cuando producen pérdida de calidad de las panas.",
          "b) Es el daño producido por la larva del coleóptero Coroebus undatus. Esta larva excava galerías sinuosas alrededor del tronco, discurriendo por la capa suberofelodérmica, aunque también puede desviarse hacia el ritidoma o la albura, depreciando el valor del corcho y dificultando la extracción.",
          "c) Es el corcho que presenta inclusiones de tejido del líber y felodermo. La densidad de estos corchos es muy elevada",
          "d) Fuertes traspiraciones y la pérdida de gran cantidad de follaje pueden provocar este defecto, que ocasiona un debilitamiento en la formación de células y su posterior rotura"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B)."
      },
      {
        question: "19.- ¿Cómo se denomina al primer corcho que se extrae del alcornoque?",
        options: [
          "a) Fino",
          "b) Segundero",
          "c) Bornizo",
          "d) Hembra"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Bornizo)."
      },
      {

      {

        options: [
          "a) 1.000 Kg",
          "b) 5.000 Kg",
          "c) 10.000 Kg",

        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: 10.000 Kg)."

    ];

    // Unificación completa
    const allQuestions = [
      ...test1Questions,
      ...test2Questions
    ];

    const quizBlocks = {
      "all": allQuestions,
      "t1_all": test1Questions,
      "t1_b1": test1Questions.slice(0, 25),
      "t1_b2": test1Questions.slice(25, 50),
      "t2_all": test2Questions,
      "t2_b1": test2Questions.slice(0, 13),
      "t2_b2": test2Questions.slice(13, 25)
    };

    let activeData = [];
    let answeredCount = 0;
    let correctCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function changeBlock() {
      const selected = document.getElementById('block-select').value;
      activeData = quizBlocks[selected] || quizBlocks["all"];

      const titles = {
        "all": "TEMA 10 - APROVECHAMIENTOS Y DASOMETRÍA (UNIFICADO COMPLETO 75 PREGUNTAS)",
        "t1_all": "TEST 10-1 - TEST BÁSICO N.º 1 COMPLETO (50 PREGUNTAS)",
        "t1_b1": "TEST 10-1 - BLOQUE 1 (PREGUNTAS 1 A 25)",
        "t1_b2": "TEST 10-1 - BLOQUE 2 (PREGUNTAS 26 A 50)",
        "t2_all": "TEST 10-2 - AUTOEVALUACIÓN N.º 1 COMPLETO (25 PREGUNTAS)",
        "t2_b1": "TEST 10-2 - BLOQUE 1 (PREGUNTAS 1 A 13)",
        "t2_b2": "TEST 10-2 - BLOQUE 2 (PREGUNTAS 14 A 25)"
      };

      document.getElementById('test-title').textContent = titles[selected] || titles["all"];
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = `¡Correcto! ${q.justification}`;
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(97 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}). Justificación: ${q.justification}`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const finalScore = activeData.length > 0 ? ((correctCount / activeData.length) * 10).toFixed(2) : "0.00";
      document.getElementById('score').textContent = `⭐ ${finalScore}/10`;
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar
    changeBlock();
  </script>
