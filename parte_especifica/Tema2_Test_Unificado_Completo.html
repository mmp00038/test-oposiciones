<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Interactivo Unificado - Tema 2 (Ilícito Penal, Sancionador y Policía Judicial)</title>
  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  /* Botón orgánico inspirado en la naturaleza */
    .box, .btn-volver {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #2e7d32;
      color: #ffffff !important;
      padding: 0.6rem 1.25rem;
      border-radius: 0.75rem;
      border: 1px solid #1b5e20;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none !important;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    
    .box:hover, .box:active,
    .btn-volver:hover, .btn-volver:active {
      background-color: #1b5e20;
      color: #ffffff !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(46, 125, 50, 0.25);
    }

    /* Estilo del botón Reiniciar Progreso */
    .btn-reset {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
  
    .btn-reset:hover, .btn-reset:active {
      background-color: #dc2626;
    }
  </style>
</head>
<body>

    <div class="box">
        <a href="../especifica.html" class="btn-volver">← Volver</a>
    </div>
    <div class="box">
        <button type="button" onclick="resetTopicStats()" class="btn-reset">🗑️ Reiniciar Progreso</button>

    <div class="selector-box">
      <select id="block-select" onchange="changeBlock()">
        <optgroup label="Todos los Exámenes">

  </header>

  <div class="container">
    <h1 class="test-title" id="test-title">TEMA 2 - ILÍCITO PENAL, PROCEDIMIENTO SANCIONADOR Y POLICÍA JUDICIAL (UNIFICADO)</h1>
    <div id="quiz-container"></div>
    <div class="reset-container">
      <button class="reset-btn" onclick="resetQuiz()">Reiniciar Test</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ⚠️ REEMPLAZA ESTE BLOQUE CON TU CONFIGURACIÓN REAL DE FIREBASE
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyDxijpzkKAmP85H5MqYsS_UnnmS1ySAgC0",
      authDomain: "oposiciones-tests.firebaseapp.com",
      databaseURL: "https://oposiciones-tests-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "oposiciones-tests",
      storageBucket: "oposiciones-tests.firebasestorage.app",
      messagingSenderId: "334815991038",
      appId: "1:334815991038:web:287c3c46c72ee9837ec1af",
      measurementId: "G-55K6MR5WKS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const CURRENT_TOPIC_ID = 14;

    // Guardar nota e intentos en Firebase en tiempo real
    window.saveTestResults = async function(scoreNum) {
      if (window.testSavedForThisSession) return;
      window.testSavedForThisSession = true;

      try {
        const topicRef = ref(db, `progress/${CURRENT_TOPIC_ID}`);
        const snapshot = await get(topicRef);
        const data = snapshot.val() || {};

        const newAttempts = (data.attempts || 0) + 1;
        const currentBest = data.bestScore || 0;
        const newBest = Math.max(currentBest, parseFloat(scoreNum.toFixed(1)));

        await set(topicRef, {
          attempts: newAttempts,
          bestScore: newBest
        });
      } catch (e) {
        console.error("Error guardando en Firebase:", e);
      }
    };

    // Borrar historial de la nube
    window.resetTopicStats = async function() {
      if (confirm(`¿Quieres borrar los intentos y la nota máxima del Tema ${CURRENT_TOPIC_ID} en la nube?`)) {
        try {
          const topicRef = ref(db, `progress/${CURRENT_TOPIC_ID}`);
          await remove(topicRef);
          alert('Progreso borrado en la nube.');
          location.reload();
        } catch (e) {
          alert('Error al intentar borrar el progreso.');
        }
      }
    };
  </script>

  <script>
    // --- DATOS DE LOS EXÁMENES ---
    const test1Questions = [
      {
        question: "1. El artículo de la Constitución Española donde se recoge la obligación de reparar el daño causado al medio ambiente es el:",
        options: [
          "a) 44",
          "b) 45",
          "c) 46",
          "d) 47"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Art. 45 CE)."
      },
      {
        question: "2. El Código Penal, aprobado por Ley Orgánica 10/1995 de 23 de Noviembre, recoge en su Título XVI los delitos relativos a la ordenación del territorio y el urbanismo, la protección del patrimonio histórico y el medio ambiente. Dentro de este título ¿dónde encontramos los delitos contra los recursos naturales y el medio ambiente?",
        options: [
          "a) En el capítulo II",
          "b) En el capítulo III",
          "c) En el capítulo IV",
          "d) En el capítulo V"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Capítulo III)."
      },
      {
        question: "3. El artículo 330 establece una pena de prisión de 1 a 4 años y multa de 12 a 24 meses para quien:",
        options: [
          "a) Haya informado favorablemente instrumento de planeamiento, proyectos de urbanización, parcelación, reparcelación, construcción o edificación o concedido licencias contrarias a la normativa vigente",
          "b) Traslade una cantidad no desdeñable de residuos, tanto en el caso de uno como en el de varios traslados que aparezcan vinculados, en alguno de los supuestos a que se refiere el Derecho de la Unión Europea relativo a los traslados de residuos.",
          "c) En un espacio natural protegido, dañare gravemente alguno de los elementos que hayan servido para calificarlo.",
          "d) Ninguna respuesta es correcta."
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)."
      },
      {
        question: "4. Para quien cace, pesque, adquiera, posea o destruya especies protegidas de fauna silvestre se impondrán penas de:",
        options: [
          "a) Prisión de 6 a 18 meses, multa de 8 a 24 meses y, en todo caso, inhabilitación especial para profesión u oficio e inhabilitación especial para el ejercicio del derecho de cazar o pescar por tiempo de 1 a 3 años",
          "b) Prisión de 6 a 18 meses o multa de 8 a 24 meses y, en todo caso, inhabilitación especial para profesión u oficio e inhabilitación especial para el ejercicio del derecho de cazar o pescar por tiempo de 1 a 3 años",
          "c) Prisión de 6 a 2 años, multa de 8 a 24 meses y, en todo caso, inhabilitación especial para profesión u oficio e inhabilitación especial para el ejercicio del derecho de cazar o pescar por tiempo de 2 a 4 años",
          "d) Prisión de 6 a 2 años o multa de 8 a 24 meses y, en todo caso, inhabilitación especial para profesión u oficio e inhabilitación especial para el ejercicio del derecho de cazar o pescar por tiempo de 2 a 4 años"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D)."
      },
      {
        question: "5. ¿En qué artículo del Código Penal se recogen una serie de circunstancias que resultan agravantes de los delitos contra los recursos naturales y el medio ambiente?",
        options: [
          "a) Art 326",
          "b) Art 326 bis",
          "c) Art 327",
          "d) Art 328"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Art. 327 CP)."
      },
      {
        question: "6. Si se dieran las circunstancias agravantes a las que hace referencia la pregunta anterior ¿qué conllevará?",
        options: [
          "a) La aplicación de las penas previstas en su mitad superior",
          "b) La aplicación de las penas previstas superiores en grado",
          "c) Las penas de prisión se incrementarán de 2 a 5 años, las penas multa de 8 a 24 meses y la inhabilitación de 1 a 3 años",
          "d) Las penas de prisión se incrementarán de 2 a 5 años, las penas multa de 8 a 12 meses y la inhabilitación de 1 a 3 años"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: La aplicación de las penas previstas superiores en grado)."
      },
      {
        question: "7. ¿Cuándo los responsables de los delitos contra los recursos naturales y el medio ambiente sean personas jurídicas, que penas se impondrán?",
        options: [
          "a) Multa de 1 a 3 años, o del triple al cuádruple del perjuicio causado cuando la cantidad resultante fuese más elevada, si el delito cometido por la persona física tiene prevista una pena de más de 2 años de privación de libertad.",
          "b) Multa de 1 a 3 años, o del doble al cuádruple del perjuicio causado cuando la cantidad resultante fuese más elevada, si el delito cometido por la persona física tiene prevista una pena de más de 2 años de privación de libertad.",
          "c) Multa de 1 a 3 años, o del tanto al cuádruple del perjuicio causado cuando la cantidad resultante fuese más elevada, si el delito cometido por la persona física tiene prevista una pena de más de 2 años de privación de libertad.",
          "d) Multa de 1 a 3 años, o del doble al cuádruple del perjuicio causado cuando la cantidad resultante fuese más elevada, si el delito cometido por la persona física tiene prevista una pena de más de 3 años de privación de libertad."
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B)."
      },
      {
        question: "8. Según el artículo 335, cazar o pescar especies de fauna no protegidas, cuando esté expresamente prohibido por las normas específicas sobre caza o pesca será castigado con penas:",
        options: [
          "a) Penas de prisión de 1 a 3 años",
          "b) Penas multa de 8 a 12 meses",
          "c) Penas de inhabilitación especial para el ejercicio del derecho de cazar o pescar por tiempo de 2 a 4 años",
          "d) Todas las respuestas anteriores son correctas"

        options: [

        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)."
      },
      {
        question: "10. El art. 330 del Código Penal establece que quien, en un espacio natural protegido dañare gravemente alguno de los elementos que hayan servido para calificarlo, incurrirá en:",

          "c) Pena de prisión de 1 a 2 años y multa de 6 a 12 meses",
          "d) Pena de prisión de 6 meses a 1 año y multa de 6 a 12 meses"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: Prisión de 1 a 4 años y multa de 12 a 24 meses)."
      },
      {
        question: "11. En caso que las conductas definidas en el capítulo referente a delitos contra los recursos naturales y el medio ambiente afecten a un espacio natural protegidos ¿qué recoge el código penal?",
        options: [

      {
        question: "12. ¿Qué artículo del código penal recoge la posibilidad de aplicar la pena en su mitad inferior si, por parte del culpable, se procede a la reparación voluntaria del daño causado?",
        options: [

    const allQuestions = [

    const quizBlocks = {
      "all": allQuestions,

      "t2_all": test2Questions,
      "t3_all": test3Questions
    };

    let activeData = [];
    let answeredCount = 0;
    let correctCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function changeBlock() {
      const selected = document.getElementById('block-select').value;
      activeData = quizBlocks[selected] || quizBlocks["all"];

      const titles = {
        "all": "TEMA 2 - ILÍCITO PENAL, PROCEDIMIENTO SANCIONADOR Y POLICÍA JUDICIAL (COMPLETO 66 PREGUNTAS)",
        "t1_all": "TEST Nº 1 - GENERAL (25 PREGUNTAS)",
        "t2_all": "TEST Nº 2.2 - PENAL Y SANCIONADOR (21 PREGUNTAS)",
        "t3_all": "TEST Nº 2.3 - ESPECIES, INCENDIOS Y LECRIM (20 PREGUNTAS)"
      };

      document.getElementById('test-title').textContent = titles[selected] || titles["all"];
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = `¡Correcto! ${q.justification}`;
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(97 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}). Justificación: ${q.justification}`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
    
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;
    
      const numericScore = activeData.length > 0 ? (correctCount / activeData.length) * 10 : 0;
      document.getElementById('score').textContent = `⭐ ${numericScore.toFixed(2)}/10`;
    
      // Guardar en Firebase cuando se responde la última pregunta
      if (answeredCount > 0 && answeredCount === activeData.length && typeof window.saveTestResults === 'function') {
        window.saveTestResults(numericScore);
      }
    }
    
    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      window.testSavedForThisSession = false;
    
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar
    changeBlock();
  </script>
