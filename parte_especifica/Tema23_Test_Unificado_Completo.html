<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Interactivo Unificado - Tema 23 (Residuos y Suelos Contaminados)</title>
  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  /* Botón orgánico inspirado en la naturaleza */
    .box, .btn-volver {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #2e7d32;
      color: #ffffff !important;
      padding: 0.6rem 1.25rem;
      border-radius: 0.75rem;
      border: 1px solid #1b5e20;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none !important;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    
    .box:hover, .box:active,
    .btn-volver:hover, .btn-volver:active {
      background-color: #1b5e20;
      color: #ffffff !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(46, 125, 50, 0.25);
    }

    /* Estilo del botón Reiniciar Progreso */
    .btn-reset {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
  
    .btn-reset:hover, .btn-reset:active {
      background-color: #dc2626;
    }
  </style>
</head>
<body>

  <header>
    <div class="selector-box">
      <select id="block-select" onchange="changeBlock()">
        <optgroup label="Todos los Exámenes">
          <option value="all">Tema 23 Unificado Completo (80 preguntas)</option>
        </optgroup>
        <optgroup label="Test Básico Nº 1 (50 Preguntas)">
          <option value="t1_all">Test Básico Nº 1 - Completo (1 - 50)</option>
          <option value="t1_b1">Test Básico Nº 1 - Bloque 1 (1 - 25)</option>
          <option value="t1_b2">Test Básico Nº 1 - Bloque 2 (26 - 50)</option>
        </optgroup>
        <optgroup label="Test de Autoevaluación Nº 1 (30 Preguntas)">
          <option value="t2_all">Test Autoevaluación - Completo (1 - 30)</option>
          <option value="t2_b1">Test Autoevaluación - Bloque 1 (1 - 15)</option>
          <option value="t2_b2">Test Autoevaluación - Bloque 2 (16 - 30)</option>
        </optgroup>
      </select>
    </div>
    <div class="stat-box">
      <span class="stat-label">Tiempo</span>
      <span class="stat-value" id="timer">⏱️ 00:00</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Contestadas</span>
      <span class="stat-value" id="progress">📝 0/0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Aciertos</span>
      <span class="stat-value" id="accuracy">🎯 0%</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Nota</span>
      <span class="stat-value" id="score">⭐ 0.00/10</span>
    </div>
  </header>

  <div class="container">
    <h1 class="test-title" id="test-title">TEMA 23 - RESIDUOS Y SUELOS CONTAMINADOS (UNIFICADO)</h1>
    <div id="quiz-container"></div>
    <div class="reset-container">
      <button class="reset-btn" onclick="resetQuiz()">Reiniciar Test</button>
    </div>
  </div>

  <script>
    // --- DATOS DE LOS EXÁMENES ---
    const test1Questions = [
      {
        question: "1.- ¿Cuál es la normativa Estatal básica en materia de residuos y suelos contaminados?",
        options: [
          "a) Ley 7/2022 de 8 de abril",
          "b) Ley 22/2011 de 28 de julio",
          "c) Ley 7/2007, de 9 de julio",
          "d) Ley 42/2007, de 13 de diciembre"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: Ley 7/2022 de 8 de abril)[cite: 196]."
      },
      {
        question: "2.- Según las definiciones establecidas en el artículo 2 de la Ley 7/2022, de 8 de abril, de residuos y suelos contaminados para una economía circular, toda persona física o jurídica que organice la valorización o la eliminación de residuos por encargo de terceros, incluidas aquellas que no tomen posesión física de los residuos, se corresponde con la definición de:",
        options: [
          "a) Negociante",
          "b) Agente",
          "c) Productor",
          "d) Poseedor"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Agente)[cite: 196]."
      },
      {
        question: "3.- Según las definiciones establecidas en el artículo 2 de la Ley 7/2022, de 8 de abril, de residuos y suelos contaminados para una economía circular, la gestión de residuos sería:",
        options: [
          "a) La recogida, el transporte, la valorización y la eliminación de los residuos, incluida la clasificación y otras operaciones previas; así como la vigilancia de estas operaciones y el mantenimiento posterior al cierre de los vertederos. Se incluyen también las actuaciones realizadas en calidad de negociante o agente.",
          "b) La primera comercialización de un producto en el mercado nacional.",
          "c) Cualquier operación que no sea la valorización...",
          "d) La operación de valorización consistente en la comprobación, limpieza o reparación..."
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)[cite: 196]."
      },
      {
        question: "4.- Según el artículo 3 de la Ley 7/2022, de 8 de abril, de residuos y suelos contaminados para una economía circular, dicha Ley será de aplicación a:",
        options: [
          "a) Todo tipo de residuos, teniendo en cuenta las exclusiones recogidas en los apartados 2, 3 y 4.",
          "b) Los productos de plástico de un solo uso enumerados en el anexo IV...",
          "c) Los suelos contaminados, que se regirán por el título VIII.",
          "d) Todas las respuestas son correctas."
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas las respuestas son correctas)[cite: 196]."
      },
      {
        question: "5.- Señale la respuesta correcta en lo relativo a la jerarquía de residuos establecida en el artículo 8 de la Ley 7/2022, de 8 de abril, de residuos y suelos contaminados para una economía circular:",
        options: [
          "a) Dentro del orden de prioridad de la jerarquía de residuos la preparación para la reutilización irá antes que la prevención.",
          "b) Dentro del orden de prioridad de la jerarquía de residuos el reciclado irá antes que la preparación para la reutilización.",
          "c) Si para conseguir el mejor resultado medioambiental global en determinados flujos de residuos fuera necesario apartarse de dicha jerarquía, se podrá adoptar un orden distinto de prioridades previa justificación",
          "d) La valorización será la última opción dentro de la jerarquía de residuos."
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)[cite: 196]."
      },
      {
        question: "6.- Según el artículo 12 de la Ley 7/2022, de 8 de abril, de residuos y suelos contaminados para una economía circular, ¿quién será competente para ejercer la potestad de autorización, vigilancia, inspección y sanción de las actividades de producción y gestión de residuos y de las competencias establecidas en el título VIII sobre suelos contaminados?",
        options: [
          "a) El Estado",
          "b) Las Comunidades autónomas",
          "c) Los municipios",
          "d) El productor o poseedor inicial de los residuos."
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Las Comunidades autónomas)[cite: 196]."
      },
      {
        question: "7.- El artículo 14 de la Ley 7/2022, de 8 de abril, de residuos y suelos contaminados para una economía circular establece que la evaluación de los programas de prevención de residuos se llevará a cabo como mínimo cada:",
        options: [
          "a) 2 años",
          "b) 4 años",
          "c) 5 años",
          "d) 6 años"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: 6 años)[cite: 196]."
      },
      {
        question: "8.- El artículo 17 de la Ley 7/2022, de 8 de abril, de residuos y suelos contaminados para una economía circular establece que con la finalidad de romper el vínculo entre el crecimiento económico y los impactos sobre la salud humana y el medio ambiente asociados a la generación de residuos, las políticas de prevención de residuos se encaminarán a lograr un objetivo de reducción en peso de los residuos generados:",
        options: [
          "a) Un 13% respecto a los generados en 2010, para el año 2025",
          "b) Un 15% respecto a los generados en 2010, para el año 2025",
          "c) Un 15% respecto a los generados en 2010, para el año 2030",
          "d) Las respuestas a) y c) son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Las respuestas a y c son correctas)[cite: 196]."
      },
      {
        question: "9.- El artículo 18, Medidas de prevención, de la Ley 7/2022, de 8 de abril, de residuos y suelos contaminados para una economía circular obliga a que, a partir del 1 de julio de 2022, los productores iniciales de residuos peligrosos estarán obligados a disponer de un plan de minimización... los productores deberán informar de los resultados a la comunidad autónoma donde esté ubicado el centro productor:",
        options: [
          "a) Cada año",
          "b) Cada 2 años",
          "c) Cada 4 años",
          "d) Cada 5 años"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Cada 4 años)[cite: 196]."
      },
      {
        question: "10.- ¿Cuál de las siguientes no será una obligación del productor inicial u otro poseedor relativas a la gestión de sus residuos según lo establecido en el artículo 20 de la Ley 7/2022, de 8 de abril, de residuos y suelos contaminados para una economía circular?",
        options: [
          "a) Realizar el tratamiento de los residuos por sí mismo...",
          "b) Encargar el tratamiento de sus residuos a un negociante registrado...",
          "c) Entregar los residuos a una entidad pública o privada de recogida...",
          "d) Todas las opciones son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas las opciones son correctas)[cite: 196]."
      },
      {
        question: "11.- El mismo artículo establece que para facilitar la gestión de los residuos, el productor inicial u otro poseedor de residuos, estará obligado a: (señalar la respuesta incorrecta)",
        options: [
          "a) Suministrar a las empresas autorizadas para llevar a cabo la gestión de residuos la información necesaria...",
          "b) Proporcionar a las entidades locales información sobre los residuos que les entreguen...",
          "c) Informar en el plazo máximo de 24 horas a la administración ambiental competente en caso de desaparición, pérdida o escape de residuos peligrosos...",
          "d) Identificar los residuos, antes de la entrega para su gestión..."
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: La obligación de informar es 'inmediatamente', no en el plazo máximo de 24 horas)[cite: 196]."
      },
      {
        question: "12.- A tenor de lo establecido en el artículo 21 de la Ley 7/2022, de 8 de abril, de residuos y suelos contaminados para una economía circular, relativo a las obligaciones del productor inicial u otro poseedor relativas al almacenamiento, mezcla, envasado y etiquetado de residuos, la duración máxima del almacenamiento en el lugar de producción de residuos peligrosos será:",
        options: [
          "a) Inferior a 2 años cuando se destinen a valorización y a 1 año cuando se destinen a eliminación.",
          "b) Inferior a 1 año cuando se destinen a valorización y a 2 años cuando se destinen a eliminación.",
          "c) Inferior a 6 meses en todos los casos.",
          "d) Ninguna de las respuestas anteriores es correcta."
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Es de 6 meses como norma general, ampliable motivadamente por la C.A. hasta un máximo de 1 año)[cite: 196]."
      },
      {
        question: "13.- Señale la respuesta incorrecta en lo relativo a la autorización de las operaciones de recogida y tratamiento de residuos, según lo recogido en el artículo 33 de la Ley 7/2022, de 8 de abril, de residuos y suelos contaminados para una economía circular:",
        options: [
          "a) Las instalaciones móviles de tratamiento de residuos serán autorizadas por la comunidad autónoma donde tenga la sede social...",
          "b) La persona física o jurídica que tenga intención de llevar a cabo una operación de valorización o eliminación de residuos sin instalación (relleno, tratamiento de los suelos, entre otros) no necesitará solicitar la autorización contemplada en el apartado 2, pero deberá realizar una comunicación previa...",
          "c) Quedan sometidas al régimen de autorización... las instalaciones de almacenamiento en el ámbito de la recogida con carácter profesional...",
          "d) Quedan sometidas al régimen de autorización... las instalaciones fijas donde vayan a realizarse operaciones de tratamiento..."
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Las operaciones sin instalación sí requieren autorización previa, no mera comunicación)[cite: 196]."
      },
      {
        question: "14.- Señale la respuesta correcta relativa a la reducción del impacto de determinados productos de plástico en el medio ambiente, según lo recogido en el Título V de la Ley 7/2022, de 8 de abril, de residuos y suelos contaminados para una economía circular:",
        options: [
          "a) Para los productos de plástico de un solo uso, incluidos en la parte A del anexo IV, se establece un calendario de reducción de la comercialización, de manera que para 2030 se ha de conseguir una reducción del 70% en peso, con respecto a 2022",
          "b) Para la recogida separada de botellas de plástico, se establece un objetivo de recogida separada...",
          "c) Queda prohibida la introducción en el mercado de cualquier producto de plástico...",
          "d) Queda prohibida la introducción en el mercado de microesferas de plástico de más de 55 milímetros..."
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: Reducción del 70% en peso para 2030 respecto a 2022)[cite: 196]."
      },
      {
        question: "15.- ¿Cuál es el tipo impositivo del impuesto especial sobre envases de plástico no reutilizables establecido en el Capítulo I del Título VII de la Ley 7/2022, de 8 de abril, de residuos y suelos contaminados para una economía circular?",
        options: [
          "a) 5 euros por tonelada",
          "b) 0,45 euros por kilogramo",
          "c) La cantidad de plástico no reciclado, expresada en toneladas...",
          "d) El tipo impositivo se determinará reglamentariamente."
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: 0,45 euros por kilogramo)[cite: 196]."
      },
      {
        question: "16.- Según el Anexo I de la Ley 7/2022, de 8 de abril, de residuos y suelos contaminados para una economía circular, un residuo que, generalmente liberando oxígeno, pueden provocar o facilitar la combustión de otras sustancias, se clasifica como:",
        options: [
          "a) Explosivo",
          "b) Inflamable",
          "c) Comburente",
          "d) Corrosivo"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Comburente)[cite: 196]."
      },
      {
        question: "17.- Dentro de las operaciones a las que pueden someterse los distintos tipos de residuos, según lo recogido en los Anexos II y III de la Ley 7/2022, de 8 de abril, de residuos y suelos contaminados para una economía circular, ¿Cuál de las siguientes consiste en una operación de valorización?",
        options: [
          "a) R1204 Mezclas para obtener una materia homogénea y estable de residuos para su valorización posterior.",
          "b) D0906 Desorción térmica.",
          "c) D0102 Depósito en el interior del suelo.",
          "d) Todas son operaciones de valorización"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: Las operaciones con código R son de valorización)[cite: 196]."
      },
      {
        question: "18.- Según el artículo 98 de la Ley 7/2007, de 9 de julio, de Gestión Integrada de la Calidad Ambiental, será competencia de los entes locales:",
        options: [
          "a) La autorización de la eliminación directa de residuos peligrosos en vertedero",
          "b) Promover la participación de los agentes económicos y sociales en la gestión de residuos",
          "c) La autorización de los sistemas integrados de gestión de residuos...",
          "d) La prestación de los servicios públicos de recogida, transporte y, en su caso, la eliminación de los residuos urbanos en la forma que se establezca en sus respectivas ordenanzas y de acuerdo con los objetivos establecidos por la Administración de la Junta de Andalucía en los instrumentos de planificación"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D)[cite: 196]."
      },
      {
        question: "19.- El artículo 101 de la Ley 7/2007, de 9 de julio, de Gestión Integrada de la Calidad Ambiental establece que estarán sometidas al régimen de autorización administrativa las actividades de gestión de residuos, estableciéndose un plazo de resolución y notificación de esta autorización de:",
        options: [
          "a) 3 meses",
          "b) 6 meses",
          "c) 9 meses",
          "d) 10 meses"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: 6 meses)[cite: 196]."
      },
      {
        question: "20.- Señale la respuesta correcta en lo relativo a admisión de residuos en las distintas clases de vertederos, según el artículo 107 de la Ley 7/2007, de 9 de julio, de Gestión Integrada de la Calidad Ambiental:",
        options: [
          "a) Los residuos que se vayan a depositar en un vertedero deberán cumplir con los criterios de admisión para cada tipo de vertedero...",
          "b) Sólo podrán depositarse en un vertedero aquellos residuos que hayan sido objeto de tratamiento...",
          "c) La Consejería competente en materia de medio ambiente podrá autorizar el depósito en vertedero de los residuos peligrosos...",
          "d) Todas las respuestas son correctas."
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas las respuestas son correctas)[cite: 196]."

          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = `¡Correcto! ${q.justification}`;
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(97 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}). Justificación: ${q.justification}`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const finalScore = activeData.length > 0 ? ((correctCount / activeData.length) * 10).toFixed(2) : "0.00";
      document.getElementById('score').textContent = `⭐ ${finalScore}/10`;
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar
    changeBlock();
  </script>
</body>
</html>
