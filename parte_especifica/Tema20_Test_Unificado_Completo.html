<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Interactivo Unificado - Tema 20 (Calidad del Medio Ambiente Atmosférico y Protección Contaminación Acústica y Lumínica)</title>
  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  /* Botón orgánico inspirado en la naturaleza */
    .box, .btn-volver {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #2e7d32;
      color: #ffffff !important;
      padding: 0.6rem 1.25rem;
      border-radius: 0.75rem;
      border: 1px solid #1b5e20;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none !important;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    
    .box:hover, .box:active,
    .btn-volver:hover, .btn-volver:active {
      background-color: #1b5e20;
      color: #ffffff !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(46, 125, 50, 0.25);
    }

    /* Estilo del botón Reiniciar Progreso */
    .btn-reset {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
  
    .btn-reset:hover, .btn-reset:active {
      background-color: #dc2626;
    }
  </style>
</head>
<body>

  <header>
    <div class="selector-box">
      <select id="block-select" onchange="changeBlock()">
        <optgroup label="Todos los Exámenes">
          <option value="all">Tema 20 Unificado Completo (68 preguntas)</option>
        </optgroup>
        <optgroup label="Test Básico Nº 1 (38 Preguntas)">
          <option value="t1_all">Test Básico Nº 1 - Completo (1 - 38)</option>
          <option value="t1_b1">Test Básico Nº 1 - Bloque 1 (1 - 19)</option>
          <option value="t1_b2">Test Básico Nº 1 - Bloque 2 (20 - 38)</option>
        </optgroup>
        <optgroup label="Test de Autoevaluación (30 Preguntas)">
          <option value="t2_all">Test Autoevaluación - Completo (1 - 30)</option>
          <option value="t2_b1">Test Autoevaluación - Bloque 1 (1 - 15)</option>
          <option value="t2_b2">Test Autoevaluación - Bloque 2 (16 - 30)</option>
        </optgroup>
      </select>
    </div>
    <div class="stat-box">
      <span class="stat-label">Tiempo</span>
      <span class="stat-value" id="timer">⏱️ 00:00</span>

    <div class="stat-box">
      <span class="stat-label">Contestadas</span>
      <span class="stat-value" id="progress">📝 0/0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Aciertos</span>

    <div class="stat-box">
      <span class="stat-label">Nota</span>
      <span class="stat-value" id="score">⭐ 0.00/10</span>
    </div>
  </header>

  <div class="container">
    <h1 class="test-title" id="test-title">TEMA 20 - CALIDAD ATMOSFÉRICA, ACÚSTICA Y LUMÍNICA (UNIFICADO)</h1>
    <div id="quiz-container"></div>
    <div class="reset-container">
      <button class="reset-btn" onclick="resetQuiz()">Reiniciar Test</button>
    </div>
  </div>

  <script>
    // --- DATOS DE LOS EXÁMENES ---
    const test1Questions = [
      {
        question: "1.- Señale cual de estás definiciones establecidas en el artículo 50, en relación con la calidad del medio ambiente atmosférico, es incorrecta:",
        options: [
          "a) Se entiende por contaminación acústica: la presencia en el aire ambiente de ruidos o vibraciones...",
          "b) Se entiende por contaminación atmosférica: la presencia en el aire ambiente de cualquier sustancia introducida directa o indirectamente por la actividad humana...",
          "c) Se entiende por contaminación lumínica: la emisión de flujo luminoso por fuentes artificiales de luz...",
          "d) Se entiende por aire ambiente: el aire exterior de la troposfera, incluidos los lugares de trabajo."
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: El aire ambiente excluye los lugares de trabajo)[cite: 190]."
      },
      {
        question: "2.- ¿Cuál de los siguientes no es un gas de efecto invernadero?",
        options: [
          "a) Metano (CH4)",
          "b) Dióxido de nitrógeno (NO2)",
          "c) Perfluorocarburos",
          "d) Hexafluoruro de Azufre (SF6)"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Dióxido de nitrógeno)[cite: 190]."
      },
      {
        question: "3.- ¿Cuál de las siguientes respuestas sería la definición de \"Emisión\" establecida en el artículo 3 de la Ley 34/2007, de 15 de noviembre, de calidad del aire y protección de la atmósfera?",
        options: [
          "a) Descarga a la atmósfera continua o discontinua de materias, sustancias o formas de energía procedentes, directa o indirectamente, de cualquier fuente susceptible de producir contaminación atmosférica.",
          "b) Presencia en la atmósfera de materias, sustancias o formas de energía...",
          "c) Evacuación accidental de sustancias a la atmósfera...",
          "d) Ninguna respuesta es correcta"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)[cite: 190]."
      },
      {
        question: "4.- Señale la definición correcta de \"umbral de alerta\" definida en el artículo 3 de la Ley 34/2007, de 15 de noviembre, de calidad del aire y protección de la atmósfera:",
        options: [
          "a) Nivel a partir del cual una exposición de breve duración supone un riesgo para la salud de los sectores especialmente vulnerables...",
          "b) Cuantía de uno o más contaminantes en emisión...",
          "c) Nivel a partir del cual una exposición de breve duración supone un riesgo para la salud humana que afecta al conjunto de la población y que requiere la adopción de medidas inmediatas.",
          "d) Cantidad de un contaminante en el aire o su depósito..."
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)[cite: 190]."
      },
      {
        question: "5.- Señale la opción incorrecta de las siguientes afirmaciones a tenor de lo establecido en el artículo 13 de la Ley 34/2007, de 15 de noviembre, de calidad del aire y protección de la atmósfera:",
        options: [
          "a) A los efectos de esta ley se consideran como actividades potencialmente contaminadoras de la atmósfera las incluidas en el catálogo del anexo IV.",
          "b) El Gobierno, con la participación de las comunidades autónomas revisará, al menos cada diez años, el anexo IV y, en su caso, lo actualizará.",
          "c) Sin perjuicio de los demás medios de intervención... quedan sometidas a procedimiento de autorización... las pertenecientes a los grupos A y B.",
          "d) Estas autorizaciones, se concederán por un tiempo determinado que en ningún caso será superior a ocho años..."
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: La revisión se realiza al menos cada 5 años, no cada 10 años)[cite: 190]."
      },
      {
        question: "6.- El artículo 52 de la Ley 7/2007, de 9 de julio, de Gestión Integrada de la Calidad Ambiental define \"emisión sistemática\" como:",
        options: [
          "a) Aquella que se realiza de forma continua o intermitente, con una frecuencia media superior a doce veces al año, con una duración individual superior a una hora, o con cualquier frecuencia, cuando la duración global de la emisión sea superior al cinco por ciento del tiempo de funcionamiento de la planta.",
          "b) Aquella que se realiza de forma continua o intermitente...",
          "c) Aquella que se realiza de forma continua o intermitente, con una frecuencia media superior a 60 veces al año...",
          "d) Aquella que se realiza de forma continua o intermitente, con una frecuencia media superior a doce veces al año, con una duración individual superior a una hora, o con cualquier frecuencia, cuando la duración global de la emisión sea superior al cincuenta por ciento..."
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)[cite: 190]."
      },
      {
        question: "7.- El artículo 55 de la Ley 7/2007, de 9 de julio, de Gestión Integrada de la Calidad Ambiental establece que los titulares de actividades potencialmente contaminadoras de la atmósfera están obligados con carácter general a:",
        options: [
          "a) Declarar las emisiones a la atmósfera de su actividad...",
          "b) Llevar un registro de sus emisiones e incidencias...",
          "c) Adoptar las medidas adecuadas para evitar las emisiones accidentales...",
          "d) Todas las respuestas anteriores son correctas."
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas las respuestas anteriores son correctas)[cite: 190]."
      },
      {
        question: "8.- A tenor de lo establecido en el artículo 56 de la Ley 7/2007, de 9 de julio, de Gestión Integrada de la Calidad Ambiental, ¿cuál de las siguientes actividades no estará obligada a obtener una autorización de emisiones a la atmósfera?",
        options: [
          "a) Una instalación que emita contaminantes que estén sujetos a cuotas de emisión en cumplimiento de las obligaciones comunitarias...",
          "b) El montaje de una instalación en la que se desarrollen actividades del grupo A...",
          "c) Una modificación no sustancial de una instalación en la que se desarrollen actividades del grupo B.",
          "d) Todas las actividades anteriormente descritas estarán obligadas a obtener la preceptiva autorización de emisiones a la atmósfera."
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)[cite: 190]."
      },
      {
        question: "9.- ¿Cuál será el plazo de resolución de una autorización de emisiones a la atmósfera según lo establecido en el artículo 57 de la Ley 7/2007, de 9 de julio, de Gestión Integrada de la Calidad Ambiental?",
        options: [
          "a) 9 meses",
          "b) 6 meses",
          "c) 3 meses",
          "d) 1 mes"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: 3 meses)[cite: 190]."
      },
      {
        question: "10.- ¿Cuál de las siguientes será una competencia de la Consejería competente en materia de medio ambiente según lo establecido en el artículo 4 del Decreto 239/2011, de 12 de julio, por el que se regula la calidad del medio ambiente atmosférico y se crea el registro de sistemas de evaluación de la calidad del aire en Andalucía?",
        options: [
          "a) La elaboración de los inventarios de emisiones a la atmósfera y mapas de calidad del aire de la Comunidad Autónoma de Andalucía",
          "b) La vigilancia, inspección y ejercicio de la potestad sancionadora...",
          "c) La ejecución de las medidas incluidas en los planes de mejora...",
          "d) Todas las competencias enunciadas anteriormente corresponden a dicha Consejería."
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)[cite: 190]."
      },
      {
        question: "11.- Señale la opción incorrecta en lo relativo al Libro-registro regulado en el artículo 13 del Decreto 239/2011, de 12 de julio, por el que se regula la calidad del medio ambiente atmosférico y se crea el registro de sistemas de evaluación de la calidad del aire en Andalucía:",
        options: [
          "a) En el libro-registro se harán constar los resultados de las mediciones manuales...",
          "b) Las anotaciones en el libro de registro, como consecuencia del control externo...",
          "c) Las personas o entidades titulares de las instalaciones con sistemas de gestión certificados... no siendo necesario en todo caso disponer del libro-registro.",
          "d) El libro-registro o, en su caso, el documento del sistema de gestión certificado, podrán ser consultados por la inspección oficial..."
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)[cite: 190]."
      },
      {
        question: "12.- El artículo 15 del Decreto 239/2011, de 12 de julio, por el que se regula la calidad del medio ambiente atmosférico y se crea el registro de sistemas de evaluación de la calidad del aire en Andalucía establece que en el caso de actividades cuya vigilancia, inspección y ejercicio de la potestad sancionadora corresponda a la Consejería competente en materia de medio ambiente, los informes correspondientes a los controles externos se presentarán ante el órgano ambiental autonómico competente en un plazo máximo de:",
        options: [
          "a) Un mes desde la realización de las mediciones...",
          "b) Dos meses desde la realización de las mediciones...",
          "c) Tres meses desde la realización de las mediciones, pudiendo exigirse a la entidad colaboradora la presentación por vía telemática del mencionado informe.",
          "d) Seis meses desde la realización de las mediciones..."
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Tres meses)[cite: 190]."
      },
      {
        question: "13.- El artículo 17 del Decreto 239/2011, de 12 de julio, por el que se regula la calidad del medio ambiente atmosférico y se crea el registro de sistemas de evaluación de la calidad del aire en Andalucía establece que el órgano ambiental competente en materia de medio ambiente podrá imponer a las personas o entidades titulares de las instalaciones en las que se realicen actividades potencialmente contaminadoras de la atmósfera la obligación de instalar instrumentos de medición... Señale la opción incorrecta",
        options: [
          "a) Cuando se trate de actividades del grupo A, B o C...",
          "b) Cuando se trate de actividades pertenecientes al grupo A del Catálogo del Anexo del Real Decreto 100/2011, de 28 de enero, o actividades sometidas al procedimiento de autorización ambiental integrada o de autorización ambiental unificada.",
          "c) Cuando, de conformidad con la normativa aplicable vigente, los contaminantes emitidos sean de naturaleza, tóxica, nociva o peligrosa",
          "d) Cuando se trate de actividades ubicadas o que se prevea instalar en un espacio natural protegido o zona de influencia."
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B)[cite: 190]."
      },
      {
        question: "14.- ¿Cuál de los siguientes no es un plan de la calidad del aire según lo establecido en el artículo 21 del Decreto 239/2011, de 12 de julio, por el que se regula la calidad del medio ambiente atmosférico y se crea el registro de sistemas de evaluación de la calidad del aire en Andalucía?",
        options: [
          "a) Planes de mejora de la calidad del aire.",
          "b) Planes de acción a corto plazo.",
          "c) Otros planes de mejora de la calidad del aire.",
          "d) Todas las respuestas anteriores son correctas."
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)[cite: 190]."
      },
      {
        question: "15.- El artículo 23 del Decreto 239/2011, de 12 de julio, por el que se regula la calidad del medio ambiente atmosférico y se crea el registro de sistemas de evaluación de la calidad del aire en Andalucía establece que los Planes de Mejora de la Calidad del aire competencia de la Consejería competente en materia de medio ambiente se aprobarán:",
        options: [
          "a) Por resolución de la Delegación Territorial...",
          "b) Por resolución de la Dirección General...",
          "c) Por orden del titular de la Consejería competente en materia de medio ambiente",
          "d) Por Decreto del Consejo de Gobierno."
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Por Decreto del Consejo de Gobierno)[cite: 190]."
      },
      {
        question: "16.- Señala la opción correcta en el caso instalaciones donde se realicen actividades potencialmente contaminadoras de la atmósfera sometidas a autorización ambiental integrada o autorización ambiental unificada según lo definido en el artículo 32 del Decreto 239/2011, de 12 de julio, por el que se regula la calidad del medio ambiente atmosférico y se crea el registro de sistemas de evaluación de la calidad del aire en Andalucía:",
        options: [
          "a) Las personas o entidades titulares de instalaciones donde se realicen actividades potencialmente contaminadoras de la atmósfera sometidas al procedimiento de autorización ambiental integrada o autorización ambiental unificada, deberán aportar junto con la solicitud de las citadas autorizaciones y la correspondiente documentación, como mínimo, la información que se recoge en el Anexo VIII.",
          "b) La Consejería competente en materia de medio ambiente no incluirá en la resolución...",
          "c) Las prescripciones establecidas en materia de emisiones atmosféricas y de calidad del aire... deberán ser renovadas cada cinco años.",
          "d) Todas las repuestas anteriores son verdaderas."
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)[cite: 190]."
      },
      {
        question: "17.- El artículo 34 del Decreto 239/2011, de 12 de julio, por el que se regula la calidad del medio ambiente atmosférico y se crea el registro de sistemas de evaluación de la calidad del aire en Andalucía establece que para la renovación de la autorización de emisiones a la atmósfera el titular deberá solicitar la renovación mediante la presentación en el órgano ambiental competente una declaración responsable... con una antelación mínima de:",
        options: [
          "a) Seis meses antes de la finalización del plazo de vigencia de la autorización.",
          "b) Tres meses antes de la finalización del plazo de vigencia de la autorización.",
          "c) Un mes antes de la finalización del plazo de vigencia de la autorización.",
          "d) No se establece ningún plazo concreto para la solicitud de la renovación..."
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Tres meses antes)[cite: 190]."
      },
      {
        question: "18.- Según las definiciones establecidas en el artículo 2 de la Ley 1/2005, de 9 de marzo, por la que se regula el régimen del comercio de derechos de emisión de gases de efecto invernadero, el derecho subjetivo a emitir una tonelada equivalente de dióxido de carbono, desde una instalación o una aeronave que realiza una actividad de aviación incluida en el ámbito de aplicación de esta Ley, durante un período determinado, se denomina:",
        options: [
          "a) Expedición",
          "b) Emisión sistemática",
          "c) Derecho de emisión",
          "d) Autorización de emisión de gases de efecto invernadero"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Derecho de emisión)[cite: 190]."

    const allQuestions = [
      ...test1Questions,
      ...test2Questions
    ];

    const quizBlocks = {
      "all": allQuestions,
      "t1_all": test1Questions,
      "t1_b1": test1Questions.slice(0, 19),
      "t1_b2": test1Questions.slice(19, 38),
      "t2_all": test2Questions,
      "t2_b1": test2Questions.slice(0, 15),
      "t2_b2": test2Questions.slice(15, 30)
    };

    let activeData = [];
    let answeredCount = 0;
    let correctCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function changeBlock() {
      const selected = document.getElementById('block-select').value;
      activeData = quizBlocks[selected] || quizBlocks["all"];

      const titles = {
        "all": "TEMA 20 - CALIDAD ATMOSFÉRICA, ACÚSTICA Y LUMÍNICA (COMPLETO 68 PREGUNTAS)",
        "t1_all": "TEST BÁSICO Nº 1 - COMPLETO (38 PREGUNTAS)",
        "t1_b1": "TEST BÁSICO Nº 1 - BLOQUE 1 (PREGUNTAS 1 A 19)",
        "t1_b2": "TEST BÁSICO Nº 1 - BLOQUE 2 (PREGUNTAS 20 A 38)",
        "t2_all": "TEST DE AUTOEVALUACIÓN - COMPLETO (30 PREGUNTAS)",
        "t2_b1": "TEST DE AUTOEVALUACIÓN - BLOQUE 1 (PREGUNTAS 1 A 15)",
        "t2_b2": "TEST DE AUTOEVALUACIÓN - BLOQUE 2 (PREGUNTAS 16 A 30)"
      };

      document.getElementById('test-title').textContent = titles[selected] || titles["all"];
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = `¡Correcto! ${q.justification}`;
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(97 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}). Justificación: ${q.justification}`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const finalScore = activeData.length > 0 ? ((correctCount / activeData.length) * 10).toFixed(2) : "0.00";
      document.getElementById('score').textContent = `⭐ ${finalScore}/10`;
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar
    changeBlock();
  </script>
