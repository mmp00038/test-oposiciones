  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  /* Botón orgánico inspirado en la naturaleza */
    .box, .btn-volver {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #2e7d32;
      color: #ffffff !important;
      padding: 0.6rem 1.25rem;
      border-radius: 0.75rem;
      border: 1px solid #1b5e20;

      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none !important;

    }
    
    .box:hover, .box:active,
    .btn-volver:hover, .btn-volver:active {
      background-color: #1b5e20;

      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(46, 125, 50, 0.25);

    /* Estilo del botón Reiniciar Progreso */
    .btn-reset {
      background-color: #ef4444;
      color: white;
      border: none;

      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
  
    .btn-reset:hover, .btn-reset:active {
      background-color: #dc2626;
    }
  </style>
</head>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ⚠️ REEMPLAZA ESTE BLOQUE CON TU CONFIGURACIÓN REAL DE FIREBASE
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyDxijpzkKAmP85H5MqYsS_UnnmS1ySAgC0",
      authDomain: "oposiciones-tests.firebaseapp.com",
      databaseURL: "https://oposiciones-tests-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "oposiciones-tests",
      storageBucket: "oposiciones-tests.firebasestorage.app",
      messagingSenderId: "334815991038",
      appId: "1:334815991038:web:287c3c46c72ee9837ec1af",
      measurementId: "G-55K6MR5WKS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const CURRENT_TOPIC_ID = 14;

    // Guardar nota e intentos en Firebase en tiempo real
    window.saveTestResults = async function(scoreNum) {
      if (window.testSavedForThisSession) return;
      window.testSavedForThisSession = true;

      try {
        const topicRef = ref(db, `progress/${CURRENT_TOPIC_ID}`);
        const snapshot = await get(topicRef);
        const data = snapshot.val() || {};

        const newAttempts = (data.attempts || 0) + 1;
        const currentBest = data.bestScore || 0;
        const newBest = Math.max(currentBest, parseFloat(scoreNum.toFixed(1)));

        await set(topicRef, {
          attempts: newAttempts,
          bestScore: newBest
        });
      } catch (e) {
        console.error("Error guardando en Firebase:", e);
      }
    };

    // Borrar historial de la nube
    window.resetTopicStats = async function() {
      if (confirm(`¿Quieres borrar los intentos y la nota máxima del Tema ${CURRENT_TOPIC_ID} en la nube?`)) {
        try {
          const topicRef = ref(db, `progress/${CURRENT_TOPIC_ID}`);
          await remove(topicRef);
          alert('Progreso borrado en la nube.');
          location.reload();
        } catch (e) {
          alert('Error al intentar borrar el progreso.');
        }
      }
    };
  </script>

        question: "21. El artículo 28 del Decreto 347/2011 recoge que en los supuestos en que se requiera a la persona solicitante la concreción de la información ambiental, se acordará la suspensión del procedimiento por el plazo máximo de:",

        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Un mes desde la recepción de la solicitud en el registro de la autoridad pública competente)[cite: 198]."

    ];

    const test2Questions = [

        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: 525 metros)[cite: 199]."
      },
      {
        question: "4) ¿Qué equidistancia tendría nuestro plano si tenemos una curva maestra a una altitud de 1750 metros y su contigua a 1850 metros?",
        options: [
          "a) 10 metros",
          "b) 5 metros",
          "c) 20 metros",

        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: 20 metros)[cite: 199]."
      },
      {
        question: "5) Si con la regla de nuestra brújula, que está marcada en milímetros, medimos 75 ¿qué distancia habremos recorrido sobre el terreno si nuestro plano tiene una escala de 1/15.000?",
        options: [
          "a) 1.125 metros",

          "c) 1.150 metros",
          "d) 1.525 metros"

        correct: 0,

      },

        options: [

        correct: 1,

        options: [

        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: 1/4.583)[cite: 199]."
      },
      {
        question: "8) Nos encontramos en un punto a 250 m.s.n.m y queremos ir a otro punto que sabemos que está a 300 m.s.n.m. La distancia medida en plano de esos dos puntos son 6 cm y sabemos que la escala de nuestro plano es 1/10.000 ¿Qué pendiente aproximada (%) tendremos que salvar para alcanzar el punto que se sitúa a 300 m.s.n.m?",
        options: [
          "a) 10%",

          "c) 6%",
          "d) 8%"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: 8%)[cite: 199]."
      },
      {
        question: "9) Siguiendo con el ejercicio anterior, ¿qué pendiente aproximada nos daría si nuestro plano fuese escala 1/20.000?",
        options: [
          "a) 16.5%",
          "b) 4%",
          "c) 12%",
          "d) 10%"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: 4%)[cite: 199]."
      },
      {
        question: "10) Disponemos de un curvímetro al que se le ha marcado una escala determinada. Lo hacemos rodar por nuestro plano indicándonos que en 5 cm de papel habríamos recorrido 300 metros sobre el terreno. ¿Qué escala le marcamos a nuestro aparato?",
        options: [
          "a) 1/10.000",

        correct: 1,

      {

      {

    ];

    // Unificación completa
    const allQuestions = [
      ...test1Questions,
      ...test2Questions
    ];

    const quizBlocks = {
      "all": allQuestions,
      "t1_all": test1Questions,
      "t1_b1": test1Questions.slice(0, 11),
      "t1_b2": test1Questions.slice(11, 21),
      "t2_all": test2Questions,
      "t2_b1": test2Questions.slice(0, 7),
      "t2_b2": test2Questions.slice(7, 13)
    };

    let activeData = [];
    let answeredCount = 0;
    let correctCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function changeBlock() {
      const selected = document.getElementById('block-select').value;
      activeData = quizBlocks[selected] || quizBlocks["all"];

      const titles = {
        "all": "TEMA 24 - CARTOGRAFÍA, SIG, TELECOMUNICACIONES E INFORMACIÓN AMBIENTAL (COMPLETO 34 PREGUNTAS)",
        "t1_all": "TEST Nº 1 - TEÓRICO (COMPLETO 21 PREGUNTAS)",
        "t1_b1": "TEST Nº 1 - BLOQUE 1 (PREGUNTAS 1 A 11)",
        "t1_b2": "TEST Nº 1 - BLOQUE 2 (PREGUNTAS 12 A 21)",
        "t2_all": "TEST Nº 2 - PRÁCTICO (COMPLETO 13 PREGUNTAS)",
        "t2_b1": "TEST Nº 2 - BLOQUE 1 (PREGUNTAS 1 A 7)",
        "t2_b2": "TEST Nº 2 - BLOQUE 2 (PREGUNTAS 8 A 13)"
      };

      document.getElementById('test-title').textContent = titles[selected] || titles["all"];
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = `¡Correcto! ${q.justification}`;
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(97 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}). Justificación: ${q.justification}`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
    
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;
    
      const numericScore = activeData.length > 0 ? (correctCount / activeData.length) * 10 : 0;
      document.getElementById('score').textContent = `⭐ ${numericScore.toFixed(2)}/10`;
    
      // Guardar en Firebase cuando se responde la última pregunta
      if (answeredCount > 0 && answeredCount === activeData.length && typeof window.saveTestResults === 'function') {
        window.saveTestResults(numericScore);
      }
    }
    
    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      window.testSavedForThisSession = false;
    
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar
    changeBlock();
  </script>
