<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Test Interactivo Unificado - Tema 4 (Flora, Fauna y Biodiversidad)</title>
  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  </style>
</head>

  <div class="container">
    <h1 class="test-title" id="test-title">TEMA 4 - PROTECCIÓN DE FLORA, FAUNA Y BIODIVERSIDAD (UNIFICADO)</h1>
    <div id="quiz-container"></div>
    <div class="reset-container">
      <button class="reset-btn" onclick="resetQuiz()">Reiniciar Test</button>
    </div>
  </div>

  <script>
    // --- DATOS DE LOS EXÁMENES ---
    const test1Questions = [
      {
        question: "1. La competencia en materia de flora y fauna silvestres corresponde a la Comunidad Autónoma de Andalucía, de acuerdo con:",
        options: [
          "a) El art. 28 del Estatuto de Autonomía de Andalucía, y es una competencia exclusiva",
          "b) El art. 57 del Estatuto de Autonomía de Andalucía, sin perjuicio del art. 149.1.23º de la Constitución española, y es una competencia exclusiva",
          "c) El art. 57 del Estatuto de Autonomía de Andalucía, y es una competencia ejecutiva",
          "d) Esta competencia de la Comunidad Autónoma es compartida, junto con la competencia de legislación básica del Estado."
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Art. 57 del Estatuto de Autonomía)[cite: 165]."
      },
      {
        question: "2. La Ley 42/2007, de 13 de diciembre, del Patrimonio Natural y la Biodiversidad, es una norma:",
        options: [
          "a) De legislación básica estatal",
          "b) Autonómica de desarrollo",
          "c) Actualmente derogada por la Ley 7/2018, de 20 de julio",
          "d) Ninguna de las anteriores es correcta"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: De legislación básica estatal)[cite: 165]."
      },
      {
        question: "3. El objeto de la Ley 42/2007, del Patrimonio Natural y la Biodiversidad, es (art. 1):",
        options: [
          "a) Establecer el régimen jurídico básico de la conservación, uso sostenible, mejora y restauración del patrimonio natural y de la biodiversidad",
          "b) Desarrollo del deber de conservar el medio ambiente establecido en la Constitución (art. 45)",
          "c) Garantizar el derecho a disfrutar de un medio ambiente adecuado para el desarrollo de la persona (art. 45 de la Constitución)",
          "d) Todas las anteriores son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas las anteriores son correctas)[cite: 165]."
      },
      {
        question: "4. Es un principio de la Ley 42/2007, del Patrimonio Natural y la Biodiversidad (art.2):",
        options: [
          "a) Establecimiento de los supuestos de prevalencia de la ordenación territorial y urbanística sobre la protección ambiental",
          "b) La integración de los requisitos de la conservación, uso sostenible, mejora y restauración del patrimonio natural y la biodiversidad en las políticas sectoriales y, en particular, en la toma de decisiones en el ámbito político, económico y social, así como la participación justa y equitativa en el reparto de beneficios que se deriven de la utilización de los recursos genéticos",
          "c) A y B son correctas",
          "d) Ninguna es correcta"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B)[cite: 165]."
      },
      {
        question: "5. De acuerdo con el art. 3.9 de la Ley 42/2007, la 'Custodia del territorio' se define como:",
        options: [
          "a) Organización pública o privada, sin ánimo de lucro, que lleva a cabo iniciativas que incluyan la realización de acuerdos para la conservación del patrimonio natural y la biodiversidad",
          "b) Es un documento técnico elaborado por la administración estatal que recoge las directrices y criterios principales para la gestión sostenible del territorio",
          "c) Es un conjunto de estrategias o técnicas jurídicas a través de las cuales se implican a los propietarios y usuarios del territorio en la conservación y uso de los valores y los recursos naturales, culturales y paisajísticos",
          "d) Ninguna de las anteriores es correcta"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)[cite: 165]."
      },
      {
        question: "6. La Ley 42/2007 define 'Especie exótica invasora' en su art. 3.13 como:",
        options: [
          "a) Aquellas especies o subespecies, incluyendo sus partes, gametos, semillas, huevos o propágulos que pudieran sobrevivir o reproducirse, introducidos fuera de su área de distribución natural, y de su área potencial de dispersión, que no hubiera podido ocupar sin la introducción directa o indirecta, o sin el cuidado del hombre",
          "b) Especie exótica que se introduce o establece en un ecosistema o hábitat natural o seminatural, y que es un agente de cambio y amenaza para la diversidad biológica nativa, ya sea por su comportamiento invasor, o por el riesgo de contaminación genética",
          "c) Especies alóctonas que presentan alta capacidad reproductiva",
          "d) Especie alóctona que podría convertirse en invasora en España, en especial aquellas que han demostrado ese carácter en otros países o regiones de condiciones ecológicas semejantes a las de España"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B)[cite: 165]."
      },
      {
        question: "7. En base a la definición establecida por la Ley 42/2007 en su art. 3.30, se consideran 'Recursos naturales':",
        options: [
          "a) El paisaje",
          "b) La geodiversidad y biodiversidad",
          "c) La atmósfera",
          "d) Todas son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas son correctas)[cite: 165]."
      },
      {
        question: "8. Las medidas compensatorias, según la definición de la Ley 42/2007 (art. 3.24) consisten en:",
        options: [
          "a) Medidas específicas incluidas en un plan o proyecto, que tienen por objeto compensar, lo más exactamente posible, su impacto negativo sobre la especie o el hábitat afectado",
          "b) Medidas concretas establecidas por la administración competente en medio ambiente, para su aplicación a los ecosistemas y hábitats degradados",
          "c) Medidas específicas que deberán aplicar los titulares del territorio que tiene por objeto la restauración del daño causado",
          "d) Medidas especiales, establecidas en planes o proyectos, que tiene como objeto la recuperación de espacios naturales degradados y la conservación de las especies silvestres"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)[cite: 165]."
      },
      {
        question: "9. Conforme al art. 4.2 de la Ley del Patrimonio Natural y la Biodiversidad, las actividades encaminadas a la consecución de los fines de esta ley:",
        options: [
          "a) Podrán ser declaradas de utilidad pública o interés social, a todos los efectos y en particular a los expropiatorios, respecto de los bienes o derechos que pudieran resultar afectados",
          "b) Serán declaradas de utilidad pública o interés social, a todos los efectos y en particular a los expropiatorios, respecto de los bienes o derechos que pudieran resultar afectados",
          "c) Podrán ser declaradas de utilidad pública o interés social, a todos los efectos, salvo a los expropiatorios, respecto de los bienes o derechos que pudieran resultar afectados",
          "d) Serán ser declaradas de utilidad pública o interés social, a todos los efectos"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)[cite: 165]."
      },
      {
        question: "10. El art. 6 de la Ley 42/2007, del Patrimonio Natural y la Biodiversidad establece que el ejercicio de las funciones de dicha ley, corresponde a las CCAA:",
        options: [
          "a) Cuando se trate de especies silvestres (incluidas las altamente migratorias) y espacios, hábitat o áreas críticas situadas en el medio marino, cuando exista continuidad ecológica del ecosistema marino con el espacio natural terrestre objeto de protección",
          "b) Cuando se trate de especies silvestres situadas en el medio marino, cuando exista continuidad ecológica del ecosistema marino con el espacio natural terrestre objeto de protección. Los hábitats y áreas críticas son competencia del Estado.",
          "c) Cuando se trate de especies silvestres (excepto las altamente migratorias) y espacios, hábitat o áreas críticas situadas en el medio marino, cuando exista continuidad ecológica del ecosistema marino con el espacio natural terrestre objeto de protección",
          "d) La protección de las especies silvestres (excepto las highly migratorias) y espacios, hábitat o áreas críticas sólo si están situadas en el territorio de su comunidad autónoma."
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)[cite: 165]."
      },
      {
        question: "11. El órgano de participación pública en el ámbito de la conservación y el uso sostenible del patrimonio natural y la biodiversidad, creado por la Ley 42/2007 en su art. 8, se corresponde con:",
        options: [
          "a) La Comisión Estatal para el Patrimonio Natural y la Biodiversidad",
          "b) El Consejo Estatal para el Patrimonio Natural y la Biodiversidad",
          "c) El Consejo Andaluz de Biodiversidad",
          "d) La Conferencia Sectorial de Medio Ambiente"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: El Consejo Estatal para el Patrimonio Natural y la Biodiversidad)[cite: 165]."
      },
      {
        question: "12. La Comisión Estatal para el Patrimonio Natural y la Biodiversidad está integrada por varios comités especializados, entre los que se encuentra, según el art. 5 del Real Decreto 1424/2008, de 14 de agosto:",
        options: [
          "a) Comité de caza y pesca",
          "b) Comité de humedales",
          "c) Comité de Geodiversidad",
          "d) B y C son correctas"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Comité de humedales)[cite: 165]."
      },
      {
        question: "13. A tenor del art. 2 del Real Decreto 948/2009, de 5 de junio, son funciones del Consejo Estatal para el Patrimonio Natural y la Biodiversidad:",
        options: [
          "a) Informar, antes de su aprobación, del Plan Estratégico Estatal del Patrimonio Natural y la Biodiversidad",
          "b) Proponer al Ministerio de Medio Ambiente la inclusión o exclusión de hábitats en el Catálogo Español de Hábitats en Peligro de Desaparición, cuya conservación o, en su caso, restauración exijan medidas específicas de protección y conservación",
          "c) Proponer para su aprobación a la Conferencia Sectorial de Medio Ambiente las estrategias de gestión, control y posible erradicación de las especies exóticas invasoras",
          "d) B y C son correctas"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)[cite: 165]."
      },
      {
        question: "14. ¿Cuál de los siguientes comités especializados forma parte de la Comisión Estatal para el Patrimonio Natural y la Biodiversidad, según lo dispuesto en el art. 5 del Real Decreto 1424/2008, de 14 de agosto? Señala la respuesta INCORRECTA",
        options: [
          "a) Comité del Inventario Español del Patrimonio Natural y de la Biodiversidad",
          "b) Comité para la mejora y conservación de recursos genéticos forestales",
          "c) Comité para la Infraestructura Verde y la Conectividad",
          "d) Comité sobre acceso y utilización de los recursos genéticos y conocimientos tradicionales"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)[cite: 165]."
      },
      {
        question: "15. El ámbito de aplicación de la Ley 8/2003, de 28 de octubre, de la Flora y Fauna Silvestres, incluye:",
        options: [
          "a) Los hábitats de la flora y fauna silvestres, así como la flora y fauna silvestres",
          "b) Las especies del aprovechamiento agrícola y ganadero",
          "c) La caza y la pesca continental",
          "d) A y C son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: A y C son correctas)[cite: 165]."
      },
      {
        question: "16. La Ley 8/2003, de Flora y Fauna Silvestres, en su artículo 2, define 'Hábitat de una especie' como:",
        options: [
          "a) El medio acuático o terrestre, diferenciado por sus características geográficas y factores abióticos y bióticos, donde desarrolla en todo o en parte su ciclo biológico",
          "b) Complejo dinámico de comunidades vegetales, animales y de microorganismos y su medio no viviente que interactúan como una unidad funcional",
          "c) Zonas terrestres o acuáticas diferenciadas por sus características geográficas, abióticas y bióticas, tanto si son enteramente naturales como seminaturales",
          "d) Aquellos sectores incluidos en el área de distribución que contengan hábitats esenciales para la conservación favorable de la especie o que por su situación estratégica para la misma requieran su adecuado mantenimiento."
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)[cite: 165]."
      },
      {
        question: "17. Son fines de la Ley 8/2003, de 28 de octubre:",
        options: [
          "a) La preservación de la biodiversidad garantizando la supervivencia de las especies mediante la protección y conservación de la flora y la fauna silvestre y sus hábitats",
          "b) La ordenación de los aprovechamientos de la flora y fauna silvestres",
          "c) Garantizar el derecho de todos al uso y disfrute del medio natural como espacio cultural y de ocio",
          "d) Todas son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas son correctas)[cite: 165]."
      },
      {
        question: "18. En relación con el régimen de protección general establecido en el art. 7 de la Ley 8/2003, de 28 de octubre, todo agente de la autoridad...",
        options: [
          "a) Deberá ordenar la paralización de aquellas actividades que infrinjan lo dispuesto en el art. 7",
          "b) Deberá ordenar el cese de cualquier actividad que infrinja lo dispuesto en el art. 7, comunicándolo inmediatamente a sus órganos superiores a efectos de la adopción de las medidas correspondientes",
          "c) Podrá ordenar el cese de cualquier actividad no autorizada que infrinja, gravemente, lo dispuesto en el art. 7, comunicándolo inmediatamente a la Consejería competente en materia de medio ambiente a efectos de inicio del correspondiente expediente sancionador",
          "d) Podrá ordenar la paralización de las actuaciones que infrinjan lo dispuesto en el art. 7, siempre que no se disponga de autorización"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)[cite: 165]."
      },
      {
        question: "19. El Anexo 1 de la Ley 8/2003, de Flora y Fauna Silvestres recoge...",
        options: [
          "a) Las especies objeto de caza y pesca",
          "b) El catálogo andaluz de especies amenazadas",
          "c) Los medios de captura prohibidos",
          "d) El baremo de indemnización por especie y ejemplar"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Los medios de captura prohibidos)[cite: 165]."
      },
      {
        question: "20. El título I de la Ley 42/2007 recoge la regulación de los instrumentos para el conocimiento y la planificación del patrimonio natural y la biodiversidad. Cuál de los siguientes NO es uno de estos instrumentos:",
        options: [
          "a) El Listado de Especies en Régimen de Protección Especial",
          "b) Los Planes de Ordenación de los Recursos Naturales (PORN)",
          "c) Estrategia Estatal de Infraestructura Verde y de la Conectividad y Restauración Ecológicas",
          "d) Inventario Español del Patrimonio Natural y de la Biodiversidad"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)[cite: 165]."
      },
      {
        question: "21. Cuando hablamos del Inventario Español del Patrimonio Natural y la Biodiversidad (IEPNB), regulado en los art. 9-11 de la Ley 42/2007, de 13 de diciembre, NO es cierto que...",
        options: [
          "a) Una de sus herramientas es el sistema de indicadores, que se aprobarán mediante Acuerdo del Consejo de Ministros",
          "b) Todos los datos del IEPNB se albergan en el llamado Banco de Datos de la Naturaleza",
          "c) Está regulado por el Real Decreto 556/2011, de 20 de abril",
          "d) El IEPNB incluye también el Inventario Español de Zonas Húmedas"
        ],
        correct: 0,

        question: "28. ¿A qué especie de ave corresponde esta silueta en vuelo?",
        options: [
          "a) Gypaetus barbatus",
          "b) Milvus milvus",
          "c) Neophron percnopterus",
          "d) Aquila adalberti"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Neophron percnopterus - Alimoche)[cite: 169]."
      },
      {
        question: "29. ¿Cuál es el nombre científico de la especie que aparece en la imagen (Focha cornuda)?",
        options: [
          "a) Aythya niroca",
          "b) Fulica cristata",
          "c) Otis tarda",
          "d) Tetrax tetrax"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Fulica cristata)[cite: 169]."
      },
      {
        question: "30. Indique la respuesta correcta sobre la especie de la fotografía (Cigüeña negra - Ciconia nigra):",
        options: [
          "a) Está catalogada como vulnerable en el Catálogo Español de Especies Amenazadas",
          "b) No está incluida en ningún Plan de Recuperación y Conservación aprobados por la Junta de Andalucía",
          "c) En Andalucía está catalogada en peligro de extinción",
          "d) Todas las anteriores son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas las anteriores son correctas)[cite: 169]."
      },
      {
        question: "31. ¿Cuál de los siguientes nombres científicos de reptiles corresponde con el galápago europeo?",
        options: [
          "a) Caretta caretta",
          "b) Testudo graeca",
          "c) Emys orbicularis",
          "d) Mauremys leprosa"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Emys orbicularis)[cite: 169]."
      },
      {
        question: "32. ¿Cuál de las siguientes especies está catalogada en peligro de extinción y ha sido declarada en situación crítica por el Ministerio competente en medio ambiente?",
        options: [
          "a) Pinna nobilis",
          "b) Limonium stevei",
          "c) Marmaronetta angustirostris",
          "d) A y C son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: A y C son correctas)[cite: 169]."
      }
    ];

    // Unificación completa
    const allQuestions = [
      ...test1Questions,
      ...test2Questions,
      ...test3Questions,
      ...test4Questions,
      ...test5Questions
    ];

    const quizBlocks = {
      "all": allQuestions,
      "t1_all": test1Questions,
      "t1_b1": test1Questions.slice(0, 20),
      "t1_b2": test1Questions.slice(20, 40),
      "t2_all": test2Questions,
      "t2_b1": test2Questions.slice(0, 20),
      "t2_b2": test2Questions.slice(20, 40),
      "t3_all": test3Questions,
      "t4_all": test4Questions,
      "t4_b1": test4Questions.slice(0, 20),
      "t4_b2": test4Questions.slice(20, 40),
      "t5_all": test5Questions
    };

    let activeData = [];
    let answeredCount = 0;
    let correctCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function changeBlock() {
      const selected = document.getElementById('block-select').value;
      activeData = quizBlocks[selected] || quizBlocks["all"];

      const titles = {
        "all": "TEMA 4 - PROTECCIÓN DE FLORA, FAUNA Y BIODIVERSIDAD (UNIFICADO COMPLETO 177 PREGUNTAS)",
        "t1_all": "TEST 4-1 - COMPLETO (40 PREGUNTAS)",
        "t1_b1": "TEST 4-1 - BLOQUE 1 (PREGUNTAS 1 A 20)",
        "t1_b2": "TEST 4-1 - BLOQUE 2 (PREGUNTAS 21 A 40)",
        "t2_all": "TEST 4-2 - COMPLETO (40 PREGUNTAS)",
        "t2_b1": "TEST 4-2 - BLOQUE 1 (PREGUNTAS 1 A 20)",
        "t2_b2": "TEST 4-2 - BLOQUE 2 (PREGUNTAS 21 A 40)",
        "t3_all": "TEST 4-3 ESPECIES - COMPLETO (25 PREGUNTAS)",
        "t4_all": "TEST 4-4 - COMPLETO (40 PREGUNTAS)",
        "t4_b1": "TEST 4-4 - BLOQUE 1 (PREGUNTAS 1 A 20)",
        "t4_b2": "TEST 4-4 - BLOQUE 2 (PREGUNTAS 21 A 40)",
        "t5_all": "TEST 4-5 ESPECIES - COMPLETO (32 PREGUNTAS)"
      };

      document.getElementById('test-title').textContent = titles[selected] || titles["all"];
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = `¡Correcto! ${q.justification}`;
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(97 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}). Justificación: ${q.justification}`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const finalScore = activeData.length > 0 ? ((correctCount / activeData.length) * 10).toFixed(2) : "0.00";
      document.getElementById('score').textContent = `⭐ ${finalScore}/10`;
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar
    changeBlock();
  </script>
</body>
