<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Interactivo Unificado - Tema 1 (140 Preguntas)</title>
  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  /* Botón orgánico inspirado en la naturaleza */
    .box, .btn-volver {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #2e7d32;
      color: #ffffff !important;
      padding: 0.6rem 1.25rem;
      border-radius: 0.75rem;
      border: 1px solid #1b5e20;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none !important;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    
    .box:hover, .box:active,
    .btn-volver:hover, .btn-volver:active {
      background-color: #1b5e20;
      color: #ffffff !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(46, 125, 50, 0.25);
    }

    /* Estilo del botón Reiniciar Progreso */
    .btn-reset {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
  
    .btn-reset:hover, .btn-reset:active {
      background-color: #dc2626;
    }
  </style>
</head>
<body>

  <header>
    <div class="box">
        <a href="../especifica.html" class="btn-volver">← Volver</a>
    </div>
    <div class="box">
        <button type="button" onclick="resetTopicStats()" class="btn-reset">🗑️ Reiniciar Progreso</button>
    </div>
    <div class="selector-box">
      <select id="block-select" onchange="changeBlock()">
        <option value="all">Examen Completo (140 preguntas)</option>
        <option value="t1">Test 1 Autoevaluación (Preguntas 1 - 20)</option>
        <option value="t2_b1">Test 2 - Bloque 1 (Preguntas 21 - 45)</option>
        <option value="t2_b2">Test 2 - Bloque 2 (Preguntas 46 - 70)</option>
        <option value="t2_b3">Test 2 - Bloque 3 (Preguntas 71 - 95)</option>
        <option value="t2_b4">Test 2 - Bloque 4 (Preguntas 96 - 120)</option>
        <option value="t3">Test 3 Básico (Preguntas 121 - 140)</option>
      </select>
    </div>
    <div class="stat-box">
      <span class="stat-label">Tiempo</span>
      <span class="stat-value" id="timer">⏱️ 00:00</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Contestadas</span>
      <span class="stat-value" id="progress">📝 0/0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Aciertos</span>
      <span class="stat-value" id="accuracy">🎯 0%</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Nota</span>
      <span class="stat-value" id="score">⭐ 0.00/10</span>
    </div>
  </header>

  <div class="container">
    <h1 class="test-title" id="test-title">TEST UNIFICADO INTERACTIVO - TEMA 1</h1>
    <div id="quiz-container"></div>
    <div class="reset-container">
      <button class="reset-btn" onclick="resetQuiz()">Reiniciar Test</button>
    </div>
  </div>

  <script>
    const test1Questions = [
      {
        question: "1.- Según el artículo 28 de la Ley Orgánica 2/2007 de 19 de marzo, por la que se aprueba el Estatuto de Autonomía para Andalucía, señale la opción correcta:",
        options: [
          "a) Todas las personas tienen derecho a acceder a la información medioambiental de que disponen los poderes públicos, en los términos que establezcan las leyes.",
          "b) Todas las personas tienen derecho a vivir en un medio ambiente equilibrado, sostenible y saludable, así como a disfrutar de los recursos naturales, del entorno y el paisaje en condiciones de igualdad, debiendo hacer un uso responsable del mismo para evitar su deterioro y conservarlo para las generaciones futuras, de acuerdo con lo que determinen las leyes.",
          "c) Se garantiza este derecho mediante una adecuada protección de la diversidad biológica y los procesos ecológicos, el patrimonio natural, el paisaje, el agua, el aire y los recursos naturales.",
          "d) Todas las opciones son correctas."
        ],
        correct: 3,
        justification: "Todas las opciones recogen contenidos exactos del artículo 28 del Estatuto de Autonomía para Andalucía relativo al derecho al medio ambiente."
      },
      {
        question: "2.- El Título VII de dicho Estatuto de Autonomía se dedica por completo al Medio Ambiente, ¿Cuál de los siguientes NO sería un tema tratado en dicho título?",
        options: [
          "a) Producción y Desarrollo sostenible",
          "b) Residuos",
          "c) Gestión integrada de la calidad ambiental",
          "d) Uso sostenible del suelo y sistemas integrales de transporte"
        ],
        correct: 2,
        justification: "El Título VII (Medio Ambiente) aborda el desarrollo sostenible, residuos, suelo, agua, etc. La 'Gestión integrada de la calidad ambiental' es la denominación dada por la Ley 7/2007 (GICA), no un capítulo o título del Estatuto."
      },
      {
        question: "3.- En el artículo 9 de la Ley 5/2010, de 11 de junio, de Autonomía Local de Andalucía (LAULA), se establecen Competencias Propias de los Municipios. ¿Cuál de las siguientes NO sería una competencia atribuida a la administración local por dicho artículo?",
        options: [
          "a) La programación, ejecución y control de medidas de mejora de la calidad del aire, que deberán cumplir con las determinaciones de los planes de nivel supramunicipal o autonómico, aprobados por la Junta de Andalucía.",
          "b) La declaración y gestión de parques periurbanos y el establecimiento de reservas y parques naturales, previo informe de la consejería competente en materia de medio ambiente de la Junta de Andalucía.",
          "c) La programación de actuaciones en materia de información ambiental y de educación ambiental para la sostenibilidad.",
          "d) La gestión del procedimiento de calificación ambiental, así como la vigilancia, control y ejercicio de la potestad sancionadora con respecto a las actividades sometidas a dicho instrumento."
        ],
        correct: 1,
        justification: "La declaración de parques naturales o reservas es competencia de la Comunidad Autónoma, no una competencia propia municipal asignada en el art. 9 de la LAULA."
      },
      {
        question: "4.- Según el artículo 57 de la Ley Orgánica 2/2007 de 19 de marzo, por la que se aprueba el Estatuto de Autonomía para Andalucía, NO será una competencia compartida:",
        options: [
          "a) Prevención ambiental",
          "b) El establecimiento y la regulación de los instrumentos de planificación ambiental y del procedimiento de tramitación y aprobación de estos instrumentos",
          "c) La regulación de los recursos naturales",
          "d) La regulación del régimen de autorizaciones y seguimiento de emisión de gases de efecto invernadero"
        ],
        correct: 0,
        justification: "Conforme al art. 57 del Estatuto, la prevención ambiental no figura explicitada dentro de dicho apartado normativo en los términos señalados frente al resto de competencias compartidas reguladas."
      },
      {
        question: "5.- ¿Qué normativa establece la estructura orgánica de la Consejería de Sostenibilidad y Medio Ambiente?",
        options: [
          "a) Real Decreto 2/2020, de 12 de enero.",
          "b) Decreto del Presidente 10/2022 de 25 de julio.",
          "c) Decreto 200/2026, de 30 de julio.",
          "d) Decreto 226/2020, de 29 de diciembre."
        ],
        correct: 2,
        justification: "La estructura orgánica actual de la Consejería de Sostenibilidad y Medio Ambiente se encuentra establecida por el Decreto 200/2026, de 30 de julio."
      },
      {
        question: "6.- Según la normativa en vigor que establece la estructura orgánica de la Consejería de Sostenibilidad y Medio Ambiente, ¿a quién corresponde la siguiente competencia?: 'La gestión patrimonial de los bienes adscritos a la Consejería, así como el inventario de los bienes muebles e inmuebles, sin perjuicio de las competencias de la Consejería competente en materia de patrimonio...'",
        options: [
          "a) Viceconsejería",
          "b) Secretaría General de Agricultura, Ganadería y Alimentación",
          "c) Secretaría General Técnica",
          "d) Ninguna opción es correcta"
        ],
        correct: 2,
        justification: "La gestión patrimonial de bienes adscritos y el inventario de bienes corresponde a la Secretaría General Técnica de la Consejería."
      },
      {
        question: "7.- ¿A qué órgano central de la Consejería competente en materia de Medio Ambiente está adscrita la Agencia de Medio Ambiente y Agua (AMAYA) en la actualidad?",
        options: [
          "a) Secretaría General de Sostenibilidad, Medio Ambiente y Economía Azul",
          "b) Viceconsejería",
          "c) Dirección General de Espacios Naturales Protegidos",
          "d) Secretaría General Técnica"
        ],
        correct: 1,
        justification: "La Agencia de Medio Ambiente y Agua de Andalucía (AMAYA), como agencia pública empresarial, está adscrita directamente a la Viceconsejería."
      },
      {
        question: "8.- ¿Qué tipo de Agencia instrumental es la Fundación para el Desarrollo Sostenible de Doñana y su Entorno - Doñana 21?",
        options: [
          "a) Agencia Administrativa",
          "b) Fundación Pública Andaluza",
          "c) Agencia de Régimen especial",
          "d) Agencia Pública Empresarial"
        ],
        correct: 1,
        justification: "La Fundación Doñana 21 se adscribe al sector público instrumental como una Fundación Pública Andaluza."
      },
      {
        question: "9.- Según la normativa en vigor que establece la estructura orgánica de la Consejería de Sostenibilidad y Medio Ambiente, ¿a quién corresponde la siguiente competencia?: 'Promover y coordinar las políticas de mitigación y adaptación frente al cambio climático y para la transición hacia un nuevo modelo energético'.",
        options: [
          "a) Dirección General de Sostenibilidad Ambiental y Economía circular",
          "b) Secretaría General de Medio Ambiente y Cambio Climático",
          "c) Secretaría General Técnica",
          "d) Dirección General de Política Forestal y Biodiversidad"
        ],
        correct: 1,
        justification: "La promoción y coordinación de políticas de mitigación y adaptación frente al cambio climático corresponde a la Secretaría General de Medio Ambiente y Cambio Climático."
      },
      {
        question: "10.- ¿Cuál de los siguientes NO es un órgano de la Agencia de Medio Ambiente y Agua (AMAYA)?",
        options: [
          "a) La Vicepresidencia",
          "b) El Consejo Asesor",
          "c) La Dirección Gerencia",
          "d) El Consejo Rector"
        ],
        correct: 1,
        justification: "Los órganos de gobierno y gestión de la AMAYA son la Presidencia, la Vicepresidencia, el Consejo Rector y la Dirección Gerencia. El 'Consejo Asesor' no figura como órgano de la agencia."
      },
      {
        question: "11.- Según la normativa en vigor que establece la estructura orgánica de la Consejería de Sostenibilidad y Medio Ambiente, ¿a quién corresponde la competencia de planificación y ejecución de restauraciones hidrológico-forestales en los términos de la Ley 3/2026, de 13 de marzo?",
        options: [
          "a) Viceconsejería",
          "b) Secretaría General de Medio Ambiente, Cambio Climático y Economía Azul",
          "c) Dirección General de Espacios Naturales Protegidos",
          "d) Dirección General de Política Forestal y Biodiversidad."
        ],
        correct: 3,
        justification: "Corresponde a la Dirección General de Política Forestal y Biodiversidad la planificación y ejecución de las restauraciones hidrológico-forestales y hábitats forestales."
      },
      {
        question: "12.- ¿Qué normativa crea el Consejo Andaluz de Política Forestal y Biodiversidad?",
        options: [
          "a) Ley 3/2026, de 13 de marzo, de Montes de Andalucía",
          "b) Decreto 359/2003 de 22 de diciembre",
          "c) Decreto 104/2011, de 19 de abril",
          "d) Decreto 57/1995, de 7 de marzo"
        ],
        correct: 0,
        justification: "El Consejo Andaluz de Política Forestal y Biodiversidad queda regulado y creado a través de la Ley 3/2026, de 13 de marzo, de Montes de Andalucía."
      },
      {
        question: "13.- ¿Cuál de las siguientes NO es una función del Consejo Andaluz de Medio Ambiente?",
        options: [
          "a) Conocer preceptivamente los anteproyectos de ley referidos a medio ambiente, con excepción de aquellos supuestos en los que deba pronunciarse el Consejo Forestal Andaluz.",
          "b) Conocer preceptivamente los planes y programas ambientales de ámbito nacional, con excepción de aquellos supuestos en los que deba pronunciarse el Consejo Forestal Andaluz",
          "c) Emitir informes y efectuar propuestas en materia ambiental, a iniciativa propia o a petición de la Consejería de Medio Ambiente",
          "d) Elaborar propuestas sobre acciones de investigación, conocimiento, sensibilización y divulgación en materia de medio ambiente"
        ],
        correct: 1,
        justification: "El Consejo Andaluz de Medio Ambiente conoce de los planes y programas ambientales de ámbito autonómico andaluz, no de ámbito nacional."
      },
      {
        question: "14.- Según la normativa en vigor que establece la estructura orgánica de la Consejería de Sostenibilidad y Medio Ambiente, ¿a quién corresponde la propuesta de declaración de espacios naturales protegidos competencia de la Junta de Andalucía?",
        options: [
          "a) Dirección General de Espacios Naturales Protegidos",
          "b) Dirección General de Política Forestal y Biodiversidad",
          "c) Viceconsejería",
          "d) Dicha competencia es Estatal"
        ],
        correct: 0,
        justification: "La propuesta de declaración de espacios naturales protegidos y la evaluación de su impacto socioeconómico corresponde a la Dirección General de Espacios Naturales Protegidos."
      },
      {
        question: "15.- Según la normativa en vigor que establece la estructura orgánica de la Consejería, ¿a quién corresponde la planificación, programación y coordinación de la vigilancia, inspección y control en materia de residuos, suelos contaminados y economía circular?",
        options: [
          "a) La Dirección General de Sostenibilidad Ambiental.",
          "b) La Dirección General de Economía Circular.",
          "c) La Dirección General de Sostenibilidad Ambiental y Gestión del Litoral.",
          "d) La Secretaría General Técnica en materia de Prevención Ambiental."
        ],
        correct: 1,
        justification: "Corresponde de forma específica a la Dirección General de Economía Circular el área de residuos, suelos contaminados y economía circular."
      },
      {
        question: "16.- Según la normativa en vigor que establece la estructura orgánica de la Consejería de Sostenibilidad y Medio Ambiente, ¿a quién corresponden las autorizaciones de emisión de gases de efecto invernadero y su seguimiento?",
        options: [
          "a) Secretaría General de Medio Ambiente y Cambio Climático",
          "b) Dirección General de Política Forestal y Biodiversidad",
          "c) Dirección General de Sostenibilidad Ambiental y Economía Circular",
          "d) Dirección General de Sostenibilidad Ambiental y Gestión del Litoral"
        ],
        correct: 0,
        justification: "Las autorizaciones de emisión de gases de efecto invernadero y su seguimiento corresponden a la Secretaría General de Medio Ambiente y Cambio Climático."
      },
      {
        question: "17.- A tenor de lo establecido en el Decreto 57/2011, de 15 de marzo, por el que se regula la Comisión Andaluza para la Dehesa, ¿Quién ostenta la presidencia de dicha Comisión?",
        options: [
          "a) La persona titular de la Consejería competente en materia de Medio Ambiente",
          "b) La persona titular de la Secretaría General competente en gestión del medio natural",
          "c) La persona titular de la Dirección General competente en gestión del medio natural",
          "d) La persona titular de la Secretaría General competente en materia de agricultura y alimentación."
        ],
        correct: 3,
        justification: "La Presidencia de la Comisión Andaluza para la Dehesa corresponde a la persona titular de la Secretaría General competente en materia de agricultura y alimentación."
      },
      {
        question: "18.- Según la normativa en vigor, ¿a quién corresponde la 'organización y coordinación de los Agentes Medioambientales de Andalucía, sin perjuicio de las competencias atribuidas a los órganos directivos periféricos'?",
        options: [
          "a) Secretaría General de Medio Ambiente, Agua y Cambio Climático",
          "b) Dirección General de Política Forestal y Biodiversidad",
          "c) Secretaría General de Medio Ambiente y Cambio Climático",
          "d) Dirección General de Sostenibilidad Ambiental y Personal Ambiental."
        ],
        correct: 2,
        justification: "Corresponde a la Secretaría General de Medio Ambiente y Cambio Climático la organización y coordinación de los Agentes Medioambientales de Andalucía."
      },
      {
        question: "19.- ¿Cuál de las siguientes NO es una función del Consejo Andaluz de Medio Ambiente?",
        options: [
          "a) Informar preceptivamente los proyectos de aprovechamientos de flora y fauna silvestre cuando superen el ámbito provincial.",
          "b) Emitir informes y efectuar propuestas en materia ambiental, a iniciativa propia o a petición de la Consejería de Medio Ambiente.",
          "c) Elaborar propuestas sobre acciones de investigación, conocimiento, sensibilización y divulgación en materia de medio ambiente.",
          "d) Informar la propuesta de programa anual de la REDIAM."
        ],
        correct: 0,
        justification: "El informe de proyectos de aprovechamiento de flora y fauna silvestre no forma parte del catálogo funcional general atribuido al Consejo Andaluz de Medio Ambiente."
      },
      {
        question: "20.- Según la estructura orgánica de la Consejería de Sostenibilidad y Medio Ambiente, ¿a quién corresponde la ordenación, recuperación, gestión del uso público e integración de la red andaluza de vías pecuarias y la custodia de su Fondo Documental?",
        options: [
          "a) Secretaría General Técnica.",
          "b) Viceconsejería.",
          "c) Secretaría General de Medio Ambiente y Cambio Climático.",
          "d) Dirección General de Política Forestal y Biodiversidad."
        ],
        correct: 3,
        justification: "La ordenación, gestión, recuperación y custodia del Fondo Documental de la Red Andaluza de Vías Pecuarias corresponde a la Dirección General de Política Forestal y Biodiversidad."
      }
    ];

    const test2Questions = [
      {
        question: "21.- ¿Cuál es la formulación exacta del derecho al medio ambiente recogida en el artículo 45.1 de la Constitución Española de 1978?",
        options: [

    const allQuestions = [...test1Questions, ...test2Questions, ...test3Questions];

    const quizBlocks = {
      "all": allQuestions,
      "t1": allQuestions.slice(0, 20),
      "t2_b1": allQuestions.slice(20, 45),
      "t2_b2": allQuestions.slice(45, 70),
      "t2_b3": allQuestions.slice(70, 95),
      "t2_b4": allQuestions.slice(95, 120),
      "t3": allQuestions.slice(120, 140)
    };

    let activeData = [];
    let answeredCount = 0;
    let correctCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function changeBlock() {
      const selected = document.getElementById('block-select').value;
      activeData = quizBlocks[selected] || quizBlocks["all"];

      const titles = {
        "all": "EXAMEN COMPLETO DE AUTOEVALUACIÓN - TEMA 1 (140 PREGUNTAS)",
        "t1": "TEST 1 DE AUTOEVALUACIÓN - TEMA 1 (PREGUNTAS 1 A 20)",
        "t2_b1": "TEST 2 - BLOQUE 1 (PREGUNTAS 21 A 45)",
        "t2_b2": "TEST 2 - BLOQUE 2 (PREGUNTAS 46 A 70)",
        "t2_b3": "TEST 2 - BLOQUE 3 (PREGUNTAS 71 A 95)",
        "t2_b4": "TEST 2 - BLOQUE 4 (PREGUNTAS 96 A 120)",
        "t3": "TEST 3 BÁSICO - TEMA 1 (PREGUNTAS 121 A 140)"
      };

      document.getElementById('test-title').textContent = titles[selected] || titles["all"];
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = `¡Correcto! ${q.justification}`;
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(97 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}). Justificación: ${q.justification}`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const finalScore = activeData.length > 0 ? ((correctCount / activeData.length) * 10).toFixed(2) : "0.00";
      document.getElementById('score').textContent = `⭐ ${finalScore}/10`;
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar
    changeBlock();
  </script>
