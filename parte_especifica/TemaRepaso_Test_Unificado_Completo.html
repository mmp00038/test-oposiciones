<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Interactivo - Agentes de Medio Ambiente (Test de Repaso-1)</title>
  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  /* Botón orgánico inspirado en la naturaleza */
    .box, .btn-volver {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #2e7d32;
      color: #ffffff !important;
      padding: 0.6rem 1.25rem;
      border-radius: 0.75rem;
      border: 1px solid #1b5e20;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none !important;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    
    .box:hover, .box:active,
    .btn-volver:hover, .btn-volver:active {
      background-color: #1b5e20;
      color: #ffffff !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(46, 125, 50, 0.25);
    }

    /* Estilo del botón Reiniciar Progreso */
    .btn-reset {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
  
    .btn-reset:hover, .btn-reset:active {
      background-color: #dc2626;
    }
  </style>
</head>
<body>

  <header>
    <div class="selector-box">
      <select id="block-select" onchange="changeBlock()">
        <option value="all">Test Completo (75 preguntas)</option>
        <option value="b1">Bloque 1 (Preguntas 1 - 25)</option>
        <option value="b2">Bloque 2 (Preguntas 26 - 50)</option>
        <option value="b3">Bloque 3 (Preguntas 51 - 75)</option>
      </select>
    </div>
    <div class="stat-box">
      <span class="stat-label">Tiempo</span>
      <span class="stat-value" id="timer">⏱️ 00:00</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Contestadas</span>
      <span class="stat-value" id="progress">📝 0/0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Aciertos</span>
      <span class="stat-value" id="accuracy">🎯 0%</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Nota</span>
      <span class="stat-value" id="score">⭐ 0.00/10</span>
    </div>
  </header>

  <div class="container">
    <h1 class="test-title" id="test-title">TEMAS 3, 4, 5, 12, 16 Y 18 - TEST DE REPASO-1</h1>
    <div id="quiz-container"></div>
    <div class="reset-container">
      <button class="reset-btn" onclick="resetQuiz()">Reiniciar Test</button>
    </div>
  </div>

  <script>
    const allQuestions = [
      {
        question: "1. En el contexto de la política medioambiental de la Unión Europea, el Tratado de Maastricht supuso:",
        options: [
          "a) La incorporación de un título específico sobre medio ambiente en el TFUE",
          "b) La consolidación de la política medioambiental como uno de los ámbitos políticos oficiales de la Unión",
          "c) La obligación de integrar la protección del medio ambiente en todas las políticas sectoriales de la UE para promover el desarrollo sostenible",
          "d) Que la lucha contra el cambio climático pasara a ser un objetivo específico de la UE"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B)."
      },
      {
        question: "2. Indique cuál de los siguientes NO es uno de los principios fundamentales de la Agenda 2030 para el Desarrollo sostenible:",
        options: [
          "a) Interconexión e indivisibilidad",
          "b) Inclusión",
          "c) Solidaridad",
          "d) No dejar a nadie atrás"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)."
      },
      {
        question: "3. ¿Cuándo aprobó el Consejo de Ministros la Estrategia Española de Desarrollo Sostenible 2030?",
        options: [
          "a) 5 de junio de 2021",
          "b) 28 de junio de 2018",
          "c) 5 de junio de 2020",
          "d) 28 de junio de 2022"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: 5 de junio de 2021)."
      },
      {
        question: "4. Según establece el art. 57.3 del Estatuto de Autonomía de Andalucía, el establecimiento y la regulación de los instrumentos de planificación ambiental y del procedimiento de tramitación y aprobación de estos instrumentos, es una competencia de la Comunidad Autónoma de Andalucía del tipo:",
        options: [
          "a) Ejecutiva",
          "b) Exclusiva",
          "c) Compartida",
          "d) Básica del Estado"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Compartida)."
      },
      {
        question: "5. Uno de los objetivos generales del Plan de Medio Ambiente Horizonte 2017 es:",
        options: [
          "a) Proteger y conservar los paisajes andaluces como herramienta para una mejor integración del territorio andaluz",
          "b) Conservar la biodiversidad y la geodiversidad",
          "c) Defender el patrimonio forestal",
          "d) Cooperación internacional para el desarrollo del monte mediterráneo"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)."
      },
      {
        question: "6. ¿Cuál de las siguientes NO es un área de actuación del PMA Horizonte 2017?",
        options: [
          "a) Mantenimiento y mejora de los servicios administrativos",
          "b) Integración ambiental de la actividad económica",
          "c) Mejora de la gobernanza",
          "d) Información ambiental"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)."
      },
      {
        question: "7. El objeto y ámbito de la aplicación de la Ley 8/2003, de 28 de octubre, abarca:",
        options: [
          "a) La protección, conservación y recuperación de la flora y fauna silvestres",
          "b) La protección, conservación y recuperación de los hábitats",
          "c) La regulación de los aprovechamientos de las especies silvestres",
          "d) Todas son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas son correctas)."
      },
      {
        question: "8. La Ley 42/2007, de 13 de diciembre, en su art. 3.38, define el \"Patrimonio geológico\" como:",
        options: [
          "a) Territorios delimitados que presentan formas geológicas únicas...",
          "b) Variedad de elementos geológicos, incluidos rocas, minerales...",
          "c) Conjunto de recursos naturales geológicos de valor científico, cultural y/o educativo, ya sean formaciones y estructuras geológicas...",
          "d) Ninguna es correcta"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)."
      },
      {
        question: "9. ¿Cuántos Anexos tiene la Ley 42/2007, de 13 de diciembre, del Patrimonio Natural y la Biodiversidad?:",
        options: [
          "a) 6",
          "b) 7",
          "c) 8",
          "d) 9"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: 8 anexos)."
      },
      {
        question: "10. Conforme al art. 13 de la Ley 42/2007, de 13 de diciembre, el Plan Estratégico del Patrimonio Natural y la Biodiversidad, tendrá una vigencia de:",
        options: [
          "a) 10 años",
          "b) En todo caso, no podrá ser superior a 10 años",
          "c) 6 años",
          "d) En cualquier caso, un mínimo de 5 años"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: No podrá ser superior a 10 años)."
      },
      {
        question: "11. En relación con el aprovechamiento de especies silvestres regulado en el art. 31 de la Ley 8/2003, de 28 de octubre, la recogida esporádica en pequeñas cantidades de ejemplares de especies silvestres de invertebrados, plantas y hongos en los lugares y fechas tradicionales... requerirá:",
        options: [
          "a) Autorización de la CMA",
          "b) Comunicación previa a la CMA",
          "c) Declaración responsable",
          "d) No requiere autorización"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: No requiere autorización)."
      },
      {
        question: "12. El Decreto 23/2012, de 14 de febrero, por el que se regula la conservación y el uso sostenible de la flora y la fauna silvestres y sus hábitats, crea el...",
        options: [
          "a) Catálogo Andaluz de Especies Amenazadas",
          "b) Catálogo Andaluz de Especies Exóticas Invasoras",
          "c) Registro Andaluz de Aprovechamientos de la Flora y la Fauna Silvestres",
          "d) B y C son correctas"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Catálogo Andaluz de Especies Exóticas Invasoras)."
      },
      {
        question: "13. La Ley 8/2003, de 28 de octubre, crea el/la:",
        options: [
          "a) Registro de Especies Amenazadas en Cautividad",
          "b) Red Andaluza de Centros de Conservación, Recuperación y Reintroducción de Especies Silvestres",
          "c) Inventario de Corredores Ecológicos Prioritarios y otros elementos de conexión",
          "d) Catálogo Andaluz de Especies Amenazadas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Catálogo Andaluz de Especies Amenazadas)."
      },
      {
        question: "14. Una de las excepciones al régimen general de protección establecido en la Ley 42/2007, de 13 de diciembre, es la siguiente:",
        options: [
          "a) Si de su aplicación se derivaran efectos perjudiciales para la salud y seguridad de las personas",
          "b) Por razones imperiosas de interés público de primer orden, excepto las de carácter socioeconómico",
          "c) Para proteger la flora y la fauna silvestres y los hábitats naturales",
          "d) A y C son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: A y C son correctas)."
      },
      {
        question: "15. El buitre negro (Aegypius monachus) en Andalucía lo podemos encontrar preferentemente en...",
        options: [
          "a) Sierra Morena",
          "b) Doñana",
          "c) Sierra Nevada",
          "d) Subbéticas"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: Sierra Morena)."
      },
      {
        question: "16. De las ocho especies recogidas en el Plan de Recuperación y Conservación de Aves de Humedales, señale cuál de ellas está catalogada como vulnerable:",
        options: [
          "a) Fumarel común (Chlidonias niger)",
          "b) Águila pescadora (Pandion haliaetus)",
          "c) Porrón pardo (Aythya niroca)",
          "d) Avetoro común (Botaurus stellaris)"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Águila pescadora)."
      },
      {
        question: "17. El Decreto 23/2012, de 14 de febrero, establece en su art. 14 el plazo máximo de resolución y silencio administrativo para el procedimiento de autorización para las excepciones al régimen general de protección de las especies silvestres. Este plazo es:",
        options: [
          "a) 2 meses, silencio desestimatorio",
          "b) 3 meses, silencio desestimatorio",
          "c) 2 meses, silencio estimatorio",
          "d) 3 meses, silencio estimatorio"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: 2 meses, silencio desestimatorio)."
      },
      {
        question: "18. La Red Andaluza de Centros de Recuperación, Conservación está compuesta por centros de las diferentes categorías, entre los que se encuentran los Centros de gestión de fauna amenazada. Atendiendo a la clasificación recogida en el art. 33 del Decreto 23/2012 de 14 de febrero, estos centros pueden ser... (señala la INCORRECTA):",
        options: [
          "a) Laboratorios de especies silvestres",
          "b) Centros de recuperación de especies amenazadas",
          "c) Muladares",
          "d) Centros de gestión del medio marino"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)."
      },
      {
        question: "19. Cuando hablamos de \"un dispositivo externo colocado sobre las crucetas para evitar que se posen las aves\", según establece el artículo 2 del Real Decreto 1432/2008, de 29 de agosto, nos referimos a:",
        options: [
          "a) Disuasor de posada",
          "b) Salvapájaros",
          "c) Aislador",
          "d) Ahuyentador"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: Disuasor de posada)."
      },
      {
        question: "20. Las medidas anticolisión reguladas en el art. 5 del Decreto 178/2006, de 10 de octubre, establecen que los salvapájaros o señalizadores estarán dispuestos cada:",
        options: [
          "a) 5 metros cuando el cable de tierra sea único",
          "b) 10 metros, en todo caso",
          "c) Se podrá prescindir de los salvapájaros en los cables de tierra cuando lleven adosado un cable de fibra óptica o similar, siempre que su sección no sea inferior a 20 mm",
          "d) A y C son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: A y C son correctas)."
      },
      {
        question: "21. El criterio seguido por el régimen sancionador que establece la Ley 42/2007, de 13 de diciembre, en su art. 80, para la clasificación de las infracciones tiene en cuenta:",
        options: [
          "a) El plazo de tiempo necesario para la recuperación del daño ocasionado",
          "b) La superficie afectada y el ciclo de vida de las especies afectadas",
          "c) El valor de los daños ocasionados y de los beneficios obtenidos",
          "d) Ninguna es correcta"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)."
      },
      {
        question: "22. El plazo de prescripción de las infracciones muy graves, graves y leves que establece la Ley 42/2007, de 13 de diciembre en su art. 83, será:",
        options: [
          "a) 5, 2 y 1 año, respectivamente",
          "b) 5, 3 y 1 año, respectivamente",
          "c) 3, 2 y 1 año, respectivamente",
          "d) 3, 2 y 6 meses, respectivamente"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: 5, 3 y 1 año)."
      },
      {
        question: "23. Según el art. 83 la Ley 8/2003, de flora y fauna silvestres, se pueden considerar como sanciones accesorias:",
        options: [
          "a) Las multas coercitivas",
          "b) Las indemnizaciones por daños causados",
          "c) La ocupación de los medios empleados para la ejecución de las infracciones",
          "d) Todas las anteriores son correctas"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: La ocupación de los medios empleados)."
      },
      {
        question: "24. De acuerdo con el art. 6 de la Ley 43/2003, de 21 de noviembre, de Montes, \"la repoblación, mediante siembra o plantación, de un terreno que era agrícola o estaba dedicado a otros usos no forestales\", se denomina:",
        options: [
          "a) Reforestación",
          "b) Forestación",
          "c) Repoblación Forestal",
          "d) Cambio de uso"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Forestación)."
      },
      {
        question: "25. A tenor de lo establecido en el art. 5 de la Ley de Montes estatal, las plantaciones de especies forestales de turno corto en régimen intensivo sobre terrenos agrícolas:",
        options: [
          "a) Se les aplica esta ley durante la vigencia de los turnos",
          "b) Se les aplica esta ley durante la vigencia de los turnos, a menos que la comunidad autónoma decida expresamente un periodo más corto",
          "c) Al ser terrenos agrícolas, lo dispuesto en esta Ley no les será de aplicación",
          "d) Al ser terrenos agrícolas, lo dispuesto en esta Ley no les será de aplicación, salvo que la Delegación Territorial decida lo contrario"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B)."
      },
      {
        question: "26. La ley 2/1992, de 15 de junio, Forestal de Andalucía, en su art. 1, excluye de la consideración legal de monte o terreno forestal:",
        options: [
          "a) Las construcciones e infraestructuras destinadas al servicio del monte",
          "b) Terrenos que excluyan las CCAA",
          "c) Terrenos con cultivos de plantas ornamentales y viveros",
          "d) Todas son correctas"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Terrenos con cultivos de plantas ornamentales y viveros)."
      },
      {
        question: "27. Conforme al art. 27 de la Ley 2/1992, Forestal de Andalucía, serán considerados \"suelo no urbanizable de especial protección\":",
        options: [
          "a) Los montes públicos",
          "b) Los montes protectores",
          "c) Los montes dentro de espacios naturales protegidos",
          "d) Los montes demaniales"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Los montes demaniales)."
      },
      {
        question: "28. Los procedimientos de afectación y desafectación al dominio público son, conforme a los artículos 41 y 42 del Reglamento Forestal (Decreto 208/1997), y la Ley 9/2001, iniciados por la Consejería competente en Medio Ambiente, y resueltos por:",
        options: [
          "a) El titular de la Consejería, en plazo de 12 meses",
          "b) El Consejo de Gobierno, en plazo de 12 meses",
          "c) El titular de la Consejería, en plazo de 10 meses",
          "d) El Consejo de Gobierno, en plazo de 10 meses"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: El Consejo de Gobierno, en plazo de 12 meses)."

        justification: "Conforme a la plantilla de respuestas oficial (Opción C: 9 regiones)."
      },
      {
        question: "75. El nuevo Programa LIFE, aprobado mediante el Reglamento (UE) 2021/783, abarca el periodo:",
        options: [
          "a) 2022-2030",
          "b) 2021-2027",
          "c) 2021-2025",
          "d) 2022-2026"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: 2021-2027)."
      }
    ];

    const quizBlocks = {
      "all": allQuestions,
      "b1": allQuestions.slice(0, 25),
      "b2": allQuestions.slice(25, 50),
      "b3": allQuestions.slice(50, 75)
    };

    let activeData = [];
    let answeredCount = 0;
    let correctCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function changeBlock() {
      const selected = document.getElementById('block-select').value;
      activeData = quizBlocks[selected] || quizBlocks["all"];

      const titles = {
        "all": "TEMAS 3, 4, 5, 12, 16 Y 18 - TEST DE REPASO-1 (COMPLETO 75 PREGUNTAS)",
        "b1": "TEMAS 3, 4, 5, 12, 16 Y 18 - BLOQUE 1 (PREGUNTAS 1 A 25)",
        "b2": "TEMAS 3, 4, 5, 12, 16 Y 18 - BLOQUE 2 (PREGUNTAS 26 A 50)",
        "b3": "TEMAS 3, 4, 5, 12, 16 Y 18 - BLOQUE 3 (PREGUNTAS 51 A 75)"
      };

      document.getElementById('test-title').textContent = titles[selected] || titles["all"];
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = `¡Correcto! ${q.justification}`;
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(97 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}). Justificación: ${q.justification}`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const finalScore = activeData.length > 0 ? ((correctCount / activeData.length) * 10).toFixed(2) : "0.00";
      document.getElementById('score').textContent = `⭐ ${finalScore}/10`;
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar
    changeBlock();
  </script>
</body>
</html>
