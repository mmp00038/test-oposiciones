  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  /* Botón orgánico inspirado en la naturaleza */
    .box, .btn-volver {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #2e7d32;
      color: #ffffff !important;
      padding: 0.6rem 1.25rem;
      border-radius: 0.75rem;

    .box:hover, .box:active,

      transform: translateY(-2px);

    /* Estilo del botón Reiniciar Progreso */
    .btn-reset {
      background-color: #ef4444;
      color: white;
      border: none;

      border-radius: 0.5rem;

      cursor: pointer;
      transition: background-color 0.2s;

      background-color: #dc2626;

  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ⚠️ REEMPLAZA ESTE BLOQUE CON TU CONFIGURACIÓN REAL DE FIREBASE
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyDxijpzkKAmP85H5MqYsS_UnnmS1ySAgC0",
      authDomain: "oposiciones-tests.firebaseapp.com",
      databaseURL: "https://oposiciones-tests-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "oposiciones-tests",
      storageBucket: "oposiciones-tests.firebasestorage.app",
      messagingSenderId: "334815991038",
      appId: "1:334815991038:web:287c3c46c72ee9837ec1af",
      measurementId: "G-55K6MR5WKS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const CURRENT_TOPIC_ID = 14;

    // Guardar nota e intentos en Firebase en tiempo real
    window.saveTestResults = async function(scoreNum) {
      if (window.testSavedForThisSession) return;
      window.testSavedForThisSession = true;

      try {
        const topicRef = ref(db, `progress/${CURRENT_TOPIC_ID}`);
        const snapshot = await get(topicRef);
        const data = snapshot.val() || {};

        const newAttempts = (data.attempts || 0) + 1;
        const currentBest = data.bestScore || 0;
        const newBest = Math.max(currentBest, parseFloat(scoreNum.toFixed(1)));

        await set(topicRef, {
          attempts: newAttempts,
          bestScore: newBest
        });
      } catch (e) {
        console.error("Error guardando en Firebase:", e);
      }
    };

    // Borrar historial de la nube
    window.resetTopicStats = async function() {
      if (confirm(`¿Quieres borrar los intentos y la nota máxima del Tema ${CURRENT_TOPIC_ID} en la nube?`)) {
        try {
          const topicRef = ref(db, `progress/${CURRENT_TOPIC_ID}`);
          await remove(topicRef);
          alert('Progreso borrado en la nube.');
          location.reload();
        } catch (e) {
          alert('Error al intentar borrar el progreso.');
        }
      }
    };
  </script>

  <script>
    // --- DATOS DE LOS EXÁMENES ---
    const test1Questions = [
      {
        question: "1.- El artículo 6 de la Ley 43/2003, de 21 de noviembre, de Montes, establece que la definición: \"conjunto de técnicas que tratan de la conservación, mejora, aprovechamiento y regeneración o, en su caso, restauración, de las masas forestales\", corresponde a:",
        options: [
          "a) Arboricultura",
          "b) Selvicultura",
          "c) Aprovechamiento forestal",
          "d) Turno"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Selvicultura)."
      },
      {
        question: "2.- Cuando hablamos de: \"espacio de superficie variable, pero con constancia de las características de masa y estación, y por tanto de tratamiento\", nos estamos refiriendo a:",
        options: [
          "a) Masa forestal",
          "b) Monte",
          "c) Rodal",
          "d) Bosquete"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Rodal)."
      },
      {
        question: "3.- ¿Cuál de las siguientes sería la \"estación\" de una especie forestal?",

          "a) Lugar geográfico en el que habita una especie",
          "b) Edad que alcanzan los individuos de una especie, en condiciones normales dentro de su habitación.",
          "c) Incremento de la masa forestal con respecto al tiempo.",
          "d) Conjunto de valores límites, del óptimo y de tolerancia, que toman los diversos factores ecológicos abióticos en relación con la presencia y desarrollo de una especie en ese lugar concreto."

        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D)."
      },
      {
        question: "4.- Cuando una especie forestal tiene su máximo desarrollo en condiciones de iluminación completa, diremos, en cuanto a su temperamento, que estamos ante una especie:",

          "a) Intolerante",
          "b) De luz",
          "c) Heliófila",
          "d) Todas las opciones anteriores son correctas."
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas las opciones anteriores son correctas)."
      },
      {
        question: "5.- Sin embargo, cuando el máximo desarrollo de una especie ocurre con una reducción importante de la iluminación, en cuanto al temperamento, hablaremos de una especie:",
        options: [
          "a) De temperamento robusto",
          "b) Tolerante",
          "c) Heliófila",
          "d) Latifoliada"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Tolerante)."
      },
      {
        question: "6.- En cuanto a la perpetuación de una especie vegetal a partir de brotes de cepa y/o raíz, señale la opción correcta:",
        options: [
          "a) Tanto los brotes de cepa como los de raíz, genéricamente, se denominan brinzales.",
          "b) Es común que dichas especies se utilicen en aprovechamiento de monte alto.",
          "c) Un brote de cepa se denomina retoño, mientras que un brote de raíz se denomina renuevo.",
          "d) Todas las respuestas anteriores son correctas."
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)."
      },
      {
        question: "7.- El grado de recubrimiento del suelo por la proyección vertical de las copas de arbolado, expresado en porcentaje, se denomina:",

          "a) Fracción de cabida de cubierta",
          "b) Espesura completa",
          "c) Espesura trabada",

        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: Fracción de cabida de cubierta)."
      },
      {
        question: "8.- Teniendo en cuenta las especies que constituyen las masas forestales, en función del aprovechamiento que de ellas se hace, nos encontramos:",

          "a) Resinosas y Frondosas",
          "b) Especies principales, especies secundarias y especies accesorias",

        correct: 1,

      },
      {
        question: "9.- Cuando el origen de las especies que forman parte de una masa forestal procede de la diseminación de individuos preexistentes en la masa, diremos que dichos individuos tienen un origen:",

      {

        options: [

          "c) Cortas preliminares, Cortas de siembra o diseminatorias y Cortas de Extracción.",
          "d) Cortas preparatorias, Cortas de siembra o diseminatorias y cortas de extracción o finales"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Cortas preparatorias, Cortas de siembra o diseminatorias y cortas de extracción o finales)."
      },
      {
        question: "14.- La Orden de 26 de septiembre de 1988, por la que se dan instrucciones para la ejecución de determinados trabajos en montes, en régimen privado, poblados con encinas y alcornoques, establece en su artículo 10 que el diseño del trazado de la red de prevención contra incendios forestales ha de permitir alcanzar una superficie protegida de compartimentos o bloques de hasta:",
        options: [

          "b) 200 hectáreas",
          "c) 400 hectáreas",
          "d) 800 hectáreas"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: 400 hectáreas)."
      },
      {
        question: "15.- El artículo 17 de la Orden de 26 de septiembre de 1988, por la que se dan instrucciones para la ejecución de determinados trabajos en montes, en régimen privado, poblados con encinas y alcornoques establece que el descorche tendrá que efectuarse dentro del período comprendido entre:",
        options: [
          "a) El 1 de junio y el 15 de octubre de cada año",
          "b) El 15 de noviembre y el 15 de marzo del año siguiente",
          "c) El 1 de mayo y el 31 de octubre de cada año",
          "d) El 1 de junio y el 1 de septiembre de cada año"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: El 1 de junio y el 1 de septiembre de cada año)."
      },
      {
        question: "16.- El anexo de la Orden de 26 de septiembre de 1988, por la que se dan instrucciones para la ejecución de determinados trabajos en montes, en régimen privado, poblados con encinas y alcornoques establece como instrucción específica obligatoria para la encina que no podrán cortarse ramas gruesas que tengan un diámetro superior, incluida la corteza, a:",
        options: [
          "a) 12 cm",
          "b) 15 cm",
          "c) 18 cm",
          "d) 21 cm"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: 15 cm)."
      },
      {
        question: "17.- El mismo anexo establece, como instrucción específica recomendada para la encina, que los brazos o ramas principales que conformen la cruz deben ser como máximo:",
        options: [
          "a) 2",

          "c) 4",
          "d) 5"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: 4)."
      },
      {
        question: "18.- Como instrucción específica obligatoria para la poda de alcornoques, dicho anexo de la mencionada orden, establece que la primera poda afectará:",
        options: [
          "a) Hasta una altura que no podrá sobrepasar dos veces el perímetro de la circunferencia medido sobre la corteza a la altura de 1,30 metros del suelo.",
          "b) Hasta una altura que no podrá sobrepasar dos veces y media el perímetro de la circunferencia medido sobre la corteza a la altura de 1,30 metros del suelo",
          "c) Hasta una altura que no podrá sobrepasar tres veces el perímetro de la circunferencia medido sobre la corteza a la altura de 1,30 metros del suelo",
          "d) Solo al primer metro y medio del fuste"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Solo al primer metro y medio del fuste)."
      },
      {
        question: "19.- En cuanto a las instrucciones generales recomendadas para la realización de cortafuegos, en el caso de actuaciones que se realicen en zonas de vegetación herbácea que circunden las masas arbóreas a proteger, la anchura mínima de los cortafuegos será de:",
        options: [
          "a) 5 metros",
          "b) 8 metros",
          "c) 10 metros",
          "d) Dos veces y media la altura máxima del vuelo."
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: 5 metros)."
      },
      {
        question: "20.- Dicho anexo de la mencionada orden incluye instrucciones obligatorias y recomendadas para la realización de Aclareos y Entresacas. Entre las instrucciones generales obligatorias se establece que tras las cortas sucesivas que se precisen efectuar en cada parcela de actuación, el suelo deberá quedar permanentemente cubierto por las copas de los árboles que permanezcan en pie con un grado de recubrimiento igual o superior, para pendientes superiores al 20%, de:",
        options: [
          "a) 20%",
          "b) 30%",
          "c) 40%",
          "d) 50%"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: 50%)."
      }
    ];

    // Unificación completa
    const allQuestions = [
      ...test1Questions,
      ...test2Questions
    ];

    const quizBlocks = {
      "all": allQuestions,
      "t1_all": test1Questions,
      "t1_b1": test1Questions.slice(0, 22),
      "t1_b2": test1Questions.slice(22, 45),
      "t2_all": test2Questions,
      "t2_b1": test2Questions.slice(0, 10),
      "t2_b2": test2Questions.slice(10, 20)
    };

    let activeData = [];
    let answeredCount = 0;
    let correctCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function changeBlock() {
      const selected = document.getElementById('block-select').value;
      activeData = quizBlocks[selected] || quizBlocks["all"];

      const titles = {
        "all": "TEMA 11 - SELVICULTURA Y TRATAMIENTOS SELVÍCOLAS (UNIFICADO COMPLETO 65 PREGUNTAS)",
        "t1_all": "TEST 11-1 - TEST BÁSICO N.º 1 COMPLETO (45 PREGUNTAS)",
        "t1_b1": "TEST 11-1 - BLOQUE 1 (PREGUNTAS 1 A 22)",
        "t1_b2": "TEST 11-1 - BLOQUE 2 (PREGUNTAS 23 A 45)",
        "t2_all": "TEST 11-2 - AUTOEVALUACIÓN N.º 1 COMPLETO (20 PREGUNTAS)",
        "t2_b1": "TEST 11-2 - BLOQUE 1 (PREGUNTAS 1 A 10)",
        "t2_b2": "TEST 11-2 - BLOQUE 2 (PREGUNTAS 11 A 20)"
      };

      document.getElementById('test-title').textContent = titles[selected] || titles["all"];
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = `¡Correcto! ${q.justification}`;
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(97 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}). Justificación: ${q.justification}`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const finalScore = activeData.length > 0 ? ((correctCount / activeData.length) * 10).toFixed(2) : "0.00";
      document.getElementById('score').textContent = `⭐ ${finalScore}/10`;
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar
    changeBlock();
  </script>
