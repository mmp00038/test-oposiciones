<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Interactivo Unificado - Tema 13 (Caza y Pesca Continental)</title>
  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  /* Botón orgánico inspirado en la naturaleza */
    .box, .btn-volver {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #2e7d32;
      color: #ffffff !important;
      padding: 0.6rem 1.25rem;
      border-radius: 0.75rem;
      border: 1px solid #1b5e20;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none !important;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    
    .box:hover, .box:active,
    .btn-volver:hover, .btn-volver:active {
      background-color: #1b5e20;
      color: #ffffff !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(46, 125, 50, 0.25);
    }

    /* Estilo del botón Reiniciar Progreso */
    .btn-reset {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
  
    .btn-reset:hover, .btn-reset:active {
      background-color: #dc2626;
    }
  </style>
</head>
<body>

  <header>
    <div class="box">
        <a href="../especifica.html" class="btn-volver">← Volver</a>
    </div>
    <div class="box">
        <button type="button" onclick="resetTopicStats()" class="btn-reset">🗑️ Reiniciar Progreso</button>
    </div>
    <div class="selector-box">
      <select id="block-select" onchange="changeBlock()">
        <optgroup label="Todos los Exámenes">
          <option value="all">Tema 13 Unificado Completo (99 preguntas)</option>
        </optgroup>
        <optgroup label="Test 13.1 (29 Preguntas)">
          <option value="t1_all">Test 13.1 - Completo (1 - 29)</option>
          <option value="t1_b1">Test 13.1 - Bloque 1 (1 - 15)</option>
          <option value="t1_b2">Test 13.1 - Bloque 2 (16 - 29)</option>
        </optgroup>
        <optgroup label="Test 13.2 (20 Preguntas)">
          <option value="t2_all">Test 13.2 - Completo (1 - 20)</option>
          <option value="t2_b1">Test 13.2 - Bloque 1 (1 - 10)</option>
          <option value="t2_b2">Test 13.2 - Bloque 2 (11 - 20)</option>
        </optgroup>
        <optgroup label="Infracciones y Sanciones (25 Preguntas)">
          <option value="t3_all">Infracciones/Sanciones - Completo (1 - 25)</option>
          <option value="t3_b1">Infracciones/Sanciones - Bloque 1 (1 - 13)</option>
          <option value="t3_b2">Infracciones/Sanciones - Bloque 2 (14 - 25)</option>
        </optgroup>
        <optgroup label="Supuesto Práctico (25 Preguntas)">
          <option value="t4_all">Supuesto Práctico - Completo (1 - 25)</option>
          <option value="t4_b1">Supuesto Práctico - Bloque 1 (1 - 13)</option>
          <option value="t4_b2">Supuesto Práctico - Bloque 2 (14 - 25)</option>
        </optgroup>
      </select>
    </div>
    <div class="stat-box">
      <span class="stat-label">Tiempo</span>
      <span class="stat-value" id="timer">⏱️ 00:00</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Contestadas</span>
      <span class="stat-value" id="progress">📝 0/0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Aciertos</span>
      <span class="stat-value" id="accuracy">🎯 0%</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Nota</span>
      <span class="stat-value" id="score">⭐ 0.00/10</span>
    </div>
  </header>

  <div class="container">
    <h1 class="test-title" id="test-title">TEMA 13 - CAZA Y PESCA CONTINENTAL (UNIFICADO)</h1>
    <div id="quiz-container"></div>
    <div class="reset-container">
      <button class="reset-btn" onclick="resetQuiz()">Reiniciar Test</button>
    </div>
  </div>

  <script>
    // --- DATOS DE LOS EXÁMENES ---
    const test1Questions = [
      {
        question: "1. Según el Reglamento de Ordenación de la Caza, la solicitud de constitución de un coto será resuelta por:",
        options: [
          "a) El titular del órgano territorial competente para los tres tipos de coto de caza",
          "b) El titular del órgano territorial competente para los cotos privados y los cotos intensivos, correspondiéndole al titular de la Dirección General competente en materia de caza la resolución de constitución de los cotos deportivos",
          "c) El titular del órgano territorial competente para los cotos privados y los cotos deportivos, correspondiéndole al titular de la Dirección General competente en materia de caza la resolución de constitución de los cotos intensivos",
          "d) Ninguna respuesta es correcta"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)[cite: 242]."
      },
      {
        question: "2. Según el artículo 16 del Reglamento de Ordenación de la Caza, la vigencia de los planes técnicos de caza será de:",
        options: [
          "a) 1, 3 o 5 años",
          "b) 5 años",
          "c) Indefinida, en los casos de planes técnicos sometidos a régimen de evaluación continua",
          "d) b y c son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: b y c son correctas)[cite: 242]."
      },
      {
        question: "3. El artículo 14 del Reglamento de Ordenación de la Caza establece la obligación de presentar una memoria de actividades cinegética. Con respecto a esta memoria, señale la respuesta CORRECTA:",
        options: [
          "a) Esta memoria se presentará anualmente, antes del 15 de julio y la no presentación conllevará la posibilidad de la suspensión de la actividad cinegética",
          "b) Esta memoria se presentará anualmente antes del 15 de junio y la no presentación conllevará la posibilidad de suspensión de la actividad cinegética",
          "c) Esta memoria se presentará anualmente antes del 15 de julio y la no presentación conllevará la posibilidad de la extinción de la condición de coto",
          "d) Esta memoria se presentará anualmente antes del 15 de junio y la no presentación conllevará la posibilidad de extinción de la condición de coto"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B)[cite: 242]."
      },
      {
        question: "4. Según el artículo 48 del Reglamento de Ordenación de la Caza, NO será motivo para perder la condición de escenario de caza:",
        options: [
          "a) Qué los ejemplares objeto de suelta no procedan de granjas cinegéticas certificadas",
          "b) Qué el titular cinegético no disponga de guías de origen y sanidad de las sueltas realizadas en la temporada de caza",
          "c) Qué se lleven a cabo infracciones en materia de sueltas",
          "d) Todo lo anterior es motivo para perder la condición de escenario de caza"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todo lo anterior es motivo para perder la condición de escenario de caza)[cite: 242]."
      },
      {
        question: "5. Según establece el Reglamento de Ordenación de la Caza en su artículo 11, ¿cuál de las siguientes afirmaciones respecto a los Planes de caza por Áreas Cinegéticas NO es correcta?",
        options: [
          "a) Son los instrumentos básicos de planificación, ordenación y gestión cinegética en ámbitos territoriales considerados cinegéticos, que sean geográfica y ecológicamente homogéneos.",
          "b) Se aprobarán por Orden de quien ostente la titularidad de la Consejería en materia de caza.",
          "c) La iniciación de su elaboración le corresponde a la Dirección General competente en materia de caza.",
          "d) Tendrán una vigencia de 10 años, pudiendo ser actualizados cada 5 años"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)[cite: 242]."
      },
      {
        question: "6. El artículo 18 del Reglamento de Ordenación de la Caza establece una serie de cuestion con respecto a las Zonas de Reserva. Indique la respuesta INCORRECTA:",
        options: [
          "a) Todos los planes técnicos de caza deben establecer zonas de reserva",
          "b) En las zonas de reserva no podrá practicarse la caza ni cualquier actividad que afecte negativamente a las especies, incluida la adopción de las medidas de control de daños previstas en el artículo 66",
          "c) El espacio destinado a zona de reserva ascenderá como mínimo al 5% de la superficie del coto, salvo para los cotos intensivos que será superior al 10%",
          "d) La respuesta b y c son incorrectas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: La respuesta b y c son incorrectas)[cite: 242]."
      },
      {
        question: "7. El Reglamento de Ordenación de la Caza, en su artículo 17, establece una serie de circunstancias y supuestos que determinan la necesidad de aprobar un nuevo plan técnico o por el contrario requiere únicamente su modificación. Indique para cuál de los siguientes supuestos NO es necesario la aprobación de un nuevo plan técnico:",
        options: [
          "a) Cuando se pretenda modificar el aprovechamiento principal",
          "b) Cuando se quiera modificar una zona de reserva",
          "c) Cuando se pretenda instalar un escenario de caza",
          "d) Las respuesta b y c son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Las respuestas b y c son correctas)[cite: 242]."
      },
      {
        question: "8. Según el artículo 48.2 del Reglamento de Ordenación de la Caza, los escenarios de caza se clasifican en:",
        options: [
          "a) Escenarios de caza deportiva, para adiestramiento y entrenamiento de perros y/o aves de cetrería y los escenarios de caza intensiva",
          "b) Escenarios de caza deportiva, para adiestramiento y entrenamiento de perros y/o aves de cetrería y para práctica de modalidades",
          "c) Escenarios de caza privados, para adiestramiento y entrenamiento de perros y/o aves de cetrería y para práctica de modalidades",
          "d) Escenarios de caza privados, escenarios de caza deportivos y para práctica de modalidades"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B)[cite: 242]."
      },
      {
        question: "9. Señale la respuesta INCORRECTA con respecto a las sueltas:",
        options: [
          "a) Se debe comunicar al órgano territorial provincial competente en materia de caza, con 10 días de antelación a su realización",
          "b) Las especies objeto de suelta procederán de granjas cinegéticas autorizadas y certificadas o especies capturadas en otras partes del coto, siempre que en su plan técnico se contemple la captura en vivo",
          "c) El plazo máximo entre suelta y la acción de la caza será de 34 horas",
          "d) Todas las respuestas anteriores son incorrectas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas las respuestas anteriores son incorrectas)[cite: 242]."
      },
      {
        question: "10. En cuanto al control de daños, la comunicación que se debe realizar al órgano territorial provincial competente será de:",
        options: [
          "a) Una antelación mínima de 15 días a su realización",
          "b) Una antelación mínima de 10 días a su realización",
          "c) Una antelación mínima de 20 días a su realización",
          "d) Se comunicará en el plazo máximo de 10 días desde su realización"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Una antelación mínima de 10 días a su realización)[cite: 242]."
      },
      {
        question: "11. ¿Cuál de las siguientes afirmaciones sobre cercados cinegéticos es CORRECTA?",
        options: [
          "a) Los cercados podrán ser de gestión y de prevención",
          "b) Como norma general, su altura mínima será de 140 cm y la máxima de 250 cm",
          "c) La superficie mínima permitida para la instalación de los cercados de prevención será de 2.000 hectáreas",
          "d) Se podrán autorizar cercados de protección eléctricos, siempre que dispongan de una abertura inferior mínima de 35 cm de altura al suelo"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D)[cite: 242]."
      },
      {
        question: "12. No es una modalidad de caza menor recogida en el Reglamento de Ordenación de la Caza:",
        options: [
          "a) Al salto",
          "b) Perros en madriguera",
          "c) En espera",
          "d) Cetrería"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: En espera)[cite: 242]."
      },
      {
        question: "13. En un coto cuya superficie es de 2.560 hectáreas ¿Cuántas monterías podríamos llevar a cabo en una temporada de caza?",
        options: [
          "a) 3",
          "b) 2",
          "c) 5",
          "d) 6"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: 5)[cite: 242]."
      },
      {
        question: "14. Señale la respuesta incorrecta con respecto a la modalidad de aguardo nocturno:",
        options: [
          "a) Se trata de una modalidad de caza mayor",
          "b) Lo podrán llevar a cabo un máximo de 2 personas cazadoras por cada 250 hectáreas y jornada",
          "c) La distancia mínima entre puestos será de 150 metros",
          "d) Podrá portarse y utilizarse una linterna en el momento del disparo, por motivos de seguridad"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B)[cite: 242]."
      },
      {
        question: "15. Se quiere constituir un coto de caza cuya superficie abarca las provincias de Málaga y Granada. ¿A quién le corresponderá la resolución de la autorización para su instalación?:",
        options: [
          "a) Al titular de la Dirección General competente en materia de caza",
          "b) Al titular del órgano periférico competente donde tenga establecida su residencia el titular del terreno que quiere pasar a ser cinegético",
          "c) Al titular del órgano periférico competente en cuyo territorio se ubique el mayor número de hectáreas de la totalidad del terreno afectado",
          "d) Ninguna respuesta es correcta"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C)[cite: 242]."
      },
      {
        question: "16. ¿Cuál de las siguientes aves acuáticas NO es una especie declarada cazable en Andalucía?",
        options: [
          "a) Cerceta común",
          "b) Ánade real",
          "c) Agachadiza común",
          "d) Cerceta pardilla"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Cerceta pardilla)[cite: 242]."
      },
      {
        question: "17. ¿Cuál de las siguientes especies NO está incluida como especie cazable en Andalucía?",
        options: [
          "a) Cabra montés",
          "b) Muflón",
          "c) Gamo",
          "d) Todas son especies cazables en Andalucía"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas son especies cazables en Andalucía)[cite: 242]."
      },
      {
        question: "18. ¿Cuál de las siguientes especies NO pueden ser objeto de caza en Andalucía?",
        options: [
          "a) Porrón pardo",
          "b) Focha moruna",
          "c) Garcilla cangrejera",
          "d) Ninguna de estas especies puede ser objeto de caza en Andalucía"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Ninguna de estas especies puede ser objeto de caza en Andalucía)[cite: 242]."
      },
      {
        question: "19. El Anexo III del Reglamento de Ordenación de la Caza establece las especies objeto de caza comercializables en Andalucía. Indique cuál de estas listas está integrada por especies comercializables:",
        options: [
          "a) Ciervo, muflón, jabalí, ánade real, conejo y faisán",
          "b) Cabra montés, corzo, liebre, perdiz roja, pato cuchara y paloma zurita",
          "c) Gamo, corzo, arruí, conejo, perdiz roja y codorniz",
          "d) Gamo, muflón, jabalí, faisán y paloma torcaz"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)[cite: 242]."
      },
      {
        question: "20. Según la Orden de 13 de julio de 2007, con respecto a la señalización de terrenos. Señale la respuesta CORRECTA:",
        options: [
          "a) Todas las señales deben estar orientadas de forma que su contenido pueda verse desde el exterior del terreno señalizado, excepto las de la zona de seguridad que lo harán exclusivamente hacia el interior del terreno cinegético en que se encuentren",
          "b) Las señales de primer orden estarán a una distancia no superior a 500 metros",
          "c) Las dimensiones de las señales de segundo orden serán de 20x20 centímetros",
          "d) Las señales de segundo orden en las zonas de reserva tendrán la parte superior derecha en blanco e inferior izquierda en rojo"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)[cite: 242]."
      },
      {
        question: "21. La orden de 22 de Marzo de 2021, por la que se regula la práctica de la cetrería en la Comunidad Autónoma de Andalucía establece en su artículo 11 que las aves se podrán ceder de manera temporal o definitiva. Indique la respuesta correcta:",
        options: [
          "a) La cesión temporal supondrá un cambio temporal de titularidad en la Subsección de aves de cetrería por el tiempo que dure ésta",
          "b) La cesión temporal no supondrá un cambio de titularidad en la Subsección de aves de cetrería, si bien no podrá superar los 6 meses de duración",
          "c) La cesión temporal no supondrá un cambio de titularidad en la Subsección de aves de cetrería, si bien esta no podrá superar los 12 meses de duración",
          "d) Cuando se trate de una cesión definitiva se deberá comunicar con el fin de que se produzca un cambio en los datos referentes al nombre de la persona receptora del ave"
        ],
        correct: 1,

        "t4_all": "SUPUESTO PRÁCTICO TEMA 13 - COMPLETO (25 PREGUNTAS)",
        "t4_b1": "SUPUESTO PRÁCTICO TEMA 13 - BLOQUE 1 (PREGUNTAS 1 A 13)",
        "t4_b2": "SUPUESTO PRÁCTICO TEMA 13 - BLOQUE 2 (PREGUNTAS 14 A 25)"
      };

      document.getElementById('test-title').textContent = titles[selected] || titles["all"];
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = `¡Correcto! ${q.justification}`;
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(97 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}). Justificación: ${q.justification}`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const finalScore = activeData.length > 0 ? ((correctCount / activeData.length) * 10).toFixed(2) : "0.00";
      document.getElementById('score').textContent = `⭐ ${finalScore}/10`;
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar
    changeBlock();
  </script>
</body>
