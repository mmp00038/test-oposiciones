<head>

  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  </style>
</head>

  <div class="container">
    <h1 class="test-title" id="test-title">TEMA 8 - PLAGAS Y ENFERMEDADES FORESTALES (UNIFICADO)</h1>
    <div id="quiz-container"></div>
    <div class="reset-container">
      <button class="reset-btn" onclick="resetQuiz()">Reiniciar Test</button>
    </div>
  </div>

  <script>
    // --- DATOS DE LOS EXÁMENES ---
    const test1Questions = [
      {
        question: "1.- Una plaga o enfermedad forestal se caracteriza por:",
        options: [
          "a) El ataque de un insecto a cualquier parte de una planta.",
          "b) La desaparición o alteración del equilibrio natural que existe en un ecosistema determinado, creando de esta manera variaciones en él.",
          "c) Ataques puntuales a especies forestales.",
          "d) Todas las respuestas son correctas."
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B)."
      },
      {
        question: "2.- Señale la respuesta correcta:",
        options: [
          "a) Una plaga es toda alteración de un cultivo producida por organismos del reino animal como vertebrados, nemátodos y sobre todo insectos, que producen daños y pérdidas apreciables de producción y calidad. Por lo general son de fácil identificación y tratamiento",
          "b) Una enfermedad es la alteración del cultivo producida por hongos, bacterias y virus que causan daños y perturbaciones en el metabolismo de las plantas. Suelen ser en cambio de difícil determinación y control.",
          "c) Las opciones a) y b) son correctas",
          "d) Todas las respuestas son falsas"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Las opciones a) y b) son correctas)."
      },
      {
        question: "3.- Según la parte de la planta atacada podemos encontrar plagas provocadas por:",
        options: [
          "a) Defoliadores y chupadores",
          "b) Defoliadores y barrenadores",
          "c) Herbívoros y saprófitos",
          "d) Defoliadores, perforadores, descortezadores y chupadores"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Defoliadores, perforadores, descortezadores y chupadores)."
      },
      {
        question: "4.- Según lo establecido en el artículo 86 del Decreto 208/1997, de 9 de septiembre, por el que se aprueba el Reglamento Forestal de Andalucía, ¿a quién corresponde adoptar las medidas necesarias para cumplir lo establecido en el artículo 49 de la Ley 2/1992, Forestal de Andalucía (Los montes deben ser defendedos de los agentes nocivos que pongan en peligro el cumplimiento de sus funciones ecológicas, sociales y económicas, así como la salud humana)?",
        options: [
          "a) A la Administración Forestal",
          "b) A los propietarios de los terrenos forestales",
          "c) A las Entidades Locales",
          "d) A la Consejería competente en materia de salud"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: A la Administración Forestal)."
      },
      {
        question: "5.- El lepidóptero Thaumetopoea pityocampa es uno de los principales agentes causantes de plagas en Andalucía, y se caracteriza porque se trata de una especie:",
        options: [
          "a) Perforadora de especies del género Pinus",
          "b) Defoliadora de especies del género Quercus",
          "c) Perforadora de especies del género Populus",
          "d) Defoliadora de especies del género Pinus"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Defoliadora de especies del género Pinus)."
      },
      {
        question: "6.- ¿Por cuantas fases larvarias pasará una oruga de Thaumetopoea pityocampa antes de crisalidar?",
        options: [
          "a) 4 fases larvarias",
          "b) 5 fases larvarias",
          "c) 6 fases larvarias",
          "d) 5 fases larvarias en el caso de insectos macho, 6 en el caso de las hembras."
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: 5 fases larvarias)."
      },
      {
        question: "7.- Dentro del ciclo de vida de Thaumetopoea pityocampa, ¿qué fase de su vida nos podemos encontrar durante los meses de invierno en Andalucía?",
        options: [
          "a) El imago o adulto",
          "b) Se encuentra dentro del huevo",
          "c) La fase larvaria",
          "d) Únicamente se encontrarán dentro del capullo en forma de crisálida"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: La fase larvaria)."
      },
      {
        question: "8.- ¿Cuál de las siguientes especies es más susceptible de ser atacada por Thaumetopoea pityocampa?",
        options: [
          "a) Pinus sylvestris",
          "b) Pinus pinea",
          "c) Pinus halepensis",
          "d) Esta especie ataca indiferentemente a las 3 especies descritas anteriormente"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: Pinus sylvestris)."
      },
      {
        question: "9.- Si sobre una acícula de un árbol del género Pinus nos encontramos una larva de Acantolyda hieroglyfica sabemos que este insecto es un:",
        options: [
          "a) Lepidóptero",
          "b) Himenóptero",
          "c) Coleóptero",
          "d) Homóptero"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Himenóptero)."
      },
      {
        question: "10.- Pissodes notatus (Pissodes castaneus) es un insecto:",
        options: [
          "a) Perforador de coníferas",
          "b) Defoliador de coníferas",
          "c) Defoliador de quercíneas",
          "d) Este insecto es muy polífago y ataca a cualquier tipo de árbol causando diversos daños tanto en su superficie foliar como en el floema."
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: Perforador de coníferas)."
      },
      {
        question: "11.- Si levantamos la corteza de un ejemplar de Pinus y encontramos una serie de galerías provocadas por las larvas de un insecto perforador, ¿Cuál de los siguientes insectos podría ser el causante?",
        options: [
          "a) Diprion pini",
          "b) Tomicus destruens",
          "c) Lymantria dispar",
          "d) Cualquiera de ellos podría ser el causante"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Tomicus destruens)."
      },
      {
        question: "12.- ¿Cuál de las siguientes especies se trata de un lepidóptero perforador de frutos de coníferas?",
        options: [
          "a) Pissodes validirostris",
          "b) Dioryctria mendacella",
          "c) Thaumetopoea pityocampa",
          "d) Ninguno de los anteriores"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Dioryctria mendacella)."
      },
      {
        question: "13.- ¿Cuál es la principal especie causante de defoliaciones en especies del género Quercus, principalmente encina y alcornoque?",
        options: [
          "a) Thaumetopoea pityocampa",
          "b) Cerambix cerdo",
          "c) Lymantria dispar",
          "d) Ophiostoma ulmi"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Lymantria dispar)."
      },
      {
        question: "14.- ¿Cuál de las siguientes especies es un coleóptero defoliador de chopos y sauces?",
        options: [
          "a) Melasoma populi",
          "b) Ips sexdentatus",
          "c) Phorocante semipunctata",
          "d) Monochamus galloprovincialis"
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A: Melasoma populi)."
      },
      {
        question: "15.- ¿Cuál de las siguientes especies es la causante de defoliaciones en olmos que conducen al debilitamiento de estos y por lo tanto a ser atacados por coleópteros perforadores?",
        options: [
          "a) Thaumetopoea pityocampa",
          "b) Melasoma populi",
          "c) Coraebus undatus",
          "d) Galerucella luteola"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Galerucella luteola)."
      },
      {
        question: "16.- ¿Cuál de las siguientes especies es un coleóptero perforador de encinas y uno de los implicados en mortandad de estos árboles en la conocida como seca de los Quercus?",
        options: [
          "a) Scolytus multistriatus",
          "b) Phorocanta semipunctata",
          "c) Cerambix cerdo",
          "d) Ips acuminatus"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Cerambix cerdo)."
      },
      {
        question: "17.- ¿Cuál de los siguientes coleópteros es el causante de ataques a la capa madre del corcho de los alcornoques y por lo tanto causante de pérdidas de producción corchera?",
        options: [
          "a) Coraebus florentinus",
          "b) Coraebus undatus",
          "c) Cerambix cerdo",
          "d) Saperda populnea"
        ],
        correct: 1,
        justification: "Conforme a la plantilla de respuestas oficial (Opción B: Coraebus undatus)."
      },
      {
        question: "18.- Si observamos ramas muertas en un olmo y al desprender la corteza se observa una galería más gruesa de la que parten radialmente multitud de galerías de menor diámetro que se van ensanchando a medida que se alejan de la galería principal, ¿Cuál podría ser el causante de dicho ataque?",
        options: [
          "a) Ophiostoma ulmi",
          "b) Pissodes notatus",
          "c) Scolytus scolytus",
          "d) Galerucella ulmi"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Scolytus scolytus)."
      },
      {
        question: "19.- Señale la opción correcta en relación con la influencia del clima sobre el ciclo biológico de la procesionaria del pino según lo establecido en el plan de lucha integrada Contra la Procesionaria del Pino (Traumatocampa pityocampa) (=Thaumetopoea pityocampa) en la Comunidad Autónoma de Andalucía:",
        options: [
          "a) Si las temperaturas en el interior del nido sobrepasan los 30ºC las orugas abandonan rápidamente las colonias y se dispersan perdiendo su comportamiento gregario.",
          "b) Una oruga aislada soporta hasta -7º C. Si las temperaturas descienden por debajo de los -12ºC, pueden morir las colonias enteras.",
          "c) Por debajo de los 20º C, entre 10 y 20ºC en el nido, las orugas salen a comer cada noche, tejen el bolsón, pero no avanza en su desarrollo.",
          "d) Todas las respuestas son correctas"
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas las respuestas son correctas)."
      },
      {
        question: "20.- ¿Cuántos grados o niveles de infestación se distinguen en el plan de lucha integrada Contra la Procesionaria del Pino (Traumatocampa pityocampa) (=Thaumetopoea pityocampa) en la Comunidad Autónoma de Andalucía?",
        options: [
          "a) 4",
          "b) 5",
          "c) 6",
          "d) 10"
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: 6)."
      },
      {
        question: "21.- ¿Cuál de los siguientes será un método de control contra la procesionaria del pino, a tenor de lo establecido en el plan de lucha integrada Contra la Procesionaria del Pino (Traumatocampa pityocampa) (=Thaumetopoea pityocampa) en la Comunidad Autónoma de Andalucía?",
        options: [
          "a) Protección y mejora de los organismos beneficiosos importantes.",
          "b) Gestión del pinar.",
          "c) Tratamiento preventivo mediante la colocación de cajas anidaderas.",
          "d) Todas las respuestas son correctas."
        ],
        correct: 3,
        justification: "Conforme a la plantilla de respuestas oficial (Opción D: Todas las respuestas son correctas)."
      },
      {
        question: "22.- Si tras la evaluación de un pinar se determina que el grado de ataque es 2, ¿cuál de los siguientes métodos de control se utilizaría según lo establecido en el plan de lucha integrada Contra la Procesionaria del Pino (Traumatocampa pityocampa) (=Thaumetopoea pityocampa) en la Comunidad Autónoma de Andalucía?",
        options: [
          "a) Colocación intensiva de trampas de feromona",
          "b) Tratamiento preventivo mediante la colocación de cajas anidaderas",
          "c) Tratamiento terrestre a ultra bajo volumen",
          "d) A partir del nivel 2 se aconseja la no intervención para no perturbar el complejo parasitario-depredador."
        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Tratamiento terrestre a ultra bajo volumen)."
      },
      {
        question: "23.- Señale la respuesta correcta en cuanto al seguimiento de las poblaciones de lagarta peluda establecido en el Plan de Lucha Integrada Contra la Lagarta Peluda (Lymantria dispar) en la Comunidad Autónoma de Andalucía",
        options: [
          "a) El seguimiento del nivel de población se realizará utilizando dos tipos de datos procedentes de 2 tipos de fichas: una para la red de control de capturas y otra para la detección de puestas en el rodal.",

          "d) Todas las respuestas son correctas."
        ],
        correct: 0,
        justification: "Conforme a la plantilla de respuestas oficial (Opción A)."

      {
        question: "24.- ¿Cuántos grados o niveles de infestación se distinguen en el Plan de Lucha Integrada Contra la Lagarta Peluda (Lymantria dispar) en la Comunidad Autónoma de Andalucía?",

          "d) Las respuestas a) y b) son correctas"

        question: "25.- ¿En qué grado de infestación se encontrará una masa de Quercus atacada por la lagarta peluda si observamos que se está realizando un tratamiento aéreo a ultra bajo volumen, a tenor de lo descrito en el Plan de Lucha Integrada Contra la Lagarta Peluda (Lymantria dispar) en la Comunidad Autónoma de Andalucía?",

          "b) Grado 1",

          "c) Septoria unedonis",

        ],
        correct: 2,
        justification: "Conforme a la plantilla de respuestas oficial (Opción C: Septoria unedonis)."

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = `¡Correcto! ${q.justification}`;
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(97 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}). Justificación: ${q.justification}`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const finalScore = activeData.length > 0 ? ((correctCount / activeData.length) * 10).toFixed(2) : "0.00";
      document.getElementById('score').textContent = `⭐ ${finalScore}/10`;
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
