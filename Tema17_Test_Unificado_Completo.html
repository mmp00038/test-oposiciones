<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Interactivo Multibloque - Tema 17</title>
  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 100px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 85px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Container */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
    }

    /* Question Cards */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Reset Area */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 100px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 110px;
      }
    }
    /* Botón orgánico inspirado en la naturaleza */
    .box, .btn-volver {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      
      /* Colores */
      background-color: #2e7d32; /* Verde bosque principal */
      color: #ffffff !important;   /* Texto blanco */
      
      /* Formas y bordes */
      padding: 0.6rem 1.25rem;
      border-radius: 0.75rem;     /* Esquinas suavemente redondeadas */
      border: 1px solid #1b5e20;
      
      /* Tipografía y formato */
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none !important; /* Elimina el subrayado azul */
      
      /* Sombras y transiciones */
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    
    /* Estado al pasar el cursor o pulsar en la tablet */
    .box:hover, .box:active,
    .btn-volver:hover, .btn-volver:active {
      background-color: #1b5e20; /* Verde más profundo */
      color: #ffffff !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(46, 125, 50, 0.25);
    }
  </style>
</head>
<body>

  <header>
    <div class="box">
        <a href="index.html" class="btn-volver">← Volver</a>
    </div>
    <div class="selector-box">
      <select id="block-select" onchange="changeBlock()">
        <option value="all">Ver todo el tema unificado</option>
        <option value="b1">Bloque 1: Test 17-1</option>
        <option value="b2">Bloque 2: Test 17-2</option>
        <option value="b3">Bloque 3: Test 17-3</option>
      </select>
    </div>
    <div class="stat-box">
      <span class="stat-label">Tiempo</span>
      <span class="stat-value" id="timer">⏱️ 00:00</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Contestadas</span>
      <span class="stat-value" id="progress">📝 0/0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Aciertos</span>
      <span class="stat-value" id="accuracy">🎯 0%</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Nota</span>
      <span class="stat-value" id="score">⭐ 0.00/10</span>
    </div>
  </header>

  <div class="container">
    <h1 class="test-title" id="test-title">TEMA 17: RENPA, RED NATURA 2000 Y USO PÚBLICO</h1>
    <div id="quiz-container"></div>
    <div class="reset-container">
      <button class="reset-btn" onclick="resetQuiz()">Reiniciar Test</button>
    </div>
  </div>

  <script>
    const b1Data = [
      {
        id: "1-1",
        question: "1. Según el artículo 2 del Decreto 95/2003, de 8 de abril, por el que se regula la Red de Espacios Naturales Protegidos de Andalucía y su Registro, ¿cuál de los siguientes NO constituye un objetivo de la RENPA?",
        options: [
          "a) La coordinación de los sistemas generales de gestión de los espacios naturales protegidos.",
          "b) La promoción externa de los espacios naturales protegidos de forma homogénea y conjunta.",
          "c) La colaboración en programas estatales e internacionales de conservación de espacios naturales y de la vida silvestre.",
          "d) La unificación de los instrumentos de planificación de todos los espacios naturales protegidos mediante la aprobación de un único plan de gestión para toda la Red."
        ],
        correct: 3
      },
      {
        id: "1-2",
        question: "2. De acuerdo con los principios de la Carta Europea de Turismo Sostenible, señale la respuesta INCORRECTA:",
        options: [
          "a) Proteger y promocionar el patrimonio natural y cultural del territorio, evitando un desarrollo turístico excesivo que ponga en peligro su conservación.",
          "b) Garantizar la mejora de la actividad turística sin que por ello se reduzca la calidad de vida de la población local.",
          "c) Aumentar los beneficios del turismo para la economía local y controlar los flujos de visitantes para reducir los impactos negativos que pudieran generar.",
          "d) Favorecer el incremento de visitantes como instrumento prioritario de desarrollo económico, siempre que posteriormente se adopten medidas para corregir los impactos ambientales generados."
        ],
        correct: 3
      },
      {
        id: "1-3",
        question: "3. ¿Cuál de las siguientes secuencias reproduce CORRECTAMENTE las fases del Programa de Fomento del Voluntariado en Espacios Naturales Protegidos de Andalucía?",
        options: [
          "a) Diagnóstico participativo → Elaboración del programa → Inventario de entidades y proyectos → Ejecución → Evaluación.",
          "b) Inventario de entidades y proyectos → Diagnóstico participativo → Elaboración del programa → Evaluación → Ejecución.",
          "c) Diagnóstico participativo → Inventario de entidades y proyectos → Elaboración del programa → Ejecución → Evaluación.",
          "d) Diagnóstico participativo → Inventario de entidades y proyectos → Ejecución → Elaboración del programa → Evaluación."
        ],
        correct: 2
      },
      {
        id: "1-4",
        question: "4. De acuerdo con el artículo 46.4 de la Ley 42/2007, de 13 de diciembre, un plan, programa o proyecto que no tenga relación directa con la gestión de un espacio Red Natura 2000 ni sea necesario para ella deberá someterse a una adecuada evaluación de sus repercusiones cuando:",
        options: [
          "a) Pueda afectar de forma apreciable a las especies o hábitats del espacio, exclusivamente cuando dicha afección derive individualmente del propio proyecto.",
          "b) Pueda afectar de forma apreciable al espacio, individualmente o en combinación con otros planes, programas o proyectos, teniendo en cuenta los objetivos de conservación del mismo.",
          "c) Pueda producir cualquier tipo de afección, aunque esta sea irrelevante respecto de los objetivos de conservación del espacio.",
          "d) Afecte necesariamente de forma directa a un hábitat o especie prioritaria incluida en los anexos I o II."
        ],
        correct: 1
      },
      {
        id: "1-5",
        question: "5. Conforme al Manual de Señalización de Uso Público, respecto de las señales de IDENTIFICACIÓN Y RECOMENDACIONES, señale la respuesta CORRECTA:",
        options: [
          "a) Constituyen un complemento obligatorio de la señal de identificación y ambas deberán coexistir en el acceso principal.",
          "b) Se utilizarán únicamente cuando no exista ninguna construcción asociada a la instalación.",
          "c) Pueden servir, entre otras funciones, para reconocer un espacio natural o instalación y conocer sus recomendaciones, describir normas generales de uso o identificar componentes funcionales de determinadas instalaciones.",
          "d) Solo pueden incorporar la denominación y el nombre propio de la instalación, quedando excluidos croquis, pictogramas y recomendaciones de uso."
        ],
        correct: 2
      },
      {
        id: "1-6",
        question: "6. Según el Portal Ambiental de Andalucía, el programa RECAPACICLA:",
        options: [
          "a) Está dirigido exclusivamente a la comunidad educativa y tiene como finalidad principal reducir los residuos generados en los centros escolares.",
          "b) Se integra en los programas de educación para la sostenibilidad en materia de residuos y economía circular y aborda, entre otros aspectos, prevención y reducción de residuos, recogida selectiva y reciclaje.",
          "c) Es un programa dirigido principalmente a entidades locales para la implantación de puntos limpios municipales.",
          "d) Se centra en la reutilización de residuos, sin incluir contenidos relacionados con su prevención, recogida selectiva o tratamiento."
        ],
        correct: 1
      },
      {
        id: "1-7",
        question: "7. De acuerdo con el artículo 57.1 del Estatuto de Autonomía para Andalucía, en relación con los espacios naturales protegidos, señale la respuesta CORRECTA:",
        options: [
          "a) La Comunidad Autónoma ostenta competencia compartida para la delimitación y regulación de los espacios naturales protegidos, correspondiendo en todo caso su gestión integral al Estado.",
          "b) La Comunidad Autónoma tiene competencia exclusiva para la gestión de los espacios naturales protegidos terrestres, pero no respecto de aquellos que afecten a aguas marítimas de su jurisdicción.",
          "c) La Comunidad Autónoma tiene competencia exclusiva en la delimitación, regulación, ordenación y gestión integral de los espacios naturales protegidos, incluyendo los que afecten a las aguas marítimas de su jurisdicción.",
          "d) La competencia autonómica comprende la gestión de los espacios protegidos, pero no la declaración de nuevas figuras de protección."
        ],
        correct: 2
      },
      {
        id: "1-8",
        question: "8. Conforme al artículo 23 del Decreto 20/2002 considere las siguientes afirmaciones relativas a los requisitos exigibles a las empresas que organicen actividades de turismo activo en Andalucía:\nI. Deben disponer de un seguro de responsabilidad profesional en permanente vigencia, adecuado a la naturaleza y alcance del riesgo de las actividades que desarrollen.\nII. Dicho seguro tendrá una cobertura mínima de 600.000 euros por siniestro e incluirá, al menos, rescate, traslado y asistencia derivados de accidente.\nIII. Toda empresa de turismo activo deberá disponer necesariamente de autorización de la Consejería competente en materia de medio ambiente, cualquiera que sea la actividad y el lugar en que se desarrolle.\nIV. Deben contar con personal cualificado para el desarrollo de cada actividad.\nSeñale la respuesta CORRECTA:",
        options: [
          "a) I, II y IV.",
          "b) I, III y IV.",
          "c) II, III y IV.",
          "d) Todas son correctas."
        ],
        correct: 0
      },
      {
        id: "1-9",
        question: "9. Según la información recogida en el Portal Ambiental de la Junta de Andalucía, los equipamientos de uso público de los espacios naturales protegidos cuentan con dos elementos imprescindibles. Señale la respuesta CORRECTA:",
        options: [
          "a) Un espacio físico dotado necesariamente de infraestructuras permanentes y un programa de educación ambiental.",
          "b) Un espacio físico con las infraestructuras y recursos humanos y/o materiales necesarios, y un proyecto de comunicación, información, interpretación o educación ambiental, implícito o explícito.",
          "c) Una instalación fija destinada a los visitantes y un servicio prestado necesariamente por personal especializado.",
          "d) Una infraestructura de titularidad pública y un proyecto de interpretación ambiental aprobado por la Consejería competente."
        ],
        correct: 1
      },
      {
        id: "1-10",
        question: "10. Según el artículo 42 de la Ley 42/2007, de 13 de diciembre, la Red Ecológica Europea Natura 2000 está compuesta por:",
        options: [
          "a) Las Zonas Especiales de Conservación y las Zonas de Especial Protección para las Aves.",
          "b) Los Lugares de Importancia Comunitaria hasta su transformación en ZEC, las ZEC y las ZEPA.",
          "c) Los LIC, las ZEC, las ZEPA y cualquier espacio natural protegido declarado por las comunidades autónomas.",
          "d) Los LIC y las ZEPA, perdiendo los primeros su condición de espacio Red Natura 2000 una vez transformados en ZEC."
        ],
        correct: 1
      },
      {
        id: "1-11",
        question: "11. De acuerdo a la información recogida en el Portal Ambiental de la Junta de Andalucía, valore las siguientes afirmaciones relativas al ejercicio de la acción voluntaria:\nI. Debe desarrollarse dentro de una entidad de voluntariado.\nII. Debe desarrollarse en el marco de un programa organizado y contar con formación, dirección técnica, medios y cobertura aseguradora.\nIII. Una actuación espontánea puede calificarse como acción voluntaria siempre que se realice de forma libre, altruista y sin contraprestación económica.\nIV. La acción voluntaria no debe confundirse con los trabajos profesionales remunerados.\nSeñale la respuesta CORRECTA:",
        options: [
          "a) I y II.",
          "b) I, II y III.",
          "c) I, II y IV.",
          "d) II, III y IV."
        ],
        correct: 2
      },
      {
        id: "1-12",
        question: "12. Conforme a los artículos 12 y 14 de la Orden de 20 de marzo de 2003, señale la afirmación CORRECTA:",
        options: [
          "a) El período solicitado para desarrollar una actividad podrá alcanzar hasta tres años, aunque la autorización nunca podrá concederse por más de dos.",
          "b) El plazo máximo para resolver la autorización será de tres meses y la falta de resolución expresa tendrá efectos desestimatorios.",
          "c) El período indicado en la solicitud no podrá ser superior a dos años y, salvo petición en contrario, cuando se pretenda realizar actividades durante un período de tiempo, el plazo de validez será de dos años, renovable siempre que no existan informes de los agentes de medio ambiente sobre incumplimientos.",
          "d) Toda autorización concedida tendrá necesariamente una vigencia de dos años."
        ],
        correct: 2
      },
      {
        id: "1-13",
        question: "13. De acuerdo con el artículo 104 del Decreto 208/1997, de 9 de septiembre, señale la respuesta INCORRECTA:",
        options: [
          "a) La circulación de vehículos a motor fuera de las vías expresamente previstas para ellos puede admitirse cuando resulte imprescindible para la guardería forestal.",
          "b) Las pruebas deportivas fuera de circuitos expresamente previstos podrán realizarse si cuentan con autorización expresa para cada caso concreto, sin perjuicio de otras autorizaciones exigibles.",
          "c) La Consejería competente podrá establecer limitaciones o prohibiciones sobre actividades o usos públicos cuando exista riesgo de deterioro de los recursos, terrenos forestales, medio natural o ecosistemas.",
          "d) La velocidad máxima establecida en el Decreto, en pistas y caminos de montes públicos constituye un límite absoluto que no puede modificarse mediante señalización expresa."
        ],
        correct: 3
      },
      {
        id: "1-14",
        question: "14. Conforme al artículo 48 de la Ley 42/2007, sobre vigilancia y seguimiento de la Red Natura 2000, señale la respuesta CORRECTA:",
        options: [
          "a) El seguimiento del estado de conservación corresponde exclusivamente a las comunidades autónomas.",
          "b) La Administración General del Estado y las comunidades autónomas vigilarán, en el ámbito de sus respectivas competencias, el estado de conservación de los hábitats y especies de interés comunitario.",
          "c) Las comunidades autónomas remitirán directamente a la Comisión Europea los informes nacionales exigidos por las Directivas.",
          "d) El seguimiento deberá centrarse únicamente en los hábitats naturales prioritarios, quedando excluidas las especies de aves."
        ],
        correct: 1
      },
      {
        id: "1-15",
        question: "15. Según la clasificación funcional recogida en el Portal Ambiental de la Junta de Andalucía, considere las siguientes afirmaciones:\nI. El centro de visitantes y el punto de información son equipamientos de interpretación.\nII. El mirador, el observatorio y el sendero señalizado se incluyen entre los equipamientos de información.\nSeñale la respuesta CORRECTA:",
        options: [
          "a) Únicamente la afirmación I es correcta.",
          "b) Únicamente la afirmación II es correcta.",
          "c) Ambas afirmaciones son correctas.",
          "d) Ambas afirmaciones son incorrectas."
        ],
        correct: 3
      },
      {
        id: "1-16",
        question: "16. Según la Estrategia de Acción para la Gestión del Uso Público en la RENPA, respecto de los Programas de Uso Público de los espacios naturales protegidos, señale la respuesta CORRECTA:",
        options: [
          "a) Únicamente los Parques Naturales con especial vocación para el uso público deberán contar con un Programa de Uso Público.",
          "b) Todos los espacios naturales protegidos de Andalucía deberán disponer obligatoriamente de un Programa de Uso Público individual.",
          "c) Todos los Parques Naturales tendrán un Programa de Uso Público, pudiendo disponer también de él otros espacios protegidos cuando se decida por su especial vocación para el uso público o por la complejidad de su gestión.",
          "d) Los Programas de Uso Público únicamente podrán elaborarse de manera conjunta para espacios pertenecientes a una misma provincia."
        ],
        correct: 2
      },
      {
        id: "1-17",
        question: "17. Según el Portal Ambiental de Andalucía, en relación con la Red de Ciudades Verdes y Sostenibles de Andalucía (Red REVERSA), señale la respuesta CORRECTA:",
        options: [
          "a) Está dirigida fundamentalmente a pequeñas y medianas empresas para asesorarlas en su transición hacia modelos ambientalmente sostenibles.",
          "b) Es una red dirigida a municipios y entidades locales que funciona como foro de cooperación, intercambio de experiencias y difusión de buenas prácticas ambientales.",
          "c) Se dirige exclusivamente a municipios incluidos total o parcialmente en espacios naturales protegidos.",
          "d) Su finalidad principal es financiar proyectos locales relacionados con la economía circular y la transición energética."
        ],
        correct: 1
      },
      {
        id: "1-18",
        question: "18. De acuerdo con el artículo 9 de la Orden de 20 de marzo de 2003, una actividad de turismo activo desarrollada en un espacio natural protegido que, además, tenga la consideración de terreno forestal deberá cumplir:",
        options: [
          "a) Únicamente las condiciones establecidas en el Anexo 3.",
          "b) Las condiciones de los Anexos 1 y 3, pero no las del Anexo 2.",
          "c) Las condiciones establecidas en los Anexos 1, 2 y 3.",
          "d) Únicamente las condiciones de los Anexos 2 y 3, puesto que el Anexo 1 se aplica exclusivamente fuera de terrenos forestales y espacios naturales protegidos."
        ],
        correct: 2
      },
      {
        id: "1-19",
        question: "19. Teniendo en cuenta conjuntamente las definiciones y la clasificación funcional de los equipamientos recogidas en el Portal Ambiental de la Junta de Andalucía, señale la respuesta INCORRECTA:",
        options: [
          "a) Un sendero señalizado puede discurrir por caminos tradicionales y estar habilitado fundamentalmente para la marcha a pie, aunque también pueda utilizarse en determinados casos en bicicleta o a caballo.",
          "b) Un área recreativa presta apoyo principalmente a actividades de esparcimiento al aire libre, especialmente comidas en contacto con la naturaleza, y su utilización se vincula a una duración inferior a una jornada.",
          "c) El refugio y el refugio-vivac se incluyen entre los equipamientos de alojamiento, diferenciándose, entre otros aspectos, en que el segundo está concebido para una estancia breve y/o pernocta durante una noche y no necesariamente ha de estar cerrado.",
          "d) La zona de acampada controlada se diferencia del refugio-vivac en que aquella permite la instalación de tiendas de campaña por períodos prolongados, mientras que este último está destinado necesariamente a una estancia inferior a una jornada."
        ],
        correct: 3
      },
      {
        id: "1-20",
        question: "20. Según la Estrategia de Acción para la Gestión del Uso Público en la RENPA, aprobada mediante Resolución de 19 de noviembre de 2003, señale cuál de las siguientes afirmaciones constituye uno de sus fines:",
        options: [

    let activeData = [];
    let answeredCount = 0;
    let correctCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function changeBlock() {
      const selected = document.getElementById('block-select').value;
      if (selected === 'all') {
        activeData = [...b1Data, ...b2Data, ...b3Data];
        document.getElementById('test-title').textContent = "TEMA 17 UNIFICADO: RENPA, RED NATURA 2000 Y USO PÚBLICO (105 PREGUNTAS)";
      } else if (selected === 'b1') {
        activeData = [...b1Data];
        document.getElementById('test-title').textContent = "BLOQUE 1: TEST 18-1 (32 PREGUNTAS)";
      } else if (selected === 'b2') {
        activeData = [...b2Data];
        document.getElementById('test-title').textContent = "BLOQUE 2: TEST 18-2 (33 PREGUNTAS)";
      } else if (selected === 'b3') {
        activeData = [...b3Data];
        document.getElementById('test-title').textContent = "BLOQUE 3: TEST 18-3 (40 PREGUNTAS)";
      }
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = "¡Correcto!";
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(97 + q.correct);
        feedback.textContent = `Incorrecto. La opción correcta era la ${correctLetter}).`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const finalScore = answeredCount > 0 ? ((correctCount / activeData.length) * 10).toFixed(2) : "0.00";
      document.getElementById('score').textContent = `⭐ ${finalScore}/10`;
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar por defecto en Unificado
    changeBlock();
  </script>
