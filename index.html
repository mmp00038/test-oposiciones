<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Enlace al Manifest de PWA -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Configuración de pantalla y color de la barra del sistema -->
  <meta name="theme-color" content="#2e7d32">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OpoTests">
  <!-- Fin Enlace al Manifest de PWA -->
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tests de Oposiciones</title>
  <style>
    :root {
      --primary-color: #2e7d32;
      --primary-hover: #1b5e20;
      --bg-color: #f4f6f0;
      --card-bg: #ffffff;
      --text-main: #1c2a1e;
      --text-muted: #52634f;
      --border-color: #dcdfd8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      margin-bottom: 3rem;
      text-align: center;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--primary-hover);
      letter-spacing: -0.025em;
    }

    .subtitle {
      margin-top: 0.5rem;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .main-sections-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      width: 100%;
      max-width: 800px;
    }

    .section-card {
      background-color: var(--card-bg);
      border-radius: 1.5rem;
      padding: 3rem 1.5rem;
      text-decoration: none;
      color: var(--text-main);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
      border: 2px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      transition: all 0.25s ease-in-out;
      -webkit-tap-highlight-color: transparent;
    }

    .section-card:hover, .section-card:active {
      transform: translateY(-6px);
      box-shadow: 0 12px 24px rgba(46, 125, 50, 0.18);
      border-color: var(--primary-color);
    }

    .section-icon {
      font-size: 3.5rem;
      line-height: 1;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-hover);
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Tests de Oposiciones</h1>
    <p class="subtitle">Selecciona una sección para acceder a sus temas</p>
  </header>

  <main class="main-sections-grid">
    <a href="comun.html" class="section-card">
      <div class="section-icon">📚</div>
      <div class="section-title">Parte Común</div>
    </a>

    <a href="especifica.html" class="section-card">
      <div class="section-icon">🌲</div>
      <div class="section-title">Parte Específica</div>
    </a>
  </main>

</body>
</html>
