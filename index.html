<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tests de Oposiciones</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      margin-bottom: 2.5rem;
      text-align: center;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.025em;
    }

    .subtitle {
      margin-top: 0.5rem;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 900px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 1rem;
      padding: 1.75rem 1.5rem;
      text-decoration: none;
      color: var(--text-main);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease-in-out;
      -webkit-tap-highlight-color: transparent;
    }

    .card:hover, .card:active {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.1), 0 4px 6px -4px rgba(37, 99, 235, 0.1);
      border-color: var(--primary-color);
    }

    .card-icon {
      width: 48px;
      height: 48px;
      background-color: #eff6ff;
      color: var(--primary-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      font-size: 1.25rem;
      font-weight: bold;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .card:hover .card-title {
      color: var(--primary-color);
    }
  </style>
</head>
<body>

  <header>
    <h1>Tests de Oposiciones</h1>
    <p class="subtitle">Selecciona un tema para comenzar la práctica</p>
  </header>

  <main class="grid-container">
    <a href="Tema14_Test_Unificado_Completo.html" class="card">
      <div class="card-icon">14</div>
      <span class="card-title">Tema 14</span>
    </a>

    <a href="Tema17_Test_Unificado_Completo.html" class="card">
      <div class="card-icon">17</div>
      <span class="card-title">Tema 17</span>
    </a>

    <a href="Tema18_Test_Unificado_Bloques.html" class="card">
      <div class="card-icon">18</div>
      <span class="card-title">Tema 18</span>
    </a>
  </main>

</body>
</html>
