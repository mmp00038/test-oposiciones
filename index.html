<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tests de Oposiciones</title>
  <style>
    :root {
      --primary-color: #2e7d32;      /* Verde bosque principal */
      --primary-hover: #1b5e20;      /* Verde bosque oscuro */
      --bg-color: #f4f6f0;           /* Fondo suave naturaleza */
      --text-main: #1c2a1e;          /* Verde muy oscuro casi negro */
      --text-muted: #52634f;         /* Tono verde hoja seco */
      --accent-bg: #e8f5e9;          /* Verde claro suave para botones */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      margin-bottom: 3rem;
      text-align: center;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--primary-hover);
      letter-spacing: -0.025em;
    }

    .subtitle {
      margin-top: 0.5rem;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .grid-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      width: 100%;
      max-width: 900px;
    }

    .card {
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem;
      border-radius: 9999px;
      transition: all 0.2s ease-in-out;
      -webkit-tap-highlight-color: transparent;
    }

    .card:hover, .card:active {
      transform: translateY(-3px) scale(1.03);
    }

    .card-icon {
      width: 75px;
      height: 75px;
      background-color: var(--accent-bg);
      color: var(--primary-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      border: 1px solid #dcdfd8;
      transition: all 0.2s ease-in-out;
    }

    .card:hover .card-icon {
      background-color: var(--primary-color);
      color: #ffffff;
      box-shadow: 0 8px 18px rgba(46, 125, 50, 0.25);
    }

    .nature-emoji {
      font-size: 2rem;
      line-height: 1;
      user-select: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Tests de Oposiciones</h1>
    <p class="subtitle">Selecciona un tema para comenzar la práctica</p>
  </header>

  <main class="grid-container">
    <!-- Solo necesitas añadir las etiquetas <a> sin preocuparte por el emoji -->
    <a href="Tema14_Test_Unificado_Completo.html" class="card">
      <div class="card-icon">14</div>
      <span class="nature-emoji"></span>
    </a>

    <a href="Tema17_Test_Unificado_Completo.html" class="card">
      <div class="card-icon">17</div>
      <span class="nature-emoji"></span>
    </a>

    <a href="Tema18_Test_Unificado_Bloques.html" class="card">
      <div class="card-icon">18</div>
      <span class="nature-emoji"></span>
    </a>
  </main>

  <script>
    // Colección de emojis inspirados en la naturaleza
    const natureEmojis = ['🌿', '🌳', '🌻', '🌱', '🌲', '🍃', '🌴', '🌵', '🌾', '🪻', '🌷', '🍁', '🪵', '🍄', '🐝', '🦋', '🦉', '🦊', '🐿️', '⛰️'];

    // Asignación aleatoria al cargar la página
    document.querySelectorAll('.nature-emoji').forEach(span => {
      const randomEmoji = natureEmojis[Math.floor(Math.random() * natureEmojis.length)];
      span.textContent = randomEmoji;
    });
  </script>

</body>
</html>
