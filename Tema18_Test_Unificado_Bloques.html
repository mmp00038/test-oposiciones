  <style>
    :root {
      --primary: #1b5e20;

      --error: #c62828;

      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 100px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 85px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Container */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
    }

    /* Question Cards */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Reset Area */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 100px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 110px;
      }
    }

          "correct": 1
        },
        {

          "options": ["a) empleados o potencialmente empleables en el sistema económico y social humano, siendo capaces de generar un flujo de bienes y servicios útiles o renta natural a lo largo del tiempo, ya sea de forma directa o indirecta", "b) que son cuantificables económicamente porque proporcionan al sistema recursos naturales utilizables de forma directa o indirecta por nuestra sociedad", "c) que proporcionan riqueza a las poblaciones rurales en términos económicos y ambientales", "d) Ninguna de las anteriores es correcta"],
          "correct": 0
        },
        {
          "question": "28. Indique cuál de los siguientes NO es uno de los principios inspiradores de la EAGIB:",
          "options": ["a) Principio de sostenibilidad energética", "b) Uso sostenible", "c) Conservación dentro y fuera de los EENNPP", "d) Principio de prevención y precaución"],
          "correct": 0
        },
        {
          "question": "29. La EAGIB ha establecido ____ objetivos generales, que se desarrollan mediante _______ :",
          "options": ["a) 10 / Actuaciones y objetivos específicos", "b) 8 / Directrices y medidas", "c) 10 / Líneas de actuación", "d) 8 / Líneas estratégicas"],
          "correct": 3
        },
        {
          "question": "30. El objetivo principal de la EAGIB es frenar la pérdida de la biodiversidad en Andalucía y …",
          "options": ["a) Desarrollar un marco instrumental para su gestión", "b) Restaurar el medio natural", "c) Luchar contra el cambio climático", "d) Recuperar el adecuado funcionamiento de sus ecosistemas"],
          "correct": 3
        },
        {
          "question": "31. ¿ Qué periodo de vigencia inicial se estableció para la EAGIB?",
          "options": ["a) Hasta 2025", "b) Hasta 2020, con una proyección de acciones a largo plazo hasta 2050", "c) Hasta 2030", "d) Hasta 2015, con una posible extensión gasta 2030"],
          "correct": 1
        },
        {

          "options": ["a) Se debe reducir su entrada en al menos un 20%", "b) La eliminación solo aplicará a áreas urbanas y costeras", "c) No debe haber ninguna nueva entrada de plásticos en el medio", "d) A y B son correctas"],

        {

        },
        {

          "correct": 2
        },
        {

          "options": ["a) Copenhague", "b) Bruselas", "c) Ginebra", "d) París"],
          "correct": 0
        },
        {

          "options": ["a) Cada 5 años, para evaluar el impacto de la Estrategia en las políticas de biodiversidad", "b) Cada 2 años, para analizar los logros, dificultades y necesidades de ajuste de la estrategia", "c) Anualmente, para analizar el grado de implementación de la estrategia", "d) Cada 3 años, para evaluar el reajuste del presupuesto económico"],
          "correct": 1
        },
        {
          "question": "40. ¿Cuál es el criterio principal para designar un sitio como Ramsar, según lo establecido en la Convención de Ramsar sobre los Humedales de Importancia Internacional?",
          "options": ["a) Extensión mínima de 100 ha y permanencia a lo largo del año", "b) Importancia internacional para las aves acuáticas en cualquier estación del año", "c) Ubicación en zonas protegidas por convenios internacionales", "d) Nivel de biodiversidad general, independientemente de la especie predominante"],
          "correct": 1
        }
      ]
    };

    // Crear el bloque unificado completo "all" (110 preguntas)
    quizBlocks["all"] = [...quizBlocks["t18_1"], ...quizBlocks["t18_2"], ...quizBlocks["t18_3"]];

    let activeData = [];
    let answeredCount = 0;
    let correctCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function changeBlock() {
      const selected = document.getElementById('block-select').value;
      activeData = quizBlocks[selected] || quizBlocks["all"];

      if (selected === 'all') {
        document.getElementById('test-title').textContent = "TEMA 18 UNIFICADO: CONVENIOS INTERNACIONALES (110 PREGUNTAS)";
      } else if (selected === 't18_1') {
        document.getElementById('test-title').textContent = "BLOQUE 1: TEST 18-1 (40 PREGUNTAS)";
      } else if (selected === 't18_2') {
        document.getElementById('test-title').textContent = "BLOQUE 2: TEST 18-2 (30 PREGUNTAS)";
      } else if (selected === 't18_3') {
        document.getElementById('test-title').textContent = "BLOQUE 3: TEST 18-3 (40 PREGUNTAS)";
      }
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = "¡Correcto!";
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(97 + q.correct);
        feedback.textContent = `Incorrecto. La opción correcta era la ${correctLetter}).`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const finalScore = activeData.length > 0 ? ((correctCount / activeData.length) * 10).toFixed(2) : "0.00";
      document.getElementById('score').textContent = `⭐ ${finalScore}/10`;
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicialización automática
    changeBlock();
  </script>
