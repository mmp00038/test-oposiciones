<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Interactivo - Temas IV, V y Bloque Constitucional</title>
  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --success: #2e7d32;
      --error: #c62828;
      --background: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Sticky Header Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;
      margin-top: 30px;
    }

    .reset-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #144417;
    }

    @media (max-width: 600px) {
      header {
        height: 105px;
        padding: 5px;
      }
      .stat-label {
        font-size: 0.6rem;
      }
      .stat-value {
        font-size: 0.85rem;
      }
      body {
        padding-top: 115px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="selector-box">
      <select id="block-select" onchange="changeBlock()">
        <option value="all">Examen Completo (100 preguntas)</option>
        <option value="b1">Bloque 1: Preguntas 1 - 25</option>
        <option value="b2">Bloque 2: Preguntas 26 - 50</option>
        <option value="b3">Bloque 3: Preguntas 51 - 75</option>
        <option value="b4">Bloque 4: Preguntas 76 - 100</option>
      </select>
    </div>
    <div class="stat-box">
      <span class="stat-label">Tiempo</span>
      <span class="stat-value" id="timer">⏱️ 00:00</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Contestadas</span>
      <span class="stat-value" id="progress">📝 0/0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Aciertos</span>
      <span class="stat-value" id="accuracy">🎯 0%</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Nota</span>
      <span class="stat-value" id="score">⭐ 0.00/10</span>
    </div>
  </header>

  <div class="container">
    <h1 class="test-title" id="test-title">EXAMEN TEMAS IV, V Y BLOQUE CONSTITUCIONAL</h1>
    <div id="quiz-container"></div>
    <div class="reset-container">
      <button class="reset-btn" onclick="resetQuiz()">Reiniciar Test</button>
    </div>
  </div>

  <script>
    const allQuestions = [
      {
        question: "1. El Parlamento de Andalucía acuerda tramitar una iniciativa que afecta a la organización básica de una institución estatutaria, pero pretende hacerlo mediante un \"procedimiento abreviado\" sin debate sustancial en Pleno. ¿Qué objeción técnico-jurídica es más sólida?",
        options: [
          "A) La validez del procedimiento abreviado depende exclusivamente de la Mesa, sin control posterior.",
          "B) En materias estructurales, la exigencia de deliberación parlamentaria no puede vaciarse por un atajo procedimental que comprometa garantías del ius in officium.",
          "C) El procedimiento abreviado es obligatorio cuando la iniciativa proviene del Consejo de Gobierno.",
          "D) El procedimiento abreviado solo está prohibido para reformas constitucionales."
        ],
        correct: 1
      },
      {
        question: "2. Una ley autonómica impone a los diputados votar conforme a instrucciones escritas del partido, bajo sanción de pérdida automática del escaño. La tacha más directa es que vulnera:",
        options: [
          "A) La prohibición de mandato imperativo y el principio de representación política.",
          "B) El principio de jerarquía normativa, exclusivamente.",
          "C) La potestad reglamentaria del Gobierno.",
          "D) La institución del referéndum consultivo."
        ],
        correct: 0
      },
      {
        question: "3. El Consejo de Gobierno dicta una norma reglamentaria que reorganiza órganos administrativos periféricos con impacto en competencias internas de una Consejería. Para justificar la técnica normativa correcta, lo más ajustado es:",
        options: [
          "A) La reordenación orgánica interna se realiza necesariamente por ley formal.",
          "B) Puede realizarse por decreto u orden, según el rango exigido por la norma de creación y la reserva material existente.",
          "C) Toda reorganización administrativa exige decreto-ley.",
          "D) Solo puede realizarse por resolución del titular de la Consejería."
        ],
        correct: 1
      },
      {
        question: "4. En la investidura del Presidente de la Junta, tras una primera votación fallida, se celebra una segunda votación con umbral inferior. La lógica constitucional-parlamentaria que inspira este diseño busca:",
        options: [
          "A) Bloquear la formación de gobierno para reforzar el control parlamentario.",
          "B) Facilitar la formación de mayoría de gobierno sin eliminar el requisito de legitimación parlamentaria.",
          "C) Asegurar siempre gobiernos de coalición.",
          "D) Sustituir el principio democrático por el principio de eficacia."
        ],
        correct: 1
      },
      {
        question: "5. El Gobierno dicta un decreto-ley que regula el régimen electoral general. El problema principal es:",
        options: [
          "A) El decreto-ley solo puede dictarse con autorización previa del Congreso.",
          "B) La materia está vedada al decreto-ley por sus límites materiales (afectación al régimen de instituciones básicas/derechos y, además, reserva de ley).",
          "C) El decreto-ley es inválido solo si no se publica en el BOE.",
          "D) El decreto-ley no requiere convalidación parlamentaria."
        ],
        correct: 1
      },
      {
        question: "6. Un ciudadano invoca el \"derecho a la buena administración\" frente a la Junta, alegando retrasos reiterados y ausencia de motivación. Desde la perspectiva del bloque estatutario/organizativo andaluz, el núcleo exigible es:",
        options: [
          "A) Solo un principio programático sin consecuencias jurídicas.",
          "B) Exigencias de motivación, imparcialidad, plazo razonable y respuesta adecuada como estándar de actuación administrativa.",
          "C) Únicamente el derecho a recibir copia gratuita de todo expediente.",
          "D) La obligación de estimar siempre las solicitudes cuando haya silencio."
        ],
        correct: 1
      },
      {
        question: "7. La Cámara de Cuentas fiscaliza la gestión económico-financiera del sector público andaluz. ¿Qué combinación de controles es más correcta?",
        options: [
          "A) Solo control interno: la fiscalización externa está prohibida.",
          "B) Control externo autonómico (Cámara de Cuentas) + control externo estatal (Tribunal de Cuentas) en sus respectivos ámbitos, sin anular el control interno (Intervención).",
          "C) La Cámara de Cuentas sustituye por completo a la Intervención General.",
          "D) La fiscalización externa es exclusiva del Parlamento, no de órganos técnicos."
        ],
        correct: 1
      },
      {
        question: "8. Se limita por norma reglamentaria la libertad de expresión imponiendo autorización previa para organizar una charla crítica con el Gobierno. La vulneración constitucional más directa es:",
        options: [
          "A) Art. 20 CE: prohibición de censura previa y garantía de la libertad de expresión/información.",
          "B) Art. 33 CE: propiedad privada.",
          "C) Art. 38 CE: libertad de empresa.",
          "D) Art. 128 CE: intervención de empresas."
        ],
        correct: 0
      },
      {
        question: "9. Una Consejería crea una \"entidad instrumental\" para ejecutar políticas públicas con autonomía de gestión, pero con financiación mayoritariamente pública y sujeción a controles. La calificación más precisa (según el esquema LAJA-sector público) es:",
        options: [
          "A) Siempre sociedad mercantil, por definición.",
          "B) Puede ser agencia (administrativa/empresarial/régimen especial) u otra entidad del sector público, según funciones, potestades y régimen jurídico aplicable.",
          "C) Es siempre una fundación, porque tiene fines de interés general.",
          "D) Es necesariamente un consorcio, porque coopera con ayuntamientos."
        ],
        correct: 1
      },
      {
        question: "10. El Parlamento de Andalucía ejerce control político ordinario del Consejo de Gobierno. ¿Qué instrumento encaja mejor cuando se pretende exigir responsabilidad política global?",
        options: [
          "A) Comparecencia informativa.",
          "B) Interpelación sectorial sin votación.",
          "C) Moción de censura (o mecanismo estatutariamente previsto).",
          "D) Pregunta oral en comisión."
        ],
        correct: 2
      },
      {
        question: "11. Si una Administración deniega acceso a un archivo administrativo sin motivación suficiente, el primer estándar constitucional afectado (además del de legalidad) se asienta en:",
        options: [
          "A) Principios y sometimiento pleno a la ley y al Derecho.",
          "B) Libertad ideológica.",
          "C) Derecho al honor.",
          "D) Derecho de huelga."
        ],
        correct: 0
      },
      {
        question: "12. El Defensor del Pueblo Andaluz inicia actuaciones por quejas masivas relativas a una Consejería. ¿Cuál es el encuadre correcto de su función?",
        options: [
          "A) Órgano jurisdiccional con potestad sancionadora.",
          "B) Comisionado parlamentario para la defensa de derechos y supervisión de la actividad administrativa, con potestades de investigación y recomendación.",
          "C) Órgano ejecutivo que sustituye al Consejero en caso de crisis.",
          "D) Delegación territorial del Ministerio Fiscal."
        ],
        correct: 1
      },
      {
        question: "13. Una ley andaluza crea un órgano consultivo autonómico y pretende que sus dictámenes sean vinculantes en todos los procedimientos. ¿Qué afirmación es más sólida?",
        options: [
          "A) La consultividad suele ser preceptiva en supuestos tasados, pero la vinculación generalizada vaciaría la competencia decisoria del órgano competente y alteraría el sistema de responsabilidad.",
          "B) Todo dictamen consultivo es constitucionalmente vinculante.",
          "C) Los dictámenes solo pueden ser vinculantes si los emite el Parlamento.",
          "D) Solo pueden ser vinculantes en procedimientos sancionadores."
        ],
        correct: 0
      },
      {
        question: "14. En un recurso contencioso, la parte alega que la Administración actuó arbitrariamente. El soporte constitucional de esta prohibición se asienta, de modo más directo, en:",
        options: [
          "A) Principio de legalidad y prohibición de arbitrariedad de los poderes públicos.",
          "B) Principio de autonomía municipal.",
          "C) Principio de unidad de mercado.",
          "D) Principio de reserva de ley orgánica."
        ],
        correct: 0
      },
      {
        question: "15. El Consejo Audiovisual de Andalucía adopta un acuerdo que afecta a operadores privados. ¿Qué idea es más compatible con un modelo estatutario de autoridad administrativa independiente?",
        options: [
          "A) Actúa como órgano político sin motivación, por ser \"independiente\".",
          "B) Debe sujetarse a legalidad, motivación y control jurisdiccional, aunque su diseño busque neutralidad y tecnicidad.",
          "C) Sus decisiones no pueden ser impugnadas.",
          "D) Solo puede emitir recomendaciones no vinculantes."
        ],
        correct: 1
      },
      {
        question: "16. La Junta dicta una disposición que denomina \"instrucción\" pero contiene normas generales obligatorias para terceros. La consecuencia más probable es:",
        options: [
          "A) Es válida por el nombre del acto.",
          "B) Puede ser anulable/nula por infringir el principio de jerarquía y el régimen de disposiciones generales: el contenido manda sobre la etiqueta.",
          "C) Queda convalidada automáticamente si se publica.",
          "D) Se convierte en ley si la firma el Presidente."
        ],
        correct: 1
      },
      {
        question: "17. Un ciudadano es sancionado por hechos que no estaban tipificados cuando se cometieron. El principio constitucional lesionado es:",
        options: [
          "A) Irretroactividad de disposiciones sancionadoras no favorables y principio de legalidad sancionadora.",
          "B) Principio de eficacia administrativa.",
          "C) Principio de cooperación.",
          "D) Principio de subsidiariedad."
        ],
        correct: 0
      },
      {
        question: "18. En el diseño institucional andaluz, ¿qué rasgo define mejor la relación Parlamento-Presidente-Consejo de Gobierno?",
        options: [
          "A) Separación rígida sin dependencia recíproca.",
          "B) Modelo parlamentario: el Gobierno nace de la confianza parlamentaria y está sujeto a control político continuado.",
          "C) Presidencialismo: el Parlamento no controla al Ejecutivo.",
          "D) Directorio: el Presidente es elegido por sufragio directo."
        ],
        correct: 1
      },
      {
        question: "19. Se debate si una Delegación Territorial puede dictar actos que agoten la vía administrativa en nombre de una Consejería. La respuesta correcta depende principalmente de:",
        options: [
          "A) La atribución normativa expresa de competencias, desconcentración o delegación según el régimen de organización administrativa.",
          "B) La voluntad exclusiva del Delegado.",
          "C) La costumbre administrativa.",
          "D) La petición del interesado."
        ],
        correct: 0
      },
      {
        question: "20. Una norma restringe el derecho de reunión imponiendo autorización previa por \"razones de orden público\" sin control. La doctrina constitucional más asentada exige que:",
        options: [
          "A) Toda reunión requiere autorización previa administrativa.",
          "B) El orden público justifica prohibir cualquier reunión en espacio público.",
          "C) La regla sea comunicación previa y solo caben prohibición/modificación motivadas por razones tasadas y proporcionales.",
          "D) La reunión esté prohibida en edificios públicos en todo caso."
        ],
        correct: 2
      },
      {
        question: "21. El Parlamento de Andalucía aprueba una ley y el Consejo de Gobierno retrasa su publicación para condicionar su eficacia. ¿Qué estándar es más exigible?",
        options: [
          "A) La publicación oficial es presupuesto de eficacia y no puede manipularse arbitrariamente por el Ejecutivo.",
          "B) La publicación es facultativa.",
          "C) El Ejecutivo puede suspender leyes por oportunidad política.",
          "D) La publicación solo es exigible si hay sanciones."
        ],
        correct: 0
      },
      {
        question: "22. En la estructura del sector público andaluz, ¿qué criterio distingue con mayor precisión una sociedad mercantil pública de una agencia administrativa?",
        options: [
          "A) La sociedad mercantil ejerce típicamente potestades administrativas intensas; la agencia administrativa nunca gestiona servicios públicos.",
          "B) La sociedad mercantil se rige por Derecho privado (con sujeción a controles públicos), mientras la agencia administrativa se integra en el Derecho público y puede ejercer potestades administrativas.",
          "C) La sociedad mercantil siempre depende del Parlamento; la agencia siempre del TSJA.",
          "D) No existe distinción, son sinónimos."
        ],
        correct: 1
      },
      {
        question: "23. El Defensor del Pueblo (estatal) puede promover recurso de inconstitucionalidad. En cambio, ¿quiénes están legitimados constitucionalmente para interponerlo (entre otros)?",
        options: [
          "A) Solo ciudadanos afectados.",
          "B) Gobierno, 50 diputados, 50 senadores, órganos colegiados ejecutivos autonómicos y asambleas autonómicas en su ámbito, además del Defensor del Pueblo.",
          "C) Cualquier juez sin trámite.",
          "D) Únicamente los Consejos Consultivos."
        ],
        correct: 1
      },
      {
        question: "24. Un órgano colegiado administrativo adopta acuerdo sin incluir en acta la identidad de los asistentes ni el sentido de la votación. Para un estándar robusto de validez y control, lo esencial es:",
        options: [
          "A) El acta es irrelevante si el acuerdo \"es bueno\".",
          "B) La constancia formal de constitución, deliberación y voto es garantía de regularidad, motivación y control posterior.",
          "C) Solo importa el sello.",
          "D) Basta la comunicación por WhatsApp."
        ],
        correct: 1
      },
      {
        question: "25. La Presidencia de la Junta y el Consejo de Gobierno aprueban un plan estratégico que condiciona a varias Consejerías. ¿Qué principio organizativo debe gobernar su ejecución interdepartamental?",
        options: [
          "A) Independencia absoluta de cada Consejería.",
          "B) Coordinación y dirección política unitaria del Ejecutivo, con distribución competencial interna.",
          "C) Sustitución automática por el Parlamento.",
          "D) Competencia exclusiva de las Delegaciones Provinciales."
        ],
        correct: 1
      },
      {
        question: "26. Se cuestiona la constitucionalidad de una norma por vulnerar el contenido esencial de un derecho fundamental. El concepto \"contenido esencial\" opera como:",
        options: [
          "A) Un límite absoluto a cualquier regulación legislativa.",
          "B) Un criterio para que la ley no vacíe el derecho, preservando su núcleo indisponible frente al legislador.",
          "C) Una facultad discrecional del Gobierno.",
          "D) Un criterio solo aplicable a derechos patrimoniales."
        ],
        correct: 1
      },
      {
        question: "27. El Consejo Consultivo emite dictamen preceptivo en un procedimiento. ¿Qué efecto es el más correcto?",
        options: [
          "A) Vincula siempre el sentido de la decisión.",
          "B) Obliga a solicitarlo en los casos previstos; su ausencia puede viciar el procedimiento, pero el órgano decisor mantiene competencia y responsabilidad.",
          "C) Sustituye la motivación del acto final.",
          "D) Impide el control judicial."
        ],
        correct: 1
      },
      {
        question: "28. Se pretende aprobar un decreto-ley autonómico para regular el régimen interno del Parlamento. ¿Qué objeción estructural es más sólida?",
        options: [
          "A) Es posible siempre que sea urgente.",
          "B) El régimen interno parlamentario se integra en la autonomía parlamentaria y, en su caso, exige norma del Parlamento, no del Ejecutivo.",
          "C) Solo se prohíbe si afecta a derechos fundamentales.",
          "D) Es válido si lo ratifica el Consejo Consultivo."
        ],
        correct: 1
      },
      {
        question: "29. Una ley establece que los jueces deben pedir autorización al Gobierno para dictar sentencia en asuntos \"sensibles\". La lesión constitucional es:",
        options: [
          "A) Independencia judicial y sometimiento exclusivo a la ley.",
          "B) Derecho a la propiedad.",
          "C) Derecho a la libertad de empresa.",
          "D) Principio de cooperación."
        ],
        correct: 0
      },
      {
        question: "30. En Andalucía, la función legislativa corresponde al Parlamento. ¿Qué supuesto describe mejor una colaboración legítima Ejecutivo-Legislativo sin invadir competencias?",
        options: [
          "A) El Consejo de Gobierno aprueba leyes sin Parlamento.",
          "B) El Consejo de Gobierno presenta proyectos de ley y ejerce iniciativa legislativa en los términos estatutarios y reglamentarios.",
          "C) El Parlamento dicta reglamentos internos de Consejerías.",
          "D) La Cámara de Cuentas aprueba presupuestos."
        ],
        correct: 1
      },
      {
        question: "31. Una Consejería dicta una circular interna y pretende sancionar a ciudadanos por incumplirla. ¿Qué conclusión es correcta?",
        options: [
          "A) Es posible si la circular está publicada en la web.",
          "B) Una circular/instrucción interna no puede crear obligaciones sancionables para terceros sin cobertura normativa adecuada (reserva de ley/tipicidad).",
          "C) Es posible si lo autoriza el Director General.",
          "D) Es posible solo en materia tributaria."
        ],
        correct: 1
      },
      {
        question: "32. El Senado veta un proyecto aprobado por el Congreso. ¿Qué regla constitucional describe mejor el desenlace ordinario?",
        options: [
          "A) El veto del Senado es absoluto.",
          "B) El Congreso puede levantar el veto por mayoría absoluta (o simple tras plazo) según el art. 90 CE.",
          "C) El veto convierte el proyecto en ley orgánica.",
          "D) El Gobierno decide en última instancia."
        ],
        correct: 1
      },
      {

          "C) Órgano legislativo.",
          "D) Órgano militar."
        ],
        correct: 1
      },
      {
        question: "86. La Constitución reconoce el derecho a la educación y la libertad de enseñanza. Un estándar clásico es que:",
        options: [
          "A) La educación es solo una actividad privada sin intervención pública.",
          "B) Se garantiza el derecho, con programación general de la enseñanza y participación de la comunidad educativa en los términos legales.",
          "C) Está prohibida la enseñanza concertada.",
          "D) No existe derecho a la educación."
        ],
        correct: 1
      },
      {
        question: "87. Una Consejería dicta una orden que crea un órgano colegiado nuevo con funciones permanentes y estructura estable. Para minimizar riesgo de invalidez, lo determinante es:",
        options: [
          "A) Que lo firme el Secretario General.",
          "B) Que exista habilitación normativa suficiente sobre creación y rango, respetando reserva organizativa y jerarquía.",
          "C) Que sea urgente.",
          "D) Que se publique en redes sociales."
        ],
        correct: 1
      },
      {
        question: "88. En el sector público andaluz, cuando una entidad instrumental gestiona fondos públicos, un riesgo de invalidez/irregularidad surge si:",
        options: [
          "A) Aplica la ley de contratos del sector público.",
          "B) Se eluden reglas de contratación, subvenciones o transparencia bajo la excusa de utilizar una personalidad jurídica privada.",
          "C) Se somete a la Cámara de Cuentas.",
          "D) Rinde cuentas al Parlamento."
        ],
        correct: 1
      },
      {
        question: "89. En la Constitución, el principio de autonomía local se refleja especialmente en:",
        options: [
          "A) La disolución de ayuntamientos por decreto sin control.",
          "B) Garantía de autonomía municipal y elección de concejales por sufragio, con personalidad jurídica plena.",
          "C) Supresión de provincias.",
          "D) Designación de alcaldes por el Rey."
        ],
        correct: 1
      },
      {
        question: "90. El TSJA conoce, entre otros, de recursos contencioso-administrativos en su ámbito. ¿Qué idea es correcta?",
        options: [
          "A) El TSJA sustituye al Tribunal Supremo.",
          "B) El TSJA es culminación jurisdiccional en la Comunidad, pero cabe recurso/competencia del Tribunal Supremo según leyes procesales y materia.",
          "C) El TSJA dicta reglamentos.",
          "D) El TSJA aprueba presupuestos."
        ],
        correct: 1
      },
      {
        question: "91. En un sistema estatutario, ¿qué justifica que ciertas instituciones (Defensor, Cámara de Cuentas, Consejo Consultivo) se configuren con garantías de independencia?",
        options: [
          "A) Para que no rindan cuentas.",
          "B) Para asegurar control técnico, neutralidad y protección de derechos/finanzas frente a vaivenes partidistas, manteniendo control parlamentario/jurisdiccional.",
          "C) Para sustituir al Parlamento.",
          "D) Para legislar."
        ],
        correct: 1
      },
      {
        question: "92. El principio de \"unidad de la Nación\" convive con el \"derecho a la autonomía\" porque:",
        options: [
          "A) Son incompatibles.",
          "B) La Constitución articula un Estado autonómico: unidad política + autonomía para nacionalidades y regiones dentro del marco constitucional.",
          "C) La autonomía elimina la unidad.",
          "D) La unidad elimina toda autonomía."
        ],
        correct: 1
      },
      {
        question: "93. Si un decreto autonómico regula materias propias de reserva de ley y además contradice una ley autonómica previa, el vicio más robusto es:",
        options: [
          "A) Simple irregularidad.",
          "B) Nulidad por infracción de jerarquía normativa y reserva de ley.",
          "C) Validez por ser posterior.",
          "D) Convalidación por la Cámara de Cuentas."
        ],
        correct: 1
      },
      {
        question: "94. El Congreso autoriza al Gobierno para dictar normas con rango de ley en una materia. La técnica constitucional es:",
        options: [
          "A) Referéndum consultivo.",
          "B) Delegación legislativa (ley de bases o ley ordinaria de delegación), con límites y control.",
          "C) Ley orgánica automática.",
          "D) Moción de censura."
        ],
        correct: 1
      },
      {
        question: "95. Un órgano administrativo autonómico deniega una subvención por \"criterios políticos\" sin aplicar bases reguladoras. ¿Qué reproche es más fuerte?",
        options: [
          "A) Ninguno.",
          "B) Infracción de legalidad, igualdad y prohibición de arbitrariedad: desviación de poder y falta de motivación/aplicación de criterios objetivos.",
          "C) Solo un defecto formal subsanable siempre.",
          "D) Convalidación si hay crédito."
        ],
        correct: 1
      },
      {
        question: "96. En la Constitución, el control judicial de la actuación administrativa se expresa especialmente en:",
        options: [
          "A) Prohibición de recursos.",
          "B) Sometimiento de la Administración a la ley y control por los tribunales (incluida la potestad reglamentaria y la legalidad de la actuación).",
          "C) Control exclusivo del Parlamento.",
          "D) Control exclusivo del Rey."
        ],
        correct: 1
      },
      {
        question: "97. En Andalucía, la organización territorial administrativa busca acercar servicios. ¿Qué instrumento expresa mejor esa finalidad sin crear nueva persona jurídica?",
        options: [
          "A) Desconcentración territorial mediante delegaciones/servicios periféricos.",
          "B) Privatización.",
          "C) Derogación del Estatuto.",
          "D) Suspensión de la autonomía."
        ],
        correct: 0
      },
      {
        question: "98. Un proyecto de reforma constitucional por la vía agravada (art. 168 CE) se caracteriza por:",
        options: [
          "A) Tramitación idéntica a la ordinaria.",
          "B) Aprobación por 2/3, disolución de Cortes, nueva aprobación por 2/3 y referéndum obligatorio.",
          "C) Aprobación por mayoría simple.",
          "D) Aprobación por decreto-ley."
        ],
        correct: 1
      },
      {
        question: "99. Una agencia andaluza adopta un plan de inspección ambiental. ¿Qué garantía es decisiva para evitar arbitrariedad?",
        options: [
          "A) Secreto absoluto.",
          "B) Criterios objetivos, publicidad adecuada cuando proceda, motivación y sujeción a legalidad, con control interno/externo y jurisdiccional.",
          "C) Decisión discrecional sin expediente.",
          "D) Selección por afinidad política."
        ],
        correct: 1
      },
      {
        question: "100. La Constitución define a España como Estado social y democrático de Derecho. Una consecuencia práctica nuclear es que:",
        options: [
          "A) El Gobierno está por encima de la ley.",
          "B) Todos los poderes públicos están sometidos a la Constitución y al resto del ordenamiento, con garantía de derechos y control jurisdiccional.",
          "C) No existe separación de poderes.",
          "D) La ley no necesita publicarse."
        ],
        correct: 1
      }
    ];

    const quizBlocks = {
      "all": allQuestions,
      "b1": allQuestions.slice(0, 25),
      "b2": allQuestions.slice(25, 50),
      "b3": allQuestions.slice(50, 75),
      "b4": allQuestions.slice(75, 100)
    };

    let activeData = [];
    let answeredCount = 0;
    let correctCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function changeBlock() {
      const selected = document.getElementById('block-select').value;
      activeData = quizBlocks[selected] || quizBlocks["all"];

      const titles = {
        "all": "EXAMEN TEMAS IV, V Y BLOQUE CONSTITUCIONAL (100 PREGUNTAS)",
        "b1": "BLOQUE 1: PREGUNTAS 1 A 25",
        "b2": "BLOQUE 2: PREGUNTAS 26 A 50",
        "b3": "BLOQUE 3: PREGUNTAS 51 A 75",
        "b4": "BLOQUE 4: PREGUNTAS 76 A 100"
      };

      document.getElementById('test-title').textContent = titles[selected] || titles["all"];
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = "¡Correcto!";
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(65 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}).`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const finalScore = activeData.length > 0 ? ((correctCount / activeData.length) * 10).toFixed(2) : "0.00";
      document.getElementById('score').textContent = `⭐ ${finalScore}/10`;
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar
    changeBlock();
  </script>
</body>
</html>
