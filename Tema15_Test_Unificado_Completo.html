  <style>
    :root {
      --primary: #1b5e20;

      --text: #333333;
      --border: #e0e0e0;

    * {

      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    body {
      background-color: var(--background);
      color: var(--text);
      padding-top: 105px;
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* Header Fijo Flotante */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 0 10px;
      flex-wrap: wrap;
    }

    .selector-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .selector-box select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: bold;
      background-color: white;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
    }

    /* Contenedor Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .test-title {
      text-align: center;
      margin: 20px 0;
      font-size: 1.2rem;
      color: var(--primary);
    }

    /* Tarjetas de Preguntas */
    .question-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .question-text {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: #fff;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: #e8f5e9 !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffebee !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
      font-weight: bold;
    }

    .feedback {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #e8f5e9;
      color: var(--success);
      border: 1px solid #c8e6c9;
    }

    .feedback.incorrect {
      display: block;
      background-color: #ffebee;
      color: var(--error);
      border: 1px solid #ffcdd2;
    }

    /* Botón Reiniciar */
    .reset-container {
      text-align: center;

    .reset-btn {

    .box, .btn-volver {

      border-radius: 0.5rem;

    }

  </style>
</head>

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDxijpzkKAmP85H5MqYsS_UnnmS1ySAgC0",
      authDomain: "oposiciones-tests.firebaseapp.com",
      databaseURL: "https://oposiciones-tests-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "oposiciones-tests",
      storageBucket: "oposiciones-tests.firebasestorage.app",
      messagingSenderId: "334815991038",
      appId: "1:334815991038:web:287c3c46c72ee9837ec1af",
      measurementId: "G-55K6MR5WKS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ⚠️ CAMBIAR ESTE NÚMERO SEGÚN EL TEMA (1, 2, 14, 17, etc.)
    const CURRENT_TOPIC_ID = 15;

    // Guardar nota e intentos en Firebase
    window.saveTestResults = async function(scoreNum) {
      if (window.testSavedForThisSession) return;
      window.testSavedForThisSession = true;

      try {
        const topicRef = ref(db, `progress/${CURRENT_TOPIC_ID}`);
        const snapshot = await get(topicRef);
        const data = snapshot.val() || {};

        const newAttempts = (data.attempts || 0) + 1;
        const currentBest = data.bestScore || 0;
        const newBest = Math.max(currentBest, parseFloat(scoreNum.toFixed(1)));

        await set(topicRef, {
          attempts: newAttempts,
          bestScore: newBest
        });
      } catch (e) {
        console.error("Error guardando en Firebase:", e);
      }
    };

    // Borrar historial de este tema en la nube
    window.resetTopicStats = async function() {
      if (confirm(`¿Quieres borrar los intentos y la nota máxima del Tema ${CURRENT_TOPIC_ID} en la nube?`)) {
        try {
          const topicRef = ref(db, `progress/${CURRENT_TOPIC_ID}`);
          await remove(topicRef);
          alert('Progreso borrado en la nube.');
          location.reload();
        } catch (e) {
          alert('Error al intentar borrar el progreso.');
        }
      }
    };
  </script>

        {

          "options": ["a) Arden con dificultad, pues la temperatura es menor y la humedad relativa es más alta. Son fuegos que arden lentamente.", "b) Evolucionan de forma normal", "c) Arden con mayor virulencia, pues su temperatura es mayor y la humedad relativa es menor", "d) Ninguna respuesta es correcta"],

        },
        {

          "options": ["a) 10", "b) 11", "c) 12", "d) 13"],

        {

          "options": ["a) Restos de corta y operaciones selvícolas", "b) Matorral", "c) Hojarasca bajo arbolado", "d) Pastos"],

        {
          "question": "14. Desde el punto de vista de la inflamabilidad, la coscoja es una especia:",
          "options": ["a) Muy inflamable en verano", "b) Muy inflamable durante todo el año", "c) Poco inflamable", "d) Moderadamente inflamable"],

          "correct": 1
        },
        {
          "question": "17. Cuándo estamos hablando de un riesgo alto de incendio forestal por pendiente, nos estaremos moviendo en porcentajes de pendiente de:",

        },
        {

          "options": ["a) Bajo", "b) Moderado", "c) Alto", "d) Muy alto"],

        },
        {

          "options": ["a) Para su cálculo se tienen en cuenta 4 índices de calidad", "b) En el índice de calidad de las formaciones vegetales se toman valores que van del 0 al 5", "c) Se agrupa en 3 rangos de calidad total: A (muy alta, de 7 a 9), B (alta, de 4 a 6) y C (baja, de 0 a 3).", "d) Uno de los índices de calidad que lo integran es el índice de calidad por superficie forestal continua, ya que las masas forestales que presentan una continuidad en cuanto a su área de distribución, proporcionan mayor protección al suelo y posibilitan el enriquecimiento de los ecosistemas que albergan."],

        },
        {

          "options": ["a) 20 metros", "b) 30 metros", "c) 40 metros", "d) 50 metros"],

        },
        {

          "options": ["a) Hay que intentar resguardarse debajo de árboles secos, ramas muertas y rocas sueltas", "b) Si una persona no se puede retirar antes de la descarga debe tenderse en el suelo, boca abajo, con el casco puesto y la cabeza en dirección del avión, protegiéndose detrás de algún árbol o alguna roca y agarrándose a algún punto fijo para evitar que el agua pueda arrastrarla.", "c) Las herramientas deben colocarse cerca de los operarios y éstos ladera abajo.", "d) Todas las respuestas son correctas"],

        },
        {
          "question": "23. A la hora de utilizar la motosierra; Señale la INCORRECTA:",

          "correct": 3
        }
      ]
    };

    // Crear la combinación total unificada
    quizBlocks["all"] = [
      ...quizBlocks["t15_1"], 
      ...quizBlocks["t15_2"]
    ];

    let activeData = [];
    let answeredCount = 0;
    let correctCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function changeBlock() {
      const selected = document.getElementById('block-select').value;
      activeData = quizBlocks[selected] || quizBlocks["all"];

      if (selected === 'all') {
        document.getElementById('test-title').textContent = "TEMA 15 UNIFICADO: INCENDIOS FORESTALES (47 PREGUNTAS)";
      } else if (selected === 't15_1') {
        document.getElementById('test-title').textContent = "BLOQUE 1: TEST 15.1 (24 PREGUNTAS)";
      } else if (selected === 't15_2') {
        document.getElementById('test-title').textContent = "BLOQUE 2: TEST 15.2 (23 PREGUNTAS)";
      }
      resetQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      activeData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${qIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${qIndex}`;
        card.appendChild(feedback);

        container.appendChild(card);
      });

      updateStats();
    }

    function selectOption(qIndex, selectedIndex) {
      const q = activeData[qIndex];
      const card = document.getElementById(`question-${qIndex}`);
      const buttons = card.querySelectorAll('.option-btn');
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach(btn => btn.disabled = true);

      answeredCount++;

      if (selectedIndex === q.correct) {
        correctCount++;
        buttons[selectedIndex].classList.add('correct');
        feedback.textContent = "¡Correcto!";
        feedback.className = "feedback correct";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        const correctLetter = String.fromCharCode(97 + q.correct);
        feedback.textContent = `Incorrecto. La respuesta correcta es la opción ${correctLetter}).`;
        feedback.className = "feedback incorrect";
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('progress').textContent = `📝 ${answeredCount}/${activeData.length}`;
      
      const accuracyPct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracy').textContent = `🎯 ${accuracyPct}%`;

      const numericScore = activeData.length > 0 ? (correctCount / activeData.length) * 10 : 0;
      document.getElementById('score').textContent = `⭐ ${numericScore.toFixed(2)}/10`;

      // Guardar en Firebase automáticamente al responder la última pregunta
      if (answeredCount > 0 && answeredCount === activeData.length && typeof window.saveTestResults === 'function') {
        window.saveTestResults(numericScore);
      }
    }

    function resetQuiz() {
      answeredCount = 0;
      correctCount = 0;
      secondsElapsed = 0;
      
      startTimer();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Inicializar la aplicación
    changeBlock();
  </script>
